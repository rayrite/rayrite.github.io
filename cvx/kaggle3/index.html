    counts: "2 comprehensive md (124 KB)", home: "01_Dataset_Classification_and_Root_Cause_Analysis.md", homeLabel: "Dataset RCA" }

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ncmp = (a, b) => a.localeCompare(b, undefined, { numeric: true });
const BY_PATH = new Map(DOCS.map(d => [d.p, d]));
DOCS.sort((a, b) => ncmp(a.p, b.p));
const cache = new Map();

/* ---------------- theme ---------------- */
(function () {
  const saved = localStorage.getItem("rr-kaggle3-theme");
  if (saved) document.documentElement.dataset.theme = saved;
  $("themeBtn").onclick = () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    localStorage.setItem("rr-kaggle3-theme", next);
  };
})();

/* ---------------- sidebar tree ---------------- */
function dirNode() { return { dirs: new Map(), files: [] }; }
function buildTree(entries) {
  const root = dirNode();
  for (const d of entries) {
    const segs = d.rel.split("/");
    let node = root;
    for (let i = 0; i < segs.length - 1; i++) {
      if (!node.dirs.has(segs[i])) node.dirs.set(segs[i], dirNode());
      node = node.dirs.get(segs[i]);
    }
    node.files.push({ name: segs[segs.length - 1], p: d.p, t: d.t });
  }
  return root;
}
function renderDir(node, forceOpen) {
  /* compact single-child folder chains: a/b/c → "a/b/c" */
  let h = "";
  const dirs = [...node.dirs.entries()].sort((a, b) => ncmp(a[0], b[0]));
  for (let [name, child] of dirs) {
    while (child.files.length === 0 && child.dirs.size === 1) {
      const [k, v] = [...child.dirs.entries()][0];
      name = name + "/" + k; child = v;
    }
    h += `<details class="dir"${forceOpen ? " open" : ""}><summary><span class="tw">▶</span><span class="nm">${esc(name)}</span></summary><div class="tree">${renderDir(child, forceOpen)}</div></details>`;
  }
  const files = [...node.files].sort((a, b) => ncmp(a.name, b.name));
  for (const f of files) {
    const isHtml = /\.html?$/i.test(f.name);
    /* HTML documents always open full-screen in their own tab */
    const href = isHtml ? encodeURI(f.p) : "#/" + encodeURI(f.p);
    const ext = isHtml ? ' target="_blank" rel="noopener"' : "";
    h += `<a class="file" href="${href}"${ext} data-p="${esc(f.p)}" title="${esc(f.t || f.name)}"><span class="dot"></span><span class="nm">${esc(f.name.replace(/\.(md|html?)$/i, ""))}</span>${isHtml ? '<span class="ht">html</span>' : ""}</a>`;
  }
  return h;
}
function renderTree(forceOpen) {
  let h = "";
  for (const g of GROUPS) {
    const entries = DOCS.filter(d => d.p.startsWith(g.f + "/")).map(d => ({ ...d, rel: d.p.slice(g.f.length + 1) }));
    const nMd = entries.filter(d => /\.md$/i.test(d.p)).length;
    const nHtml = entries.length - nMd;
    h += `<details class="grp" open data-grp="${esc(g.f)}"><summary><span class="tw">▶</span><span class="gdot"></span><span>${esc(g.name.split(" — ")[0])}</span><span class="cnt">${nMd + nHtml}</span></summary><div class="tree">${renderDir(buildTree(entries), forceOpen)}</div></details>`;
  }
  $("tree").innerHTML = h;
  const md = DOCS.filter(d => /\.md$/i.test(d.p)).length;
  $("fileCount").textContent = `${DOCS.length} documents · ${md} md · ${DOCS.length - md} html`;
  markCurrent();
}
function markCurrent() {
  document.querySelectorAll("#tree a.file").forEach(a => a.classList.toggle("on", a.dataset.p === current));
}

/* ---------------- filter ---------------- */
$("fq").addEventListener("input", () => {
  const q = $("fq").value.trim().toLowerCase();
  document.querySelectorAll("#tree a.file").forEach(a => {
    const hit = !q || a.dataset.p.toLowerCase().includes(q) || (a.title || "").toLowerCase().includes(q);
    a.hidden = !hit;
  });
  [...document.querySelectorAll("#tree details")].reverse().forEach(dt => {
    if (q) {
      dt.dataset.wasOpen = dt.open ? "1" : "0";
      const hasHit = [...dt.querySelectorAll("a.file")].some(a => !a.hidden);
      dt.hidden = dt.classList.contains("dir") ? !hasHit && !dt.querySelector("details:not([hidden])") : !hasHit;
      if (hasHit) dt.open = true;
    } else {
      dt.hidden = false;
      if (dt.dataset.wasOpen !== undefined) dt.open = dt.dataset.wasOpen === "1";
    }
  });
});

/* ---------------- routing & rendering ---------------- */
let current = null;
const MD = DOCS.filter(d => !/\.html?$/i.test(d.p));
function route() {
  const h = decodeURI(location.hash.replace(/^#\/?/, ""));
  const d = h ? BY_PATH.get(h) : null;
  if (!d) showOverview();
  else if (/\.html?$/i.test(d.p)) showHtmlLaunch(d);
  else loadDoc(d.p);
}
window.addEventListener("hashchange", route);

function setNav() {
  const idx = MD.findIndex(d => d.p === current);
  const has = idx >= 0;
  $("navbar").hidden = !has; $("bottombar").hidden = !has; $("tocBtn").hidden = !has;
  if (!has) return;
  $("pos").textContent = `${idx + 1} / ${MD.length}`;
  $("prevBtn").disabled = $("mPrev").disabled = idx <= 0;
  $("nextBtn").disabled = $("mNext").disabled = idx >= MD.length - 1;
  $("prevBtn").onclick = $("mPrev").onclick = () => { if (idx > 0) go(MD[idx - 1].p); };
  $("nextBtn").onclick = $("mNext").onclick = () => { if (idx < MD.length - 1) go(MD[idx + 1].p); };
}
function go(p) { location.hash = "#/" + encodeURI(p); }

function crumbFor(p) {
  const g = GROUPS.find(g => p.startsWith(g.f + "/"));
  return `<a href="#/">kaggle3</a> <span>/</span> <span>${esc(g ? g.f : "cvx")}</span> <span>/</span> <b>${esc(p.slice((g ? g.f + "/" : "").length))}</b> <a class="btn" style="margin-left:8px;padding:2px 8px;font-size:.68rem" href="${encodeURI(p)}" target="_blank" rel="noopener">open raw ⧉</a>`;
}

/* HTML documents never render inline: launch card → full-screen new tab */
function showHtmlLaunch(d) {
  current = null; markCurrent(); setNav();
  $("toc").hidden = true;
  $("crumb").innerHTML = crumbFor(d.p);
  document.title = `${d.t || d.p} — kaggle3`;
  $("article").innerHTML =
    `<div class="state-msg">
       <p><span class="badge">HTML document</span></p>
       <h1 style="font-size:1.15rem;margin:10px 0 4px">${esc(d.t || d.p)}</h1>
       <p class="mono" style="font-size:0.7rem;color:var(--tx2)">${esc(d.p)}</p>
       <p style="margin:12px 0">HTML documents open full-screen in their own tab.</p>
       <p style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
         <a class="btn primary" href="${encodeURI(d.p)}" target="_blank" rel="noopener">Open full-screen in new tab ⧉</a>
         <a class="btn" href="#/">Back to overview</a></p>
     </div>`;
  window.scrollTo({ top: 0 });
}

async function loadDoc(p) {
  current = p; markCurrent(); setNav();
  const d = BY_PATH.get(p);
  $("crumb").innerHTML = crumbFor(p);
  document.title = `${d.t || p} — kaggle3`;
  window.scrollTo({ top: 0 });
  let text = cache.get(p);
  if (text === undefined) {
    try {
      const r = await fetch(encodeURI(p), { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      text = await r.text();
      cache.set(p, text);
    } catch (e) {
      $("article").innerHTML = `<div class="state-msg"><p>Failed to load <code class="mono">${esc(p)}</code> (${esc(e.message)}).</p><p style="margin-top:10px"><button class="btn primary" onclick="location.reload()">Retry</button></p></div>`;
      return;
    }
  }
  const words = (text.match(/\S+/g) || []).length;
  marked.setOptions({ breaks: true, gfm: true });
  const body = DOMPurify.sanitize(marked.parse(text), { ADD_TAGS: ["details", "summary"], ADD_ATTR: ["id", "class", "align", "target"] });
  $("article").innerHTML =
    `<h1>${esc(d.t || p.replace(/\.md$/i, ""))}</h1>
     <div class="byline"><span>${words.toLocaleString()} words · ~${Math.max(1, Math.round(words / 220))} min read</span><span class="mono">${esc(p)}</span></div>
     ${body}`;
  buildToc();
  if (window.Prism) Prism.highlightAllUnder($("article"));
  interceptArticleLinks();
}

function interceptArticleLinks() {
  $("article").querySelectorAll("a[href]").forEach(a => {
    const raw = a.getAttribute("href");
    if (!raw || raw.startsWith("#") || /^(https?:|mailto:|javascript:)/i.test(raw)) return;
    try {
      const curDir = current && current.includes("/") ? current.slice(0, current.lastIndexOf("/") + 1) : "";
      let target = (raw.startsWith("/") ? raw.slice(1) : curDir + raw).replace(/^\.\//, "");
      target = target.replace(/([^/]+)\/\.\.\//g, "");
      if (BY_PATH.has(target)) {
        a.onclick = e => {
          e.preventDefault();
          if (/\.html?$/i.test(target)) window.open(encodeURI(target), "_blank", "noopener");
          else go(target);
        };
      }
    } catch {}
  });
}

function buildToc() {
  const heads = [...$("article").querySelectorAll("h2, h3")];
  $("toc").hidden = heads.length === 0;
  $("tocList").innerHTML = heads.map((h, i) => {
    if (!h.id) h.id = "h-" + i;
    return `<a class="${h.tagName === "H3" ? "l3" : ""}" href="#/${encodeURI(current)}" data-scroll="${h.id}" title="${esc(h.textContent)}">${esc(h.textContent)}</a>`;
  }).join("");
  $("tocList").querySelectorAll("a").forEach(a => a.onclick = e => {
    e.preventDefault();
    document.getElementById(a.dataset.scroll)?.scrollIntoView({ behavior: "smooth" });
  });
}

/* ---------------- overview ---------------- */
function showOverview() {
  current = null; markCurrent(); setNav();
  $("toc").hidden = true;
  $("crumb").innerHTML = `<b>kaggle3</b> <span>/</span> <span>cvx</span>`;
  document.title = "BCF Gemma-4 Deliverables — Brain · Hardening · Harness · Replay · Parity · RCA";
  const md = DOCS.filter(d => /\.md$/i.test(d.p)).length;
  const cards = GROUPS.map(g => {
    const n = DOCS.filter(d => d.p.startsWith(g.f + "/")).length;
    const home = g.f + "/" + g.home;
    return `<div class="gcard">
      <h2>${esc(g.name)}</h2>
      <div class="folder">cvx/kaggle3/${esc(g.f)}/ · ${n} docs</div>
      <p>${g.blurb}</p>
      <span class="meta">${esc(g.counts)}</span>
      <div class="row"><a class="btn primary" href="#/${encodeURI(home)}">Open ${esc(g.homeLabel)} →</a><a class="btn" href="#/" data-focus="${esc(g.f)}">Browse folder</a></div>
    </div>`;
  }).join("");
  $("article").innerHTML =
    `<div class="hero">
       <span class="badge">deliverable drop · 2026-11-11 – 2026-11-14</span>
       <h1>BCF × Gemma 4 Developer Agent Competition</h1>
       <p class="lede">Six deliverables from the Batonic Coding Framework (BCF) competition work: the submission-ready Brain agent packages, hardening research, the local test-harness setup guide, executed-backbone replay comparisons, scoring parity explainer, and the 129-task dataset RCA &amp; dual-track brain architecture. ${DOCS.length} documents (${md} markdown + ${DOCS.length - md} HTML) across 67 hosted files — markdown opens in-page from the sidebar tree, HTML decks open full-screen in their own tab.</p>
     </div>
     <div class="cards">${cards}</div>`;
  $("article").querySelectorAll("[data-focus]").forEach(b => b.onclick = e => {
    e.preventDefault();
    const dt = document.querySelector(`#tree details[data-grp="${CSS.escape(b.dataset.focus)}"]`);
    if (dt) { dt.open = true; dt.scrollIntoView({ block: "center" }); }
    document.body.classList.remove("side-open");
  });
  window.scrollTo({ top: 0 });
}

/* ---------------- pane toggles & font size ---------------- */
$("menuBtn").onclick = () => {
  if (matchMedia("(max-width: 900px)").matches) document.body.classList.toggle("side-open");
  else document.body.classList.toggle("side-closed");
};
document.querySelectorAll("#tree").forEach(t => t.addEventListener("click", e => {
  if (e.target.closest("a.file")) document.body.classList.remove("side-open");
}));
$("tocBtn").onclick = () => document.body.classList.toggle("toc-closed");

const FS = [13, 14, 15, 16, 18];
(function () {
  let i = parseInt(localStorage.getItem("rr-kaggle3-fs") || "1", 10);
  if (!(i >= 0 && i < FS.length)) i = 1;
  const apply = () => {
    document.documentElement.style.setProperty("--fs", FS[i] + "px");
    $("fontBtn").title = `Font size: ${FS[i]}px — click to cycle`;
  };
  apply();
  $("fontBtn").onclick = () => { i = (i + 1) % FS.length; localStorage.setItem("rr-kaggle3-fs", String(i)); apply(); };
})();

/* ---------------- init ---------------- */
renderTree(false);
route();
</script>
</body>
</html>
