<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVX Splash — Light Shafts</title>
<style>
  :root {
    --void: #060a13; --ink: #eef2fb; --muted: #aab6cf;
    --line: rgba(238, 242, 251, 0.14); --teal: #17e8d8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--void); color: var(--ink);
    font-family: "Segoe UI", "Avenir Next", system-ui, sans-serif;
    height: 100vh; overflow: hidden;
  }
  #bg { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .stage {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    justify-content: space-between; padding: clamp(20px, 4vw, 44px);
    opacity: 0; animation: settle 1s ease-out 0.3s forwards;
  }
  @keyframes settle { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .stage { animation: none; opacity: 1; } }
  .bar { display: flex; align-items: center; justify-content: space-between; }
  .wordmark {
    display: flex; align-items: center; gap: 12px;
    font-family: "Bahnschrift", "Segoe UI", sans-serif;
    font-weight: 700; font-size: 16px; letter-spacing: 0.14em;
  }
  .wordmark .pip {
    width: 13px; height: 13px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff5ec7, #7a2170 75%);
    box-shadow: 0 0 12px rgba(255, 94, 199, 0.7);
  }
  .variant {
    color: var(--muted); font-size: 13.5px;
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px;
  }
  .hero { text-align: center; max-width: 680px; margin: 0 auto; padding-bottom: 5vh; }
  .hero h1 {
    font-family: "Bahnschrift", "Segoe UI", sans-serif;
    font-size: clamp(2.2rem, 5.5vw, 3.8rem); font-weight: 700; line-height: 1.05;
    text-shadow: 0 2px 28px rgba(3, 6, 12, 0.85);
  }
  .hero p {
    margin: 14px auto 26px; max-width: 44ch; color: var(--muted);
    font-size: clamp(0.95rem, 1.5vw, 1.1rem); line-height: 1.6;
    text-shadow: 0 1px 18px rgba(3, 6, 12, 0.9);
  }
  .btn {
    font: inherit; font-size: 14.5px; padding: 11px 24px; border-radius: 10px;
    cursor: pointer; text-decoration: none; transition: transform 0.2s, background 0.2s;
  }
  .btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
  .btn-solid { background: var(--ink); color: #0a0f1c; border: 1px solid var(--ink); }
  .btn-solid:hover { background: #fff; transform: translateY(-1px); }
  .foot { color: var(--muted); font-size: 13px; text-align: center; }

  /* mobile & touch */
  html, body { overscroll-behavior: none; }
  body { height: 100dvh; -webkit-tap-highlight-color: transparent; }
  #bg { touch-action: none; }
  .stage { -webkit-user-select: none; user-select: none; }
  .bar { flex-wrap: wrap; row-gap: 10px; }
  @media (max-width: 640px) {
    .wordmark { font-size: 14px; }
    .variant { font-size: 11px; padding: 4px 10px; }
    .hero h1 { font-size: clamp(1.9rem, 8.5vw, 2.5rem); }
    .hero p { font-size: 0.92rem; }
    .btn { padding: 13px 28px; font-size: 15px; }
    .foot { font-size: 11.5px; }
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="stage">
  <header class="bar">
    <div class="wordmark"><span class="pip"></span>CVX SPLASH</div>
    <span class="variant">Variation — Light Shafts</span>
  </header>
  <main class="hero">
    <h1>Light Shafts</h1>
    <p>Daylight falls in slow shafts through deep, still water while marine snow sinks past at every depth.</p>
    <a class="btn btn-solid" href="#">Get started</a>
  </main>
  <footer class="foot">Move the pointer to bring a lantern</footer>
</div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("bg");
  const ctx = canvas.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TAU = Math.PI * 2;
  const rnd = (a, b) => a + Math.random() * (b - a);

  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // god rays: anchors near the surface, each with its own depth and sway
  const NRAYS = 7;
  const rays = [];
  for (let i = 0; i < NRAYS; i++) {
    rays.push({
      u: rnd(0.05, 0.95),
      w: rnd(0.03, 0.09),
      len: rnd(0.45, 0.95),
      d: rnd(0.25, 1),                     // brightness / nearness
      ph: rnd(0, TAU),
      sway: rnd(0.05, 0.12),
      tilt: rnd(-0.06, 0.14)
    });
  }

  const MCOLS = [
    [210, 230, 255], [210, 230, 255], [210, 230, 255],
    [23, 232, 216], [255, 94, 199]
  ];
  const N = 130;
  const motes = [];
  let seeded = false;

  let mx = 0.5, my = 0.45, px = -2, py = -2;
  window.addEventListener("pointermove", e => { mx = e.clientX / W; my = e.clientY / H; });
  window.addEventListener("pointerleave", () => { mx = -2; my = -2; });

  function frame(now, dt) {
    const t = now / 1000;
    px += (mx - px) * 0.07;
    py += (my - py) * 0.07;

    if (!seeded && W > 0) {
      for (let i = 0; i < N; i++) {
        motes.push({
          x: Math.random() * W, y: Math.random() * H,
          d: 0.2 + Math.random() * 0.8,     // 0.2 far … 1 at the lens
          col: MCOLS[(Math.random() * MCOLS.length) | 0],
          ph: rnd(0, TAU)
        });
      }
      seeded = true;
    }

    // deep water, dimly brighter toward the surface
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#071021");
    g.addColorStop(0.5, "#030711");
    g.addColorStop(1, "#02040a");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = "lighter";

    // broad glow from the surface
    let gr = ctx.createRadialGradient(W * 0.5, -H * 0.25, 0, W * 0.5, -H * 0.25, H * 0.95);
    gr.addColorStop(0, "rgba(40,90,140,0.22)");
    gr.addColorStop(1, "rgba(40,90,140,0)");
    ctx.fillStyle = gr;
    ctx.fillRect(0, 0, W, H);

    // god rays — far ones dim and slow, near ones bright and quick to sway
    for (const r of rays) {
      const x0 = r.u * W
               + Math.sin(t * r.sway + r.ph) * W * 0.02
               + (px > -1 ? (px - 0.5) * -40 * r.d : 0);
      const th = r.tilt + Math.sin(t * r.sway * 0.8 + r.ph * 2) * 0.05;
      const a = 0.05 + 0.08 * r.d;
      const len = r.len * H * 1.1;
      const wpx = r.w * W * (0.8 + 0.4 * r.d);

      ctx.save();
      ctx.translate(x0, -40);
      ctx.rotate(th);
      const rg = ctx.createLinearGradient(0, 0, 0, len);
      rg.addColorStop(0, `rgba(23,232,216,${a})`);
      rg.addColorStop(0.7, `rgba(23,232,216,${a * 0.35})`);
      rg.addColorStop(1, "rgba(23,232,216,0)");
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.moveTo(-wpx * 0.35, 0);
      ctx.lineTo(wpx * 0.35, 0);
      ctx.lineTo(wpx * 0.9, len);
      ctx.lineTo(-wpx * 0.9, len);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // the pointer as a soft lantern
    if (px > -1) {
      gr = ctx.createRadialGradient(px * W, py * H, 0, px * W, py * H, 190);
      gr.addColorStop(0, "rgba(210,235,255,0.10)");
      gr.addColorStop(1, "rgba(210,235,255,0)");
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(px * W, py * H, 190, 0, TAU); ctx.fill();
    }

    // marine snow sinking at every depth
    for (const m of motes) {
      m.y += (5 + 30 * m.d) * dt;                       // near snow falls faster
      m.x += Math.sin(t * 0.25 + m.ph) * 14 * dt * m.d;
      if (m.y > H + 20) { m.y = -20; m.x = Math.random() * W; }
      if (m.x < -30) m.x = W + 30; if (m.x > W + 30) m.x = -30;

      // depth of field around a focus depth of ~0.55
      const b = Math.min(Math.abs(m.d - 0.55) / 0.55, 1);
      const r = (1 + 2.6 * m.d) * (1 + 2.2 * b);

      // the lantern catches nearby snow
      let lit = 0;
      if (px > -1) {
        const dd = Math.hypot(m.x - px * W, m.y - py * H);
        if (dd < 220) lit = (1 - dd / 220) * 1.2;
      }

      const al = 0.16 + 0.4 * m.d * (1 - 0.55 * b) + lit * 0.3;
      const [cr, cg, cb] = m.col;
      const gd = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, r);
      gd.addColorStop(0, `rgba(${cr},${cg},${cb},${al})`);
      gd.addColorStop(0.75, `rgba(${cr},${cg},${cb},${al * 0.5})`);
      gd.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
      ctx.fillStyle = gd;
      ctx.beginPath(); ctx.arc(m.x, m.y, r, 0, TAU); ctx.fill();

      if (b < 0.25) {
        ctx.fillStyle = `rgba(${cr},${cg},${cb},${0.8 * (1 - b) + lit * 0.4})`;
        ctx.beginPath(); ctx.arc(m.x, m.y, Math.max(r * 0.22, 0.6), 0, TAU); ctx.fill();
      }
    }
    ctx.globalCompositeOperation = "source-over";
  }

  if (reduced) {
    // settle the snowfall, then hold
    for (let k = 0; k < 300; k++) frame(k * 16, 0.016);
  } else {
    let last = performance.now();
    requestAnimationFrame(function loop(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      frame(now, dt);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
