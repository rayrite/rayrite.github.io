<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVX Splash — Descent</title>
<style>
  :root {
    --void: #060a13; --ink: #eef2fb; --muted: #aab6cf;
    --line: rgba(238, 242, 251, 0.14); --teal: #17e8d8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--void); color: var(--ink);
    font-family: "Segoe UI", "Avenir Next", system-ui, sans-serif;
    height: 100vh; overflow: hidden;
  }
  #bg { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .stage {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    justify-content: space-between; padding: clamp(20px, 4vw, 44px);
    opacity: 0; animation: settle 1s ease-out 0.3s forwards;
  }
  @keyframes settle { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .stage { animation: none; opacity: 1; } }
  .bar { display: flex; align-items: center; justify-content: space-between; }
  .wordmark {
    display: flex; align-items: center; gap: 12px;
    font-family: "Bahnschrift", "Segoe UI", sans-serif;
    font-weight: 700; font-size: 16px; letter-spacing: 0.14em;
  }
  .wordmark .pip {
    width: 13px; height: 13px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff5ec7, #7a2170 75%);
    box-shadow: 0 0 12px rgba(255, 94, 199, 0.7);
  }
  .variant {
    color: var(--muted); font-size: 13.5px;
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px;
  }
  .hero { text-align: center; max-width: 680px; margin: 0 auto; padding-bottom: 5vh; }
  .hero h1 {
    font-family: "Bahnschrift", "Segoe UI", sans-serif;
    font-size: clamp(2.2rem, 5.5vw, 3.8rem); font-weight: 700; line-height: 1.05;
    text-shadow: 0 2px 28px rgba(3, 6, 12, 0.85);
  }
  .hero p {
    margin: 14px auto 26px; max-width: 44ch; color: var(--muted);
    font-size: clamp(0.95rem, 1.5vw, 1.1rem); line-height: 1.6;
    text-shadow: 0 1px 18px rgba(3, 6, 12, 0.9);
  }
  .btn {
    font: inherit; font-size: 14.5px; padding: 11px 24px; border-radius: 10px;
    cursor: pointer; text-decoration: none; transition: transform 0.2s, background 0.2s;
  }
  .btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
  .btn-solid { background: var(--ink); color: #0a0f1c; border: 1px solid var(--ink); }
  .btn-solid:hover { background: #fff; transform: translateY(-1px); }
  .foot { color: var(--muted); font-size: 13px; text-align: center; }

  /* mobile & touch */
  html, body { overscroll-behavior: none; }
  body { height: 100dvh; -webkit-tap-highlight-color: transparent; }
  #bg { touch-action: none; }
  .stage { -webkit-user-select: none; user-select: none; }
  .bar { flex-wrap: wrap; row-gap: 10px; }
  @media (max-width: 640px) {
    .wordmark { font-size: 14px; }
    .variant { font-size: 11px; padding: 4px 10px; }
    .hero h1 { font-size: clamp(1.9rem, 8.5vw, 2.5rem); }
    .hero p { font-size: 0.92rem; }
    .btn { padding: 13px 28px; font-size: 15px; }
    .foot { font-size: 11.5px; }
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="stage">
  <header class="bar">
    <div class="wordmark"><span class="pip"></span>CVX SPLASH</div>
    <span class="variant">Variation — Descent</span>
  </header>
  <main class="hero">
    <h1>Descent</h1>
    <p>A slow sink down the water column: light dying exponentially, snow thickening past the shimmer of the thermocline, shapes at the edge of the lantern you cannot name.</p>
    <a class="btn btn-solid" href="#">Get started</a>
  </main>
  <footer class="foot">Your lantern goes with you</footer>
</div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("bg");
  const ctx = canvas.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TAU = Math.PI * 2;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // soft dark sprite for the shapes you cannot name
  const darkSpr = (() => {
    const c = document.createElement("canvas");
    c.width = c.height = 96;
    const g = c.getContext("2d");
    const rg = g.createRadialGradient(48, 48, 0, 48, 48, 48);
    rg.addColorStop(0, "rgba(2,5,10,0.55)");
    rg.addColorStop(0.6, "rgba(2,5,10,0.35)");
    rg.addColorStop(1, "rgba(2,5,10,0)");
    g.fillStyle = rg; g.fillRect(0, 0, 96, 96);
    return c;
  })();

  const NRAYS = 6;
  const rays = [];
  for (let i = 0; i < NRAYS; i++) {
    rays.push({
      u: rnd(0.05, 0.95), w: rnd(0.03, 0.09), len: rnd(0.45, 0.95),
      d: rnd(0.25, 1), ph: rnd(0, TAU), sway: rnd(0.05, 0.12), tilt: rnd(-0.06, 0.14)
    });
  }

  // three parallax bands of snow; the camera outsinks them all
  const PAR = [0.3, 0.65, 1.1];
  const flakes = [[], [], []];
  let seeded = false;

  let D = reduced ? 56 : 0;              // depth in meters
  const SINK = 1.6;                      // m/s

  let mx = 0.5, my = 0.45, px = -2, py = -2;
  window.addEventListener("pointermove", e => { mx = e.clientX / W; my = e.clientY / H; });
  window.addEventListener("pointerleave", () => { mx = -2; my = -2; });

  const mix = (a, b, k) => a + (b - a) * k;
  const lerpHex = (h1, h2, k) => {
    const r = mix((h1 >> 16) & 255, (h2 >> 16) & 255, k) | 0;
    const g2 = mix((h1 >> 8) & 255, (h2 >> 8) & 255, k) | 0;
    const b = mix(h1 & 255, h2 & 255, k) | 0;
    return `rgb(${r},${g2},${b})`;
  };

  // snow thickens through the mid column, thins out deep with fatter flakes
  function targetCounts(d) {
    const ramp = Math.max(0, Math.min(1, (d - 20) / 8));
    const fall = Math.max(0, Math.min(1, (d - 45) / 12));
    return [
      Math.round(mix(mix(12, 24, ramp), 14, fall)),
      Math.round(mix(mix(18, 38, ramp), 20, fall)),
      Math.round(mix(mix(10, 30, ramp), 12, fall))
    ];
  }

  function frame(now, dt) {
    const t = now / 1000;
    px += (mx - px) * 0.07;
    py += (my - py) * 0.07;
    D += SINK * dt;

    const PPM = H / 34;                  // the frame holds about thirty-four meters
    const I = Math.exp(-D / 28);         // Beer's law: light dies exponentially
    const fa = Math.max(0, Math.min(1, (I - 0.15) / 0.25));   // rays gone by ~50 m

    if (!seeded && W > 0) {
      const tg = targetCounts(D);
      for (let b = 0; b < 3; b++) {
        for (let i = 0; i < tg[b]; i++) {
          flakes[b].push({ x: Math.random() * W, y: Math.random() * H, r: [1.1, 1.7, 2.6][b] * rnd(0.7, 1.3), own: rnd(2, 7), ph: rnd(0, TAU) });
        }
      }
      seeded = true;
    }

    // the water column, shallowing colors dying into abyssal black
    const k = 1 - I;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, lerpHex(0x0a1626, 0x020409, k));
    g.addColorStop(0.5, lerpHex(0x050d1c, 0x010308, k));
    g.addColorStop(1, lerpHex(0x03070f, 0x010206, k));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    if (fa > 0) {
      ctx.globalCompositeOperation = "lighter";
      let gr = ctx.createRadialGradient(W * 0.5, -H * 0.25, 0, W * 0.5, -H * 0.25, H * 0.95);
      gr.addColorStop(0, `rgba(40,90,140,${(0.22 * fa).toFixed(3)})`);
      gr.addColorStop(1, "rgba(40,90,140,0)");
      ctx.fillStyle = gr;
      ctx.fillRect(0, 0, W, H);
      for (const r of rays) {
        const x0 = r.u * W + Math.sin(t * r.sway + r.ph) * W * 0.02
                 + (px > -1 ? (px - 0.5) * -40 * r.d : 0);
        const th = r.tilt + Math.sin(t * r.sway * 0.8 + r.ph * 2) * 0.05;
        const a = (0.05 + 0.08 * r.d) * fa;
        const len = r.len * H * 1.1;
        const wpx = r.w * W * (0.8 + 0.4 * r.d);
        ctx.save();
        ctx.translate(x0, -40);
        ctx.rotate(th);
        const rg = ctx.createLinearGradient(0, 0, 0, len);
        rg.addColorStop(0, `rgba(23,232,216,${a.toFixed(3)})`);
        rg.addColorStop(0.7, `rgba(23,232,216,${(a * 0.35).toFixed(3)})`);
        rg.addColorStop(1, "rgba(23,232,216,0)");
        ctx.fillStyle = rg;
        ctx.beginPath();
        ctx.moveTo(-wpx * 0.35, 0); ctx.lineTo(wpx * 0.35, 0);
        ctx.lineTo(wpx * 0.9, len); ctx.lineTo(-wpx * 0.9, len);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      ctx.globalCompositeOperation = "source-over";
    }

    // depth ruler scrolling up the left edge — the measurable motion
    ctx.strokeStyle = "rgba(140,170,175,0.18)";
    ctx.fillStyle = "rgba(140,170,175,0.18)";
    ctx.lineWidth = 1;
    ctx.font = '11px "Segoe UI", sans-serif';
    ctx.setLineDash([2, 7]);
    ctx.beginPath(); ctx.moveTo(30, -10); ctx.lineTo(30, H + 10); ctx.stroke();
    ctx.setLineDash([]);
    const span = H / PPM;
    for (let m = Math.ceil(D / 10) * 10; m <= D + span + 10; m += 10) {
      const y = (m - D) * PPM;
      ctx.beginPath(); ctx.moveTo(24, y); ctx.lineTo(38, y); ctx.stroke();
      ctx.fillText(`${m} m`, 46, y + 3.5);
    }

    // thermocline: a shimmering step that passes up the frame once
    const yT = (30 - D) * PPM;
    if (yT > -100 && yT < H + 100) {
      ctx.globalCompositeOperation = "lighter";
      const tg2 = ctx.createLinearGradient(0, yT - 70, 0, yT + 20);
      tg2.addColorStop(0, "rgba(150,195,215,0)");
      tg2.addColorStop(0.8, "rgba(150,195,215,0.06)");
      tg2.addColorStop(1, "rgba(150,195,215,0)");
      ctx.fillStyle = tg2;
      ctx.fillRect(0, yT - 70, W, 90);
      ctx.strokeStyle = "rgba(180,220,235,0.10)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 16) {
        const dy = Math.sin(x * 0.045 + t * 1.3) * 4 + Math.sin(x * 0.013 - t * 0.7) * 3;
        ctx.moveTo(x, yT + dy); ctx.lineTo(x + 8, yT + dy);
      }
      ctx.stroke();
      ctx.globalCompositeOperation = "source-over";
    }
    // below the thermocline, visibility drops
    const veil = Math.max(0, Math.min(1, (D - 30) / 20)) * 0.22;
    if (veil > 0) {
      ctx.fillStyle = `rgba(1,3,7,${veil.toFixed(3)})`;
      ctx.fillRect(0, 0, W, H);
    }

    const cyc = Math.floor(D / 90);      // the schedule wraps, never the same twice
    const rx = px > -1 ? px * W : W * 0.5, ry = px > -1 ? py * H : H * 0.45;

    // small school, around 18 m
    {
      const y18 = (18 + 90 * cyc - D) * PPM;
      if (y18 > -120 && y18 < H + 120) {
        const bx = W * (0.2 + 0.6 * hash(cyc * 13.7 + 1.1)) + Math.sin(t * 0.2) * 20;
        for (let i = 0; i < 15; i++) {
          const ox = (hash(cyc * 13.7 + i * 2.3) * 2 - 1) * 95 + Math.sin(t * 0.6 + i) * 7;
          const oy = (hash(cyc * 7.9 + i * 3.1) * 2 - 1) * 48 + Math.cos(t * 0.5 + i * 1.7) * 6;
          const x = bx + ox, y = y18 + oy;
          const lit = px > -1 ? Math.max(0, 1 - Math.hypot(x - rx, y - ry) / 240) : 0;
          const sz = 14 + hash(i * 5.5) * 8;
          ctx.globalAlpha = 0.8;
          ctx.drawImage(darkSpr, x - sz / 2, y - sz / 2, sz, sz);
          ctx.globalAlpha = 1;
          ctx.fillStyle = `rgba(150,215,225,${(0.05 + lit * 0.1).toFixed(3)})`;
          ctx.beginPath(); ctx.arc(x, y, 1.6, 0, TAU); ctx.fill();
        }
      }
    }

    // a lone jelly silhouette, around 38 m
    {
      const y38 = (38 + 90 * cyc - D) * PPM;
      if (y38 > -150 && y38 < H + 150) {
        const x = W * (0.25 + 0.5 * hash(cyc * 5.3 + 9.2)) + Math.sin(t * 0.23) * 26;
        const lit = px > -1 ? Math.max(0, 1 - Math.hypot(x - rx, y38 - ry) / 240) : 0;
        ctx.globalAlpha = 0.85;
        ctx.drawImage(darkSpr, x - 55, y38 - 45, 110, 90);
        ctx.globalAlpha = 1;
        ctx.strokeStyle = `rgba(150,215,225,${(0.06 + lit * 0.12).toFixed(3)})`;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.ellipse(x, y38 - 8, 22, 15, 0, Math.PI, TAU);
        ctx.stroke();
        for (let c = 0; c < 3; c++) {
          ctx.beginPath();
          ctx.moveTo(x - 12 + c * 12, y38 - 4);
          ctx.quadraticCurveTo(x - 12 + c * 12 + Math.sin(t * 0.8 + c) * 10, y38 + 26, x - 14 + c * 13, y38 + 52);
          ctx.stroke();
        }
      }
    }

    // the big slow shape at 65 m, holding just outside the lantern light
    {
      const y65 = (65 + 90 * cyc - D) * PPM;
      if (y65 > -180 && y65 < H + 180) {
        const a2 = t * 0.05 + cyc * 2.1;
        const x = rx + Math.cos(a2) * 215 + Math.sin(t * 0.11) * 30;
        const y = Math.max(60, Math.min(H - 60, y65)) + Math.sin(a2 * 1.7) * 40;
        const lit = px > -1 ? Math.max(0, 1 - Math.hypot(x - rx, y - ry) / 260) : 0;
        const breathe = 1 + Math.sin(t * 0.4) * 0.06;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(Math.sin(t * 0.07) * 0.12);
        ctx.globalAlpha = 0.9;
        ctx.drawImage(darkSpr, -190 * breathe, -80 * breathe, 380 * breathe, 160 * breathe);
        ctx.globalAlpha = 1;
        ctx.strokeStyle = `rgba(140,205,220,${(0.05 + lit * 0.1).toFixed(3)})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(0, 0, 165 * breathe, 52 * breathe, 0, 0, TAU);
        ctx.stroke();
        ctx.restore();
      }
    }

    // the lantern
    ctx.globalCompositeOperation = "lighter";
    if (px > -1) {
      const gr = ctx.createRadialGradient(rx, ry, 0, rx, ry, 200);
      gr.addColorStop(0, "rgba(210,235,255,0.11)");
      gr.addColorStop(1, "rgba(210,235,255,0)");
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(rx, ry, 200, 0, TAU); ctx.fill();
    }

    // the angler's lure, after 70 m — the only warm thing down here
    const dC = D % 90;
    if (dC >= 68 && dC < 90) {
      const mL = 48 + 0.5 * dC + 90 * cyc;         // sinks at half your rate, giving ground slowly
      const y = (mL - D) * PPM;
      const x = W * (0.3 + 0.4 * hash(cyc * 3.3 + 4.4)) + Math.sin(t * 0.3) * 40 + Math.sin(t * 0.11) * 60;
      if (y > -30 && y < H + 30) {
        const gr = ctx.createRadialGradient(x, y, 0, x, y, 26);
        gr.addColorStop(0, "rgba(255,94,199,0.50)");
        gr.addColorStop(0.4, "rgba(255,94,199,0.18)");
        gr.addColorStop(1, "rgba(255,94,199,0)");
        ctx.fillStyle = gr;
        ctx.beginPath(); ctx.arc(x, y, 26, 0, TAU); ctx.fill();
        ctx.fillStyle = "rgba(255,220,240,0.9)";
        ctx.beginPath(); ctx.arc(x, y, 1.6, 0, TAU); ctx.fill();
      }
    }
    ctx.globalCompositeOperation = "source-over";

    // snow: recycled at the top, thickened by depth, fatter and slower below 45 m
    const tg = targetCounts(D);
    const scroll = SINK * PPM;
    for (let b = 0; b < 3; b++) {
      const arr = flakes[b];
      for (let i = arr.length - 1; i >= 0; i--) {
        const f = arr[i];
        f.y -= scroll * PAR[b] * dt;
        f.y += f.own * dt;
        f.x += Math.sin(t * 0.25 + f.ph) * 10 * dt;
        if (f.y < -20) {
          if (arr.length > tg[b]) { arr.splice(i, 1); continue; }
          f.y = H + rnd(0, 50); f.x = Math.random() * W;
          const deep = Math.max(0, Math.min(1, (D - 40) / 40));
          f.r = [1.1, 1.7, 2.6][b] * rnd(0.7, 1.3) * (1 + deep * 0.8);
          f.own = rnd(2, 7) * (1 - deep * 0.5);
        }
      }
      while (arr.length < tg[b]) {
        arr.push({ x: Math.random() * W, y: H + rnd(0, 60), r: [1.1, 1.7, 2.6][b] * rnd(0.7, 1.3), own: rnd(2, 7), ph: rnd(0, TAU) });
      }
    }
    for (let b = 0; b < 3; b++) {
      for (const f of flakes[b]) {
        let lit = 0;
        if (px > -1) {
          const dd = Math.hypot(f.x - rx, f.y - ry);
          if (dd < 240) lit = (1 - dd / 240) * 1.2;
        }
        ctx.fillStyle = `rgba(205,228,222,${Math.min(0.85, (0.1 + 0.2 * PAR[b]) * I + 0.12 + lit * 0.35).toFixed(3)})`;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, TAU); ctx.fill();
      }
    }

    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.78);
    vg.addColorStop(0, "rgba(2,4,9,0)");
    vg.addColorStop(1, "rgba(2,4,9,0.55)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  let lastT = 0;
  if (reduced) {
    for (let k = 0; k < 300; k++) frame(k * 16, 0.016);
    lastT = 300 * 16;
    window.addEventListener("resize", () => frame(lastT, 0));
  } else {
    let last = performance.now();
    requestAnimationFrame(function loop(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      frame(now, dt);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
