<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVX Splash — Smokers</title>
<style>
  :root {
    --void: #060a13; --ink: #eef2fb; --muted: #aab6cf;
    --line: rgba(238, 242, 251, 0.14); --teal: #17e8d8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--void); color: var(--ink);
    font-family: "Segoe UI", "Avenir Next", system-ui, sans-serif;
    height: 100vh; overflow: hidden;
  }
  #bg { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .stage {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    justify-content: space-between; padding: clamp(20px, 4vw, 44px);
    opacity: 0; animation: settle 1s ease-out 0.3s forwards;
  }
  @keyframes settle { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .stage { animation: none; opacity: 1; } }
  .bar { display: flex; align-items: center; justify-content: space-between; }
  .wordmark {
    display: flex; align-items: center; gap: 12px;
    font-family: "Bahnschrift", "Segoe UI", sans-serif;
    font-weight: 700; font-size: 16px; letter-spacing: 0.14em;
  }
  .wordmark .pip {
    width: 13px; height: 13px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff5ec7, #7a2170 75%);
    box-shadow: 0 0 12px rgba(255, 94, 199, 0.7);
  }
  .variant {
    color: var(--muted); font-size: 13.5px;
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px;
  }
  .hero { text-align: center; max-width: 680px; margin: 0 auto; padding-bottom: 5vh; }
  .hero h1 {
    font-family: "Bahnschrift", "Segoe UI", sans-serif;
    font-size: clamp(2.2rem, 5.5vw, 3.8rem); font-weight: 700; line-height: 1.05;
    text-shadow: 0 2px 28px rgba(3, 6, 12, 0.85);
  }
  .hero p {
    margin: 14px auto 26px; max-width: 44ch; color: var(--muted);
    font-size: clamp(0.95rem, 1.5vw, 1.1rem); line-height: 1.6;
    text-shadow: 0 1px 18px rgba(3, 6, 12, 0.9);
  }
  .btn {
    font: inherit; font-size: 14.5px; padding: 11px 24px; border-radius: 10px;
    cursor: pointer; text-decoration: none; transition: transform 0.2s, background 0.2s;
  }
  .btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
  .btn-solid { background: var(--ink); color: #0a0f1c; border: 1px solid var(--ink); }
  .btn-solid:hover { background: #fff; transform: translateY(-1px); }
  .foot { color: var(--muted); font-size: 13px; text-align: center; }

  /* mobile & touch */
  html, body { overscroll-behavior: none; }
  body { height: 100dvh; -webkit-tap-highlight-color: transparent; }
  #bg { touch-action: none; }
  .stage { -webkit-user-select: none; user-select: none; }
  .bar { flex-wrap: wrap; row-gap: 10px; }
  @media (max-width: 640px) {
    .wordmark { font-size: 14px; }
    .variant { font-size: 11px; padding: 4px 10px; }
    .hero h1 { font-size: clamp(1.9rem, 8.5vw, 2.5rem); }
    .hero p { font-size: 0.92rem; }
    .btn { padding: 13px 28px; font-size: 15px; }
    .foot { font-size: 11.5px; }
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="stage">
  <header class="bar">
    <div class="wordmark"><span class="pip"></span>CVX SPLASH</div>
    <span class="variant">Variation — Smokers</span>
  </header>
  <main class="hero">
    <h1>Smokers</h1>
    <p>Black smokers on the ridge: mineral plumes rising on their own buoyancy, cooling as they climb, then billowing out and occluding the light — the deep's own cloud bank, embers glowing at the chimneys' mouths.</p>
    <a class="btn btn-solid" href="#">Get started</a>
  </main>
  <footer class="foot">The chimneys never close</footer>
</div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("bg");
  const ctx = canvas.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TAU = Math.PI * 2;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // pre-rendered soft sprites: the ember bloom, lit ash, dark smoke
  function makeSprite(size, stops) {
    const c = document.createElement("canvas");
    c.width = c.height = size;
    const g = c.getContext("2d");
    const rg = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    for (const [o, col] of stops) rg.addColorStop(o, col);
    g.fillStyle = rg; g.fillRect(0, 0, size, size);
    return c;
  }
  const bloomSpr = makeSprite(96, [[0, "rgba(255,130,55,0.55)"], [0.4, "rgba(255,110,50,0.20)"], [1, "rgba(255,110,50,0)"]]);
  const warmSpr = makeSprite(32, [[0, "rgba(255,175,105,0.55)"], [1, "rgba(200,110,60,0)"]]);
  const darkSpr = makeSprite(64, [[0, "rgba(2,5,10,0.50)"], [0.65, "rgba(2,5,10,0.28)"], [1, "rgba(2,5,10,0)"]]);

  const NRAYS = 5;
  const rays = [];
  for (let i = 0; i < NRAYS; i++) rays.push({ d: rnd(0.25, 1), ph: rnd(0, TAU), sway: rnd(0.05, 0.1), tilt: rnd(-0.06, 0.14), w: rnd(0.03, 0.08), len: rnd(0.45, 0.9) });

  const vents = [
    { u: 0.25, h: 0.22, w0: 0.030, lean: 0.06, str: 0.8, ph: rnd(0, TAU) },
    { u: 0.55, h: 0.30, w0: 0.040, lean: -0.05, str: 1.25, ph: rnd(0, TAU) },
    { u: 0.80, h: 0.18, w0: 0.026, lean: 0.04, str: 0.7, ph: rnd(0, TAU) }
  ];
  for (const v of vents) v.acc = 0;

  const POOL = 450;
  const plume = [];
  const sparks = [];
  const N = 60;
  const motes = [];
  let seeded = false;

  let mx = 0.5, my = 0.45, px = -2, py = -2;
  window.addEventListener("pointermove", e => { mx = e.clientX / W; my = e.clientY / H; });
  window.addEventListener("pointerleave", () => { mx = -2; my = -2; });

  function ridge(base, amp, seed, col) {
    ctx.beginPath(); ctx.moveTo(-12, H + 12);
    for (let x = -12; x <= W + 12; x += 26) {
      ctx.lineTo(x, H - base - hash(seed + x * 0.012) * amp - Math.sin(x * 0.02 + seed) * amp * 0.3);
    }
    ctx.lineTo(W + 12, H + 12); ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
  }

  function frame(now, dt) {
    const t = now / 1000;
    px += (mx - px) * 0.07;
    py += (my - py) * 0.07;

    if (!seeded && W > 0) {
      for (let i = 0; i < POOL; i++) plume.push({ on: false });
      for (let i = 0; i < N; i++) {
        motes.push({ x: Math.random() * W, y: Math.random() * H, d: 0.2 + Math.random() * 0.8, ph: rnd(0, TAU) });
      }
      seeded = true;
    }

    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#071021");
    g.addColorStop(0.5, "#030711");
    g.addColorStop(1, "#02040a");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // local ray brightness per vent — plumes stand tall where light is weak,
    // billow out where it is strong
    const rayB = vents.map(v => {
      let b = 0;
      for (const r of rays) {
        const rx = (r.u + Math.sin(t * r.sway + r.ph) * 0.015) * W;
        const rw = Math.max(60, r.w * W * 1.4);
        const q = (v.u * W - rx) / rw;
        b = Math.max(b, r.d * Math.exp(-q * q));
      }
      return b;
    });

    ctx.globalCompositeOperation = "lighter";
    let gr = ctx.createRadialGradient(W * 0.5, -H * 0.25, 0, W * 0.5, -H * 0.25, H * 0.95);
    gr.addColorStop(0, "rgba(40,90,140,0.20)");
    gr.addColorStop(1, "rgba(40,90,140,0)");
    ctx.fillStyle = gr;
    ctx.fillRect(0, 0, W, H);
    for (let ri = 0; ri < NRAYS; ri++) {
      const r = rays[ri];
      const anchor = vents[ri % vents.length].u;         // shimmering over the ridge
      const x0 = (anchor + Math.sin(t * r.sway + r.ph) * 0.015) * W
               + (px > -1 ? (px - 0.5) * -40 * r.d : 0);
      const th = r.tilt + Math.sin(t * r.sway * 0.8 + r.ph * 2) * 0.05;
      const a = 0.05 + 0.07 * r.d;
      const len = r.len * H * 1.1;
      const wpx = r.w * W * (0.8 + 0.4 * r.d);
      ctx.save();
      ctx.translate(x0, -40);
      ctx.rotate(th);
      const rg = ctx.createLinearGradient(0, 0, 0, len);
      rg.addColorStop(0, `rgba(23,232,216,${a})`);
      rg.addColorStop(0.7, `rgba(23,232,216,${a * 0.35})`);
      rg.addColorStop(1, "rgba(23,232,216,0)");
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.moveTo(-wpx * 0.35, 0); ctx.lineTo(wpx * 0.35, 0);
      ctx.lineTo(wpx * 0.9, len); ctx.lineTo(-wpx * 0.9, len);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.globalCompositeOperation = "source-over";

    ridge(H * 0.030, H * 0.050, 3.1, "rgba(6,13,15,0.6)");
    ridge(H * 0.008, H * 0.034, 9.7, "rgba(3,7,9,0.92)");

    const pw = px * W, phh = py * H;

    // spawn at the mouths, rate following each vent's strength
    for (let vi = 0; vi < vents.length; vi++) {
      const v = vents[vi];
      v.acc += 26 * v.str * dt;
      while (v.acc >= 1) {
        v.acc -= 1;
        for (let i = 0; i < POOL; i++) {
          const p2 = plume[i];
          if (p2.on) continue;
          const mX = (v.u + v.lean * v.h) * W, mY = H - v.h * H;
          const mw = v.w0 * W * 0.18;
          p2.on = true; p2.age = 0; p2.life = rnd(5.5, 9);
          p2.x = mX + rnd(-mw, mw); p2.y = mY + rnd(-4, 4);
          p2.vx = rnd(-9, 9); p2.vy = -(28 + rnd(0, 30));
          p2.seed = Math.random(); p2.vi = vi; p2.r = rnd(9, 15);
          break;
        }
      }
      // embers in the first hundred pixels above the mouth
      if (Math.random() < dt * 3 * v.str && sparks.length < 18) {
        const mX = (v.u + v.lean * v.h) * W, mY = H - v.h * H;
        sparks.push({ x: mX + rnd(-6, 6), y: mY - rnd(0, 8), vx: rnd(-9, 9), vy: -(55 + rnd(0, 60)), age: 0, max: rnd(0.4, 0.9), top: mY - 100 });
      }
    }

    // buoyancy that spends itself as the mineral water cools
    for (const p2 of plume) {
      if (!p2.on) continue;
      p2.age += dt;
      if (p2.age >= p2.life) { p2.on = false; continue; }
      const v = vents[p2.vi];
      const lift = 1.15 - 0.45 * rayB[p2.vi];
      const cool = Math.exp(-p2.age / 2.2);
      p2.vy -= 60 * cool * lift * dt;
      p2.vy += (-3 - p2.vy) * (1 - Math.exp(-0.3 * dt));   // spent: drift on the ambient current
      const gain = 45 * Math.exp(-p2.age / 2.8);
      p2.vx += Math.sin(p2.y * 0.02 + t * 0.6 + p2.seed * 40) * gain * dt;
      p2.vx += Math.cos(p2.y * 0.013 - t * 0.4 + p2.seed * 27) * gain * 0.6 * (0.5 + rayB[p2.vi]) * dt;
      p2.vx *= Math.exp(-0.5 * dt);
      if (px > -1) {                                        // the lantern stirs an updraft
        const d = Math.hypot(p2.x - pw, p2.y - phh);
        if (d < 160 && d > 1) {
          const f = 1 - d / 160;
          p2.vy -= f * 55 * dt;
          p2.vx += (-(p2.y - phh) / d) * f * 45 * dt + ((p2.x - pw) / d) * f * 20 * dt;
        }
      }
      p2.x += p2.vx * dt; p2.y += p2.vy * dt;
      if (p2.x < -40 || p2.x > W + 40 || p2.y < -60) p2.on = false;
    }

    // dark bodies first — the plume blocks the light above it
    for (const p2 of plume) {
      if (!p2.on) continue;
      const lit = Math.max(0, 1 - p2.age / (p2.life * 0.15));   // glowing only near the mouth
      const fadeIn = Math.min(1, p2.age / 0.5);
      const fadeOut = 1 - Math.max(0, (p2.age - p2.life * 0.65) / (p2.life * 0.35));
      const a = 0.85 * (1 - lit) * fadeIn * fadeOut;
      if (a <= 0.01) continue;
      const sz = p2.r * (1 + p2.age * 0.28) * 2;
      ctx.globalAlpha = a;
      ctx.drawImage(darkSpr, p2.x - sz / 2, p2.y - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;

    ctx.globalCompositeOperation = "lighter";
    // ember breath at each mouth
    for (const v of vents) {
      const mX = (v.u + v.lean * v.h) * W, mY = H - v.h * H;
      const sz = v.h * H * 0.9;
      ctx.globalAlpha = 0.14 + 0.04 * Math.sin(t * 0.7 + v.ph);
      ctx.drawImage(bloomSpr, mX - sz / 2, mY - sz / 2, sz, sz);
    }
    // ash still lit by the ember
    for (const p2 of plume) {
      if (!p2.on) continue;
      const lit = Math.max(0, 1 - p2.age / (p2.life * 0.15));
      if (lit <= 0.02) continue;
      const fadeOut = 1 - Math.max(0, (p2.age - p2.life * 0.65) / (p2.life * 0.35));
      ctx.globalAlpha = 0.4 * lit * fadeOut;
      const sz = p2.r * 0.9;
      ctx.drawImage(warmSpr, p2.x - sz / 2, p2.y - sz / 2, sz, sz);
    }
    // sparks
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s2 = sparks[i];
      s2.age += dt;
      if (s2.age > s2.max || s2.y < s2.top) { sparks.splice(i, 1); continue; }
      s2.x += s2.vx * dt; s2.y += s2.vy * dt;
      ctx.fillStyle = `rgba(255,180,100,${(0.7 * (1 - s2.age / s2.max)).toFixed(3)})`;
      ctx.fillRect(s2.x, s2.y, 1.6, 1.6);
    }
    if (px > -1) {
      gr = ctx.createRadialGradient(pw, phh, 0, pw, phh, 190);
      gr.addColorStop(0, "rgba(210,235,255,0.10)");
      gr.addColorStop(1, "rgba(210,235,255,0)");
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(pw, phh, 190, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;

    // chimneys: dark spires, narrower as they climb
    for (const v of vents) {
      const mX = (v.u + v.lean * v.h) * W, mY = H - v.h * H;
      const steps = 5;
      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const q = i / steps;
        const hw = v.w0 * W * (1 - 0.82 * Math.pow(q, 0.9)) * (i === 0 ? 1.15 : 1);
        const x = v.u * W + v.lean * q * v.h * H;
        const y = H + 6 - q * v.h * H;
        if (i === 0) ctx.moveTo(x - hw, y); else ctx.lineTo(x - hw + hash(v.ph + i) * 5, y);
      }
      for (let i = steps; i >= 0; i--) {
        const q = i / steps;
        const hw = v.w0 * W * (1 - 0.82 * Math.pow(q, 0.9));
        const x = v.u * W + v.lean * q * v.h * H;
        const y = H + 6 - q * v.h * H;
        ctx.lineTo(x + hw + hash(v.ph + i * 3) * 5, y);
      }
      ctx.closePath();
      ctx.fillStyle = "rgba(4,7,11,0.95)";
      ctx.fill();
      ctx.strokeStyle = "rgba(40,80,80,0.10)";
      ctx.lineWidth = 1;
      ctx.stroke();
      // the hot throat
      ctx.fillStyle = "rgba(120,50,25,0.14)";
      ctx.fillRect(mX - 3, mY - 2, 6, 6);
    }

    // marine snow
    for (const m of motes) {
      m.y += (5 + 28 * m.d) * dt;
      m.x += Math.sin(t * 0.25 + m.ph) * 14 * dt * m.d;
      if (m.y > H + 20) { m.y = -20; m.x = Math.random() * W; }
      if (m.x < -30) m.x = W + 30; if (m.x > W + 30) m.x = -30;
      let lit = 0;
      if (px > -1) {
        const dd = Math.hypot(m.x - pw, m.y - phh);
        if (dd < 220) lit = (1 - dd / 220) * 1.2;
      }
      ctx.fillStyle = `rgba(210,230,255,${Math.min(0.85, 0.14 + 0.34 * m.d + lit * 0.3)})`;
      ctx.beginPath(); ctx.arc(m.x, m.y, 0.8 + 2.2 * m.d, 0, TAU); ctx.fill();
    }

    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.78);
    vg.addColorStop(0, "rgba(2,4,9,0)");
    vg.addColorStop(1, "rgba(2,4,9,0.55)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  let lastT = 0;
  if (reduced) {
    for (let k = 0; k < 400; k++) frame(k * 16, 0.016);
    lastT = 400 * 16;
    window.addEventListener("resize", () => frame(lastT, 0));
  } else {
    let last = performance.now();
    requestAnimationFrame(function loop(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      frame(now, dt);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
