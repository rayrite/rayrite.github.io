<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVX Splash — Leviathan</title>
<style>
  :root {
    --void: #060a13; --ink: #eef2fb; --muted: #aab6cf;
    --line: rgba(238, 242, 251, 0.14); --teal: #17e8d8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--void); color: var(--ink);
    font-family: "Segoe UI", "Avenir Next", system-ui, sans-serif;
    height: 100vh; overflow: hidden;
  }
  #bg { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .stage {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    justify-content: space-between; padding: clamp(20px, 4vw, 44px);
    opacity: 0; animation: settle 1s ease-out 0.3s forwards;
  }
  @keyframes settle { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .stage { animation: none; opacity: 1; } }
  .bar { display: flex; align-items: center; justify-content: space-between; }
  .wordmark {
    display: flex; align-items: center; gap: 12px;
    font-family: "Bahnschrift", "Segoe UI", sans-serif;
    font-weight: 700; font-size: 16px; letter-spacing: 0.14em;
  }
  .wordmark .pip {
    width: 13px; height: 13px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff5ec7, #7a2170 75%);
    box-shadow: 0 0 12px rgba(255, 94, 199, 0.7);
  }
  .variant {
    color: var(--muted); font-size: 13.5px;
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px;
  }
  .hero { text-align: center; max-width: 680px; margin: 0 auto; padding-bottom: 5vh; }
  .hero h1 {
    font-family: "Bahnschrift", "Segoe UI", sans-serif;
    font-size: clamp(2.2rem, 5.5vw, 3.8rem); font-weight: 700; line-height: 1.05;
    text-shadow: 0 2px 28px rgba(3, 6, 12, 0.85);
  }
  .hero p {
    margin: 14px auto 26px; max-width: 44ch; color: var(--muted);
    font-size: clamp(0.95rem, 1.5vw, 1.1rem); line-height: 1.6;
    text-shadow: 0 1px 18px rgba(3, 6, 12, 0.9);
  }
  .btn {
    font: inherit; font-size: 14.5px; padding: 11px 24px; border-radius: 10px;
    cursor: pointer; text-decoration: none; transition: transform 0.2s, background 0.2s;
  }
  .btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
  .btn-solid { background: var(--ink); color: #0a0f1c; border: 1px solid var(--ink); }
  .btn-solid:hover { background: #fff; transform: translateY(-1px); }
  .foot { color: var(--muted); font-size: 13px; text-align: center; }

  /* mobile & touch */
  html, body { overscroll-behavior: none; }
  body { height: 100dvh; -webkit-tap-highlight-color: transparent; }
  #bg { touch-action: none; }
  .stage { -webkit-user-select: none; user-select: none; }
  .bar { flex-wrap: wrap; row-gap: 10px; }
  @media (max-width: 640px) {
    .wordmark { font-size: 14px; }
    .variant { font-size: 11px; padding: 4px 10px; }
    .hero h1 { font-size: clamp(1.9rem, 8.5vw, 2.5rem); }
    .hero p { font-size: 0.92rem; }
    .btn { padding: 13px 28px; font-size: 15px; }
    .foot { font-size: 11.5px; }
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="stage">
  <header class="bar">
    <div class="wordmark"><span class="pip"></span>CVX SPLASH</div>
    <span class="variant">Variation — Leviathan</span>
  </header>
  <main class="hero">
    <h1>Leviathan</h1>
    <p>Something enormous crosses the far dark, occluding the light shafts as it goes, trailing threads of bubbles. It does not notice you.</p>
    <a class="btn btn-solid" href="#">Get started</a>
  </main>
  <footer class="foot">Something passes in the deep</footer>
</div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("bg");
  const ctx = canvas.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TAU = Math.PI * 2;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  const NRAYS = 7;
  const rays = [];
  for (let i = 0; i < NRAYS; i++) {
    rays.push({
      u: rnd(0.05, 0.95), w: rnd(0.03, 0.09), len: rnd(0.45, 0.95),
      d: rnd(0.25, 1), ph: rnd(0, TAU), sway: rnd(0.03, 0.07), tilt: rnd(-0.06, 0.14)
    });
  }

  const N = 90;
  const motes = [];
  let seeded = false;

  const bubbles = [];
  const rings = [];
  let sungCycle = -1;

  let mx = 0.5, my = 0.45, px = -2, py = -2;
  window.addEventListener("pointermove", e => { mx = e.clientX / W; my = e.clientY / H; });
  window.addEventListener("pointerleave", () => { mx = -2; my = -2; });

  // hold the static frame near mid-crossing under reduced motion
  const tOff = reduced ? 50 * 0.5 - 300 * 0.016 : 0;

  // one big crossing, one smaller further back, same cycle offset in time
  const whales = [
    { scale0: 0.5, off: 0, seed: 3.1, ph: rnd(0, TAU), acc: 0 },
    { scale0: 0.32, off: 25, seed: 8.7, ph: rnd(0, TAU), acc: 0 }
  ];
  const DUR = 50, SPTS = 22;

  function drawSnow(layerTest) {
    for (const m of motes) {
      if (!layerTest(m.d)) continue;
      let lit = 0;
      if (px > -1) {
        const dd = Math.hypot(m.x - px * W, m.y - py * H);
        if (dd < 220) lit = (1 - dd / 220) * 1.2;
      }
      const [cr, cg, cb] = m.col;
      ctx.fillStyle = `rgba(${cr},${cg},${cb},${Math.min(0.85, 0.14 + 0.34 * m.d + lit * 0.3)})`;
      ctx.beginPath(); ctx.arc(m.x, m.y, 0.8 + 2.4 * m.d, 0, TAU); ctx.fill();
    }
  }

  function frame(now, dt) {
    const t = now / 1000 + tOff;
    px += (mx - px) * 0.07;
    py += (my - py) * 0.07;

    if (!seeded && W > 0) {
      const MCOLS = [[210, 230, 255], [210, 230, 255], [210, 230, 255], [23, 232, 216]];
      for (let i = 0; i < N; i++) {
        motes.push({
          x: Math.random() * W, y: Math.random() * H, d: 0.2 + Math.random() * 0.8,
          col: MCOLS[(Math.random() * MCOLS.length) | 0], ph: rnd(0, TAU)
        });
      }
      seeded = true;
    }

    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#071021");
    g.addColorStop(0.5, "#030711");
    g.addColorStop(1, "#02040a");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = "lighter";
    let gr = ctx.createRadialGradient(W * 0.5, -H * 0.25, 0, W * 0.5, -H * 0.25, H * 0.95);
    gr.addColorStop(0, "rgba(40,90,140,0.22)");
    gr.addColorStop(1, "rgba(40,90,140,0)");
    ctx.fillStyle = gr;
    ctx.fillRect(0, 0, W, H);
    for (const r of rays) {
      const x0 = r.u * W + Math.sin(t * r.sway + r.ph) * W * 0.02;
      const th = r.tilt + Math.sin(t * r.sway * 0.8 + r.ph * 2) * 0.05;
      const a = 0.05 + 0.08 * r.d;
      const len = r.len * H * 1.1;
      const wpx = r.w * W * (0.8 + 0.4 * r.d);
      ctx.save();
      ctx.translate(x0, -40);
      ctx.rotate(th);
      const rg = ctx.createLinearGradient(0, 0, 0, len);
      rg.addColorStop(0, `rgba(23,232,216,${a})`);
      rg.addColorStop(0.7, `rgba(23,232,216,${a * 0.35})`);
      rg.addColorStop(1, "rgba(23,232,216,0)");
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.moveTo(-wpx * 0.35, 0); ctx.lineTo(wpx * 0.35, 0);
      ctx.lineTo(wpx * 0.9, len); ctx.lineTo(-wpx * 0.9, len);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.globalCompositeOperation = "source-over";

    drawSnow(d => d < 0.45);                       // snow behind the body

    for (const wh of whales) {
      const cycle = Math.floor((t + DUR - wh.off) / DUR);
      const p = ((t + DUR - wh.off) % DUR) / DUR;
      const scale = wh.scale0 * (0.9 + 0.2 * hash(cycle * 3.7 + wh.seed));
      const L = 0.55 * W * scale;
      const M = L * 0.8;
      const xHead = W + M - p * (W + L + 2 * M);
      if (xHead > W + M || xHead < -L - M) continue;
      const baseY = H * (0.25 + 0.35 * hash(cycle * 7.3 + wh.seed)) + Math.sin(t * 0.1 + wh.ph) * 8;
      const k = TAU * 1.2 / L;                     // ~1.2 wavelengths along the body
      const amp = L * 0.045;
      const sp = 1.6 + scale * 1.2;

      // carangiform: the head holds steady, the tail swings wide
      const xs = [], ys = [];
      for (let i = 0; i < SPTS; i++) {
        const u = i / (SPTS - 1);
        const env = 0.15 + 0.85 * Math.pow(u, 1.6);
        xs.push(xHead + u * L);
        ys.push(baseY + Math.sin(u * L * k - t * sp + wh.ph) * amp * env);
      }
      const rad = u => {
        const prof = Math.sin(Math.PI * (0.12 + 0.88 * u));  // blunt head, tail to a point
        return L * 0.085 * Math.pow(Math.max(prof, 0), 0.8);
      };

      const r0 = rad(0);
      const xt = xs[SPTS - 1], yt = ys[SPTS - 1];
      const flSway = Math.sin(L * k - t * sp * 0.5 + wh.ph) * amp * 1.8;  // fluke: half frequency

      ctx.beginPath();
      ctx.moveTo(xs[0], ys[0] - r0);
      for (let i = 1; i < SPTS; i++) ctx.lineTo(xs[i], ys[i] - rad(i / (SPTS - 1)));
      // fluke, two lobes trailing the tail sine
      ctx.quadraticCurveTo(xt + L * 0.02, yt - L * 0.02, xt + L * 0.10 + flSway * 0.4, yt - L * 0.055 + flSway);
      ctx.quadraticCurveTo(xt + L * 0.05, yt, xt + L * 0.10 + flSway * 0.4, yt + L * 0.055 + flSway);
      ctx.quadraticCurveTo(xt + L * 0.02, yt + L * 0.02, xt, yt + rad(1));
      for (let i = SPTS - 1; i >= 0; i--) ctx.lineTo(xs[i], ys[i] + rad(i / (SPTS - 1)) * 0.92);
      ctx.quadraticCurveTo(xs[0] - r0 * 1.3, ys[0], xs[0], ys[0] - r0);   // nose
      ctx.closePath();
      ctx.fillStyle = "rgba(4,8,14,0.92)";
      ctx.fill();

      // dorsal rim light
      ctx.beginPath();
      ctx.moveTo(xs[0], ys[0] - r0);
      for (let i = 1; i < SPTS; i++) ctx.lineTo(xs[i], ys[i] - rad(i / (SPTS - 1)));
      ctx.strokeStyle = "rgba(30,200,190,0.08)";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // pectoral fin, barely there
      const fu = 0.25, fi = Math.round(fu * (SPTS - 1));
      const fr = rad(fu);
      ctx.beginPath();
      ctx.moveTo(xs[fi], ys[fi] + fr * 0.5);
      ctx.quadraticCurveTo(xs[fi] + L * 0.05, ys[fi] + fr * 1.9 + Math.sin(t * 0.9 + wh.ph) * 3,
                           xs[fi] + L * 0.085, ys[fi] + fr * 0.5);
      ctx.closePath();
      ctx.fillStyle = "rgba(4,8,14,0.85)";
      ctx.fill();

      // an eye, if you look for it
      const ei = Math.round(0.06 * (SPTS - 1));
      ctx.fillStyle = "rgba(180,220,230,0.25)";
      ctx.beginPath(); ctx.arc(xs[ei], ys[ei] - rad(0.06) * 0.15, Math.max(1.2, L * 0.004), 0, TAU); ctx.fill();

      // bubble threads from the head
      wh.acc += dt * 2.5;
      if (wh.acc > 1) {
        wh.acc = 0;
        if (bubbles.length < 40) {
          bubbles.push({
            x: xs[ei] + rnd(-r0, r0) * 0.6, y: ys[ei] + rnd(-r0, r0) * 0.5,
            r: rnd(0.7, 1.9), life: 0, max: rnd(2.2, 3.4), ph: rnd(0, TAU)
          });
        }
      }

      // song: rings from the head as it crosses the middle third
      if (wh === whales[0]) {
        const inMid = xs[ei] > W / 3 && xs[ei] < 2 * W / 3;
        if (inMid && sungCycle !== cycle) {
          sungCycle = cycle;
          rings.push({ x: xs[ei], y: ys[ei], r: 10, delay: 0 });
          rings.push({ x: xs[ei], y: ys[ei], r: 10, delay: 0.7 });
          rings.push({ x: xs[ei], y: ys[ei], r: 10, delay: 1.4 });
        }
      }
    }

    // snow between the body and the lantern
    drawSnow(d => d >= 0.45 && d < 0.78);

    ctx.globalCompositeOperation = "lighter";
    if (px > -1) {
      gr = ctx.createRadialGradient(px * W, py * H, 0, px * W, py * H, 190);
      gr.addColorStop(0, "rgba(210,235,255,0.10)");
      gr.addColorStop(1, "rgba(210,235,255,0)");
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(px * W, py * H, 190, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";

    for (let i = rings.length - 1; i >= 0; i--) {
      const rg2 = rings[i];
      if (rg2.delay > 0) { rg2.delay -= dt; continue; }
      rg2.r += 110 * dt;
      const a = 0.14 * Math.max(0, 1 - rg2.r / 480);
      if (a <= 0.002 || rg2.r > 480) { rings.splice(i, 1); continue; }
      ctx.strokeStyle = `rgba(23,232,216,${a.toFixed(4)})`;
      ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(rg2.x, rg2.y, rg2.r, 0, TAU); ctx.stroke();
    }

    drawSnow(d => d >= 0.78);                      // snow at the lens

    for (const m of motes) {
      m.y += (5 + 28 * m.d) * dt;
      m.x += Math.sin(t * 0.25 + m.ph) * 14 * dt * m.d;
      if (m.y > H + 20) { m.y = -20; m.x = Math.random() * W; }
      if (m.x < -30) m.x = W + 30; if (m.x > W + 30) m.x = -30;
    }
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.life += dt;
      if (b.life > b.max) { bubbles.splice(i, 1); continue; }
      b.y -= (26 + 14 * b.r) * dt;
      b.x += Math.sin(t * 2.2 + b.ph) * 10 * dt;
      ctx.strokeStyle = `rgba(180,225,240,${(0.22 * (1 - b.life / b.max)).toFixed(3)})`;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.stroke();
    }

    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.78);
    vg.addColorStop(0, "rgba(2,4,9,0)");
    vg.addColorStop(1, "rgba(2,4,9,0.55)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  let lastT = 0;
  if (reduced) {
    for (let k = 0; k < 300; k++) frame(k * 16, 0.016);
    lastT = 300 * 16;
    window.addEventListener("resize", () => frame(lastT, 0));
  } else {
    let last = performance.now();
    requestAnimationFrame(function loop(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      frame(now, dt);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
