<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVX Splash — Billow</title>
<style>
  :root {
    --void: #060a13; --ink: #eef2fb; --muted: #aab6cf;
    --line: rgba(238, 242, 251, 0.14); --teal: #17e8d8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--void); color: var(--ink);
    font-family: "Segoe UI", "Avenir Next", system-ui, sans-serif;
    height: 100vh; overflow: hidden;
  }
  #bg { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .stage {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    justify-content: space-between; padding: clamp(20px, 4vw, 44px);
    opacity: 0; animation: settle 1s ease-out 0.3s forwards;
  }
  @keyframes settle { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .stage { animation: none; opacity: 1; } }
  .bar { display: flex; align-items: center; justify-content: space-between; }
  .wordmark {
    display: flex; align-items: center; gap: 12px;
    font-family: "Bahnschrift", "Segoe UI", sans-serif;
    font-weight: 700; font-size: 16px; letter-spacing: 0.14em;
  }
  .wordmark .pip {
    width: 13px; height: 13px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff5ec7, #7a2170 75%);
    box-shadow: 0 0 12px rgba(255, 94, 199, 0.7);
  }
  .variant {
    color: var(--muted); font-size: 13.5px;
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px;
  }
  .hero { text-align: center; max-width: 680px; margin: 0 auto; padding-bottom: 5vh; }
  .hero h1 {
    font-family: "Bahnschrift", "Segoe UI", sans-serif;
    font-size: clamp(2.2rem, 5.5vw, 3.8rem); font-weight: 700; line-height: 1.05;
    text-shadow: 0 2px 28px rgba(3, 6, 12, 0.85);
  }
  .hero p {
    margin: 14px auto 26px; max-width: 44ch; color: var(--muted);
    font-size: clamp(0.95rem, 1.5vw, 1.1rem); line-height: 1.6;
    text-shadow: 0 1px 18px rgba(3, 6, 12, 0.9);
  }
  .btn {
    font: inherit; font-size: 14.5px; padding: 11px 24px; border-radius: 10px;
    cursor: pointer; text-decoration: none; transition: transform 0.2s, background 0.2s;
  }
  .btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
  .btn-solid { background: var(--ink); color: #0a0f1c; border: 1px solid var(--ink); }
  .btn-solid:hover { background: #fff; transform: translateY(-1px); }
  .foot { color: var(--muted); font-size: 13px; text-align: center; }

  /* mobile & touch */
  html, body { overscroll-behavior: none; }
  body { height: 100dvh; -webkit-tap-highlight-color: transparent; }
  #bg { touch-action: none; }
  .stage { -webkit-user-select: none; user-select: none; }
  .bar { flex-wrap: wrap; row-gap: 10px; }
  @media (max-width: 640px) {
    .wordmark { font-size: 14px; }
    .variant { font-size: 11px; padding: 4px 10px; }
    .hero h1 { font-size: clamp(1.9rem, 8.5vw, 2.5rem); }
    .hero p { font-size: 0.92rem; }
    .btn { padding: 13px 28px; font-size: 15px; }
    .foot { font-size: 11.5px; }
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="stage">
  <header class="bar">
    <div class="wordmark"><span class="pip"></span>CVX SPLASH</div>
    <span class="variant">Variation — Billow</span>
  </header>
  <main class="hero">
    <h1>Billow</h1>
    <p>The reference's rising vapor, given the whole frame — soft banks of cloud that swell, churn, and unwind as they climb, parting quietly around the pointer.</p>
    <a class="btn btn-solid" href="#">Get started</a>
  </main>
  <footer class="foot">Move the pointer to part the vapor</footer>
</div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("bg");
  const ctx = canvas.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TAU = Math.PI * 2;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const hash = (i, s) => ((Math.sin(i * 12.9898 + s * 78.233) * 43758.5453) % 1 + 1) % 1;

  let W = 0, H = 0;
  let mx = 0.5, my = 0.45, px = -2, py = -2;
  window.addEventListener("pointermove", e => { mx = e.clientX / W; my = e.clientY / H; });
  window.addEventListener("pointerleave", () => { mx = -2; my = -2; });

  // pre-rendered puff sprites: a hot core fading into a wide tinted skirt
  function makeSprite(stops) {
    const s = document.createElement("canvas");
    s.width = s.height = 256;
    const c2 = s.getContext("2d");
    const g = c2.createRadialGradient(128, 128, 0, 128, 128, 128);
    for (const [o, col] of stops) g.addColorStop(o, col);
    c2.fillStyle = g;
    c2.fillRect(0, 0, 256, 256);
    return s;
  }
  const GLOW = [
    makeSprite([[0, "rgba(210,255,248,0.85)"], [0.32, "rgba(23,232,216,0.42)"], [1, "rgba(23,232,216,0)"]]),
    makeSprite([[0, "rgba(228,238,255,0.85)"], [0.32, "rgba(94,158,255,0.40)"], [1, "rgba(94,158,255,0)"]]),
    makeSprite([[0, "rgba(255,224,242,0.85)"], [0.32, "rgba(255,94,199,0.38)"], [1, "rgba(255,94,199,0)"]]),
    makeSprite([[0, "rgba(240,248,255,0.80)"], [0.32, "rgba(190,214,255,0.34)"], [1, "rgba(190,214,255,0)"]])
  ];
  // the vapor's shadow — same falloff, painted dark, so clouds occlude what's behind them
  const BODY = makeSprite([[0, "rgba(6,11,22,0.85)"], [0.55, "rgba(6,11,22,0.38)"], [1, "rgba(6,11,22,0)"]]);

  // three banks, far wisps to near heroes; each cloud is a cluster of puffs whose
  // anchors slowly orbit and breathe, so the silhouette never stops deforming
  const clouds = [];
  const banks = [
    { n: 9, d0: 0.22, d1: 0.50 },
    { n: 6, d0: 0.50, d1: 0.78 },
    { n: 5, d0: 0.78, d1: 1.00 }
  ];
  for (const b of banks) for (let i = 0; i < b.n; i++) {
    const d = rnd(b.d0, b.d1);
    let tint;
    if (d > 0.78) tint = Math.random() < 0.75 ? 0 : 2;                 // near: teal, rare pink
    else {
      const roll = Math.random();
      tint = roll < 0.45 ? 0 : roll < 0.75 ? 1 : roll < 0.9 ? 3 : 2;
    }
    const np = 5 + (Math.random() * 3 | 0);
    const puffs = [];
    for (let k = 0; k < np; k++) {
      puffs.push({
        u: (k / np) * TAU + rnd(-0.25, 0.25),
        orb: rnd(0.02, 0.06) * (Math.random() < 0.5 ? -1 : 1),          // slow internal churn
        fx: k === 0 ? rnd(0, 0.12) : rnd(0.30, 0.62),                    // puff 0 is the core
        rf: k === 0 ? rnd(0.80, 0.95) : rnd(0.45, 0.80),
        ph1: rnd(0, TAU), ph2: rnd(0, TAU),
        s1: rnd(0.05, 0.14), s2: rnd(0.07, 0.18)
      });
    }
    clouds.push({ d, tint, x: Math.random(), y: Math.random(), ph: rnd(0, TAU), sway: rnd(0.25, 0.6), puffs });
  }
  clouds.sort((a, b) => a.d - b.d);                                     // paint far → near

  function draw(t, dt) {
    px += (mx - px) * 0.07;
    py += (my - py) * 0.07;

    // autonomous camera: the whole frame wanders a little
    const camx = Math.sin(t * 0.021) * 0.018;
    const camy = Math.cos(t * 0.016) * 0.010;

    // sky
    let g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#04070f");
    g.addColorStop(0.55, "#081020");
    g.addColorStop(1, "#0b1626");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // breathing nebula wash, kept faint — the clouds are the show
    ctx.globalCompositeOperation = "lighter";
    let br = 0.8 + 0.2 * Math.sin(t * 0.11);
    let gr = ctx.createRadialGradient(W * 0.24, H * 0.30, 0, W * 0.24, H * 0.30, W * 0.34 * br);
    gr.addColorStop(0, "rgba(122,33,112,0.14)");
    gr.addColorStop(1, "rgba(122,33,112,0)");
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    br = 0.8 + 0.2 * Math.sin(t * 0.09 + 2);
    gr = ctx.createRadialGradient(W * 0.80, H * 0.75, 0, W * 0.80, H * 0.75, W * 0.30 * br);
    gr.addColorStop(0, "rgba(14,110,120,0.12)");
    gr.addColorStop(1, "rgba(14,110,120,0)");
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);

    // stars
    ctx.fillStyle = "#dfe8ff";
    for (let i = 0; i < 130; i++) {
      const sx = hash(i, 1) * W;
      const sy = hash(i, 2) * H;
      const tw = 0.55 + 0.45 * Math.sin(t * (0.25 + (i % 6) * 0.11) + i * 1.7);
      ctx.globalAlpha = 0.55 * tw * (1 - 0.4 * sy / H);
      ctx.beginPath();
      ctx.arc(sx, sy, 0.6 + (i % 4) * 0.32, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // the family's pink planet, high right — rising clouds will pass in front of it
    ctx.globalCompositeOperation = "source-over";
    const pX = W * 0.73 + camx * 0.15 * W + (px > -1 ? (px - 0.5) * -6 : 0);
    const pY = H * 0.21 + camy * 0.15 * H;
    const pR = Math.min(W, H) * 0.046;
    let pg = ctx.createRadialGradient(pX, pY, pR * 0.2, pX, pY, pR * 5);
    pg.addColorStop(0, "rgba(255,94,199,0.16)");
    pg.addColorStop(1, "rgba(255,94,199,0)");
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(pX, pY, pR * 5, 0, TAU); ctx.fill();
    pg = ctx.createRadialGradient(pX - pR * 0.25, pY - pR * 0.25, pR * 0.1, pX, pY, pR);
    pg.addColorStop(0, "#ffd6ec");
    pg.addColorStop(0.55, "#ff9ed2");
    pg.addColorStop(1, "#7a2170");
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(pX, pY, pR, 0, TAU); ctx.fill();

    // the clouds
    for (const c of clouds) {
      // rise slowly, meander on the wind, wrap from top back to below the frame
      c.y -= (0.010 + 0.026 * c.d) * dt;
      c.x += (Math.sin(t * 0.06 + c.ph) * 0.5 + 0.25) * 0.008 * dt * (0.4 + c.d);
      if (c.y < -0.30) { c.y = 1.28; c.x = Math.random(); }
      if (c.x < -0.32) c.x = 1.30; else if (c.x > 1.30) c.x = -0.32;

      const R = Math.min(W, H) * (0.045 + 0.165 * Math.pow(c.d, 1.5));
      const par = px > -1 ? (px - 0.5) * -42 * c.d : 0;
      const parY = py > -1 ? (py - 0.5) * -18 * c.d : 0;
      const X = (c.x + camx * (0.3 + c.d)) * W + par;
      const Y = (c.y + camy * (0.3 + c.d)) * H + parY
              + Math.sin(t * c.sway + c.ph) * R * 0.05;

      // puff geometry for this frame: orbiting anchor, breathing radius,
      // and a direct push away from the pointer — gas parts, then closes
      const puffsOut = [];
      const reach = Math.max(150, R * 1.5);
      for (const p of c.puffs) {
        const th = p.u + t * p.orb;
        const fx = p.fx * (1 + 0.26 * Math.sin(t * p.s1 + p.ph1));
        let sxp = X + Math.cos(th) * R * fx;
        let syp = Y + Math.sin(th) * R * fx * 0.42 * (1 + 0.18 * Math.sin(t * p.s2 + p.ph2));
        let f = 0;
        if (px > -1) {
          const dx = sxp - px * W, dy = syp - py * H;
          const dd = Math.hypot(dx, dy);
          if (dd < reach && dd > 1) {
            f = Math.pow(1 - dd / reach, 1.6);
            const m = f * R * 0.8 * (0.3 + 0.7 * c.d);
            sxp += dx / dd * m; syp += dy / dd * m;
          }
        }
        const r = Math.max(2, R * p.rf * (1 + 0.28 * Math.sin(t * p.s2 * 1.25 + p.ph2)));
        puffsOut.push([sxp, syp, r, f]);
      }

      // vapor body first: darkens the stars and planet behind the cloud
      if (c.d > 0.5) {
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = 0.08 + 0.15 * c.d;
        for (const [x2, y2, r2] of puffsOut)
          ctx.drawImage(BODY, x2 - r2, y2 - r2, r2 * 2, r2 * 2);
      }

      // then the luminous glow, brighter where the parting compresses it
      ctx.globalCompositeOperation = "lighter";
      const spr = GLOW[c.tint];
      const ga = (0.05 + 0.09 * Math.pow(c.d, 1.5)) * (c.tint === 2 ? 0.85 : 1);
      for (const [x2, y2, r2, f] of puffsOut) {
        ctx.globalAlpha = Math.min(1, ga * (1 + f * 0.8));
        ctx.drawImage(spr, x2 - r2, y2 - r2, r2 * 2, r2 * 2);
      }
      ctx.globalAlpha = 1;
    }

    ctx.globalCompositeOperation = "source-over";

    // vignette
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.4, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, "rgba(2,4,8,0)");
    vg.addColorStop(1, "rgba(2,4,8,0.5)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (reduced) draw(4000, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  if (reduced) draw(4000, 0);
  else {
    let last = performance.now();
    requestAnimationFrame(function loop(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      draw(now / 1000, dt);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
