<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVX Splash — Comet Stream</title>
<style>
  :root {
    --void: #060a13; --ink: #eef2fb; --muted: #aab6cf;
    --line: rgba(238, 242, 251, 0.14); --teal: #17e8d8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--void); color: var(--ink);
    font-family: "Segoe UI", "Avenir Next", system-ui, sans-serif;
    height: 100vh; overflow: hidden;
  }
  #bg { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .stage {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    justify-content: space-between; padding: clamp(20px, 4vw, 44px);
    opacity: 0; animation: settle 1s ease-out 0.3s forwards;
  }
  @keyframes settle { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .stage { animation: none; opacity: 1; } }
  .bar { display: flex; align-items: center; justify-content: space-between; }
  .wordmark {
    display: flex; align-items: center; gap: 12px;
    font-family: "Bahnschrift", "Segoe UI", sans-serif;
    font-weight: 700; font-size: 16px; letter-spacing: 0.14em;
  }
  .wordmark .pip {
    width: 13px; height: 13px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff5ec7, #7a2170 75%);
    box-shadow: 0 0 12px rgba(255, 94, 199, 0.7);
  }
  .variant {
    color: var(--muted); font-size: 13.5px;
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px;
  }
  .hero { text-align: center; max-width: 680px; margin: 0 auto; padding-bottom: 5vh; }
  .hero h1 {
    font-family: "Bahnschrift", "Segoe UI", sans-serif;
    font-size: clamp(2.2rem, 5.5vw, 3.8rem); font-weight: 700; line-height: 1.05;
    text-shadow: 0 2px 28px rgba(3, 6, 12, 0.85);
  }
  .hero p {
    margin: 14px auto 26px; max-width: 44ch; color: var(--muted);
    font-size: clamp(0.95rem, 1.5vw, 1.1rem); line-height: 1.6;
    text-shadow: 0 1px 18px rgba(3, 6, 12, 0.9);
  }
  .btn {
    font: inherit; font-size: 14.5px; padding: 11px 24px; border-radius: 10px;
    cursor: pointer; text-decoration: none; transition: transform 0.2s, background 0.2s;
  }
  .btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
  .btn-solid { background: var(--ink); color: #0a0f1c; border: 1px solid var(--ink); }
  .btn-solid:hover { background: #fff; transform: translateY(-1px); }
  .foot { color: var(--muted); font-size: 13px; text-align: center; }

  /* mobile & touch */
  html, body { overscroll-behavior: none; }
  body { height: 100dvh; -webkit-tap-highlight-color: transparent; }
  #bg { touch-action: none; }
  .stage { -webkit-user-select: none; user-select: none; }
  .bar { flex-wrap: wrap; row-gap: 10px; }
  @media (max-width: 640px) {
    .wordmark { font-size: 14px; }
    .variant { font-size: 11px; padding: 4px 10px; }
    .hero h1 { font-size: clamp(1.9rem, 8.5vw, 2.5rem); }
    .hero p { font-size: 0.92rem; }
    .btn { padding: 13px 28px; font-size: 15px; }
    .foot { font-size: 11.5px; }
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="stage">
  <header class="bar">
    <div class="wordmark"><span class="pip"></span>CVX SPLASH</div>
    <span class="variant">Variation — Comet Stream</span>
  </header>
  <main class="hero">
    <h1>Comet Stream</h1>
    <p>A schooling flock of glowing beads rides an invisible current. The pointer bends the flow around itself.</p>
    <a class="btn btn-solid" href="#">Get started</a>
  </main>
  <footer class="foot">Move the pointer to bend the current</footer>
</div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("bg");
  const ctx = canvas.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TAU = Math.PI * 2;
  const rnd = (a, b) => a + Math.random() * (b - a);

  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    paintBase(1);
  }
  window.addEventListener("resize", resize);

  // smooth pseudo-curl flow field from layered sines — no noise library needed
  function flowAngle(x, y, t) {
    const sx = x / W, sy = y / H;
    return (
      Math.sin(sx * 4.1 + t * 0.32) * 1.5 +
      Math.cos(sy * 3.3 - t * 0.21) * 1.3 +
      Math.sin((sx + sy) * 2.2 + t * 0.13) * 0.9
    );
  }

  const COLS = [
    [23, 232, 216],    // teal (most)
    [94, 158, 255],    // periwinkle
    [255, 94, 199],    // pink (few)
    [232, 240, 255]    // white (few)
  ];

  const N = 64;
  const beads = [];
  for (let i = 0; i < N; i++) {
    beads.push({
      x: Math.random(), y: Math.random(),          // relative
      depth: rnd(0.35, 1),                         // parallax + speed + size
      r: rnd(1.6, 3.4),
      col: Math.random() < 0.6 ? COLS[0] : (Math.random() < 0.5 ? COLS[1] : (Math.random() < 0.6 ? COLS[2] : COLS[3])),
      ph: rnd(0, TAU),
      trail: []                                     // recent relative positions
    });
  }

  let mx = -1, my = -1, px = -1, py = -1, hasPointer = false;
  window.addEventListener("pointermove", e => { mx = e.clientX / W; my = e.clientY / H; hasPointer = true; });
  window.addEventListener("pointerleave", () => { hasPointer = false; });

  function paintBase(alpha) {
    ctx.globalCompositeOperation = "source-over";
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "rgba(7,11,20," + alpha + ")");
    g.addColorStop(0.6, "rgba(10,15,29," + alpha + ")");
    g.addColorStop(1, "rgba(13,20,36," + alpha + ")");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  let first = true;
  function frame(now, dt) {
    const t = now / 1000;
    px += (mx - px) * 0.06;
    py += (my - py) * 0.06;

    if (first) { resize(); first = false; }

    // wash for trails
    paintBase(0.14);

    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";

    for (const b of beads) {
      const speed = 0.045 * b.depth;               // relative units / s
      const a = flowAngle(b.x, b.y, t);
      let vx = Math.cos(a) * speed;
      let vy = Math.sin(a) * speed * 0.6 + 0.006;  // slight downward bias

      // pointer bends the flow: push away within a radius
      if (hasPointer) {
        const dx = b.x - px, dy = b.y - py;
        const d = Math.hypot(dx, dy);
        const reach = 0.18;
        if (d < reach && d > 0.001) {
          const f = (1 - d / reach) * 0.09;
          vx += (dx / d) * f;
          vy += (dy / d) * f;
        }
      }

      b.x += vx * dt;
      b.y += vy * dt;

      // wrap with margin
      if (b.x < -0.05) b.x = 1.05; if (b.x > 1.05) b.x = -0.05;
      if (b.y < -0.05) b.y = 1.05; if (b.y > 1.05) b.y = -0.05;

      b.trail.push([b.x, b.y]);
      if (b.trail.length > 14) b.trail.shift();

      // trail: tapering segments
      const [r, g, bl] = b.col;
      for (let i = 1; i < b.trail.length; i++) {
        const f = i / b.trail.length;
        ctx.strokeStyle = `rgba(${r},${g},${bl},${0.46 * f * b.depth})`;
        ctx.lineWidth = b.r * f * 1.3;
        ctx.beginPath();
        ctx.moveTo(b.trail[i - 1][0] * W, b.trail[i - 1][1] * H);
        ctx.lineTo(b.trail[i][0] * W, b.trail[i][1] * H);
        ctx.stroke();
      }

      // head with soft glow
      const hx = b.x * W, hy = b.y * H;
      const gr = ctx.createRadialGradient(hx, hy, 0, hx, hy, b.r * 4);
      gr.addColorStop(0, `rgba(${r},${g},${bl},${0.5 * b.depth})`);
      gr.addColorStop(1, `rgba(${r},${g},${bl},0)`);
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(hx, hy, b.r * 4, 0, TAU); ctx.fill();
      ctx.fillStyle = `rgba(${Math.min(r + 60, 255)},${Math.min(g + 60, 255)},${Math.min(bl + 60, 255)},${0.9 * b.depth})`;
      ctx.beginPath(); ctx.arc(hx, hy, b.r * 0.8, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
  }

  if (reduced) {
    // warm up trails then hold
    for (let k = 0; k < 90; k++) frame(k * 16, 0.016);
    paintBase(0.6);
  } else {
    let last = performance.now();
    requestAnimationFrame(function loop(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      frame(now, dt);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
