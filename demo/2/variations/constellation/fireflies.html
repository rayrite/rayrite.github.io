<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVX Splash — Fireflies</title>
<style>
  :root {
    --void: #060a13; --ink: #eef2fb; --muted: #aab6cf;
    --line: rgba(238, 242, 251, 0.14); --teal: #17e8d8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--void); color: var(--ink);
    font-family: "Segoe UI", "Avenir Next", system-ui, sans-serif;
    height: 100vh; overflow: hidden;
  }
  #bg { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .stage {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    justify-content: space-between; padding: clamp(20px, 4vw, 44px);
    opacity: 0; animation: settle 1s ease-out 0.3s forwards;
  }
  @keyframes settle { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .stage { animation: none; opacity: 1; } }
  .bar { display: flex; align-items: center; justify-content: space-between; }
  .wordmark {
    display: flex; align-items: center; gap: 12px;
    font-family: "Bahnschrift", "Segoe UI", sans-serif;
    font-weight: 700; font-size: 16px; letter-spacing: 0.14em;
  }
  .wordmark .pip {
    width: 13px; height: 13px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff5ec7, #7a2170 75%);
    box-shadow: 0 0 12px rgba(255, 94, 199, 0.7);
  }
  .variant {
    color: var(--muted); font-size: 13.5px;
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px;
  }
  .hero { text-align: center; max-width: 680px; margin: 0 auto; padding-bottom: 5vh; }
  .hero h1 {
    font-family: "Bahnschrift", "Segoe UI", sans-serif;
    font-size: clamp(2.2rem, 5.5vw, 3.8rem); font-weight: 700; line-height: 1.05;
    text-shadow: 0 2px 28px rgba(3, 6, 12, 0.85);
  }
  .hero p {
    margin: 14px auto 26px; max-width: 44ch; color: var(--muted);
    font-size: clamp(0.95rem, 1.5vw, 1.1rem); line-height: 1.6;
    text-shadow: 0 1px 18px rgba(3, 6, 12, 0.9);
  }
  .btn {
    font: inherit; font-size: 14.5px; padding: 11px 24px; border-radius: 10px;
    cursor: pointer; text-decoration: none; transition: transform 0.2s, background 0.2s;
  }
  .btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
  .btn-solid { background: var(--ink); color: #0a0f1c; border: 1px solid var(--ink); }
  .btn-solid:hover { background: #fff; transform: translateY(-1px); }
  .foot { color: var(--muted); font-size: 13px; text-align: center; }

  /* mobile & touch */
  html, body { overscroll-behavior: none; }
  body { height: 100dvh; -webkit-tap-highlight-color: transparent; }
  #bg { touch-action: none; }
  .stage { -webkit-user-select: none; user-select: none; }
  .bar { flex-wrap: wrap; row-gap: 10px; }
  @media (max-width: 640px) {
    .wordmark { font-size: 14px; }
    .variant { font-size: 11px; padding: 4px 10px; }
    .hero h1 { font-size: clamp(1.9rem, 8.5vw, 2.5rem); }
    .hero p { font-size: 0.92rem; }
    .btn { padding: 13px 28px; font-size: 15px; }
    .foot { font-size: 11.5px; }
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="stage">
  <header class="bar">
    <div class="wordmark"><span class="pip"></span>CVX SPLASH</div>
    <span class="variant">Variation — Fireflies</span>
  </header>
  <main class="hero">
    <h1>Fireflies</h1>
    <p>A field of fireflies drifting toward synchrony — their blinks slowly align, and constellations form only among the lit. The pointer is a lantern they gather round.</p>
    <a class="btn btn-solid" href="#">Get started</a>
  </main>
  <footer class="foot">The lantern gathers them</footer>
</div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("bg");
  const ctx = canvas.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TAU = Math.PI * 2;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const hash = (i, s) => {
    const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453;
    return x - Math.floor(x);
  };

  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // glow sprites, painted once
  function makeGlow(r, g, b) {
    const s = document.createElement("canvas");
    s.width = s.height = 64;
    const c = s.getContext("2d");
    const gr = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, `rgba(${r},${g},${b},1)`);
    gr.addColorStop(0.25, `rgba(${r},${g},${b},0.5)`);
    gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
    c.fillStyle = gr;
    c.fillRect(0, 0, 64, 64);
    return s;
  }
  const glowNear = makeGlow(23, 232, 216);       // teal, the near field
  const glowPink = makeGlow(255, 94, 199);       // the rare one
  const glowFar = makeGlow(94, 158, 255);        // far field washes blue
  const glowLantern = makeGlow(255, 236, 196);   // warm lantern

  const N = 90;
  const K = 1.6;          // Kuramoto coupling — modest, sync takes its time
  const R = 0.12;         // coupling radius, relative
  const LINK = 0.10;      // constellation link distance, relative
  const flies = [];
  for (let i = 0; i < N; i++) {
    const far = Math.random() < 0.42;
    flies.push({
      x: Math.random(), y: Math.random(),
      far,
      sc: far ? 0.55 : 1,                    // far ones smaller, dimmer, slower
      th: rnd(0, TAU),                        // blink phase
      om: rnd(0.5, 0.7) * (far ? 0.85 : 1),   // intrinsic frequency
      f1: rnd(0.4, 1.0), f2: rnd(0.3, 0.7),
      ph: rnd(0, TAU), ph2: rnd(0, TAU),
      pink: !far && Math.random() < 0.05,
      b: 0
    });
  }

  let mx = -2, my = -2, px = -2, py = -2, hasPointer = false;
  window.addEventListener("pointermove", e => {
    mx = e.clientX / W; my = e.clientY / H; hasPointer = true;
  });
  window.addEventListener("pointerleave", () => { hasPointer = false; mx = -2; my = -2; });

  function step(dt, t) {
    px += (mx - px) * 0.07;
    py += (my - py) * 0.07;

    // Kuramoto over neighbors: theta_i += (omega_i + K/n * sum sin(theta_j - theta_i)) dt
    for (let i = 0; i < N; i++) {
      const f = flies[i];
      let s = 0, c = 0;
      for (let j = 0; j < N; j++) {
        if (j === i) continue;
        const o = flies[j];
        const dx = f.x - o.x; if (dx > R || dx < -R) continue;
        const dy = f.y - o.y; if (dy > R || dy < -R) continue;
        if (dx * dx + dy * dy < R * R) { s += Math.sin(o.th - f.th); c++; }
      }
      const pull = c ? K / c * s : 0;

      // the lantern nudges their clocks a touch earlier
      let lantern = 0;
      if (hasPointer) {
        const d = Math.hypot(f.x - px, f.y - py);
        if (d < 0.15) lantern = 0.3 * (1 - d / 0.15);
      }
      f.th = (f.th + (f.om + pull + lantern) * dt) % TAU;

      // smooth wander, slower in the far field
      const spd = 0.011 * f.sc;
      f.x += (Math.sin(t * f.f1 + f.ph) + 0.6 * Math.sin(t * f.f2 + f.ph2)) * spd * dt;
      f.y += (Math.cos(t * f.f2 + f.ph2) + 0.6 * Math.cos(t * f.f1 + f.ph)) * spd * dt;

      // drawn to the lantern
      if (hasPointer) {
        const dx = px - f.x, dy = py - f.y;
        const d = Math.hypot(dx, dy);
        if (d < 0.15 && d > 0.01) {
          const a = 0.018 * (1 - d / 0.15) * dt;
          f.x += dx / d * a;
          f.y += dy / d * a;
        }
      }

      if (f.x < -0.05) f.x = 1.05; if (f.x > 1.05) f.x = -0.05;
      if (f.y < -0.05) f.y = 1.05; if (f.y > 1.05) f.y = -0.05;

      f.b = Math.pow(Math.max(0, Math.cos(f.th)), 6);
    }
  }

  function frame(now, dt) {
    const t = now / 1000;
    const grow = reduced ? 1 : Math.min(t / 1.6, 1);

    step(dt, t);

    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#070b14");
    g.addColorStop(0.6, "#0a0f1d");
    g.addColorStop(1, "#0d1424");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = "lighter";

    // a low mist so the field has somewhere to live
    let gr = ctx.createRadialGradient(W * 0.3, H * 0.7, 0, W * 0.3, H * 0.7, W * 0.5);
    gr.addColorStop(0, "rgba(16,80,88,0.10)");
    gr.addColorStop(1, "rgba(16,80,88,0)");
    ctx.fillStyle = gr;
    ctx.fillRect(0, 0, W, H);

    // links exist only between two currently lit
    ctx.lineWidth = 1;
    for (let i = 0; i < N; i++) {
      const a = flies[i];
      if (a.b < 0.35) continue;
      for (let j = i + 1; j < N; j++) {
        const b = flies[j];
        if (b.b < 0.35) continue;
        const dx = a.x - b.x; if (dx > LINK || dx < -LINK) continue;
        const dy = a.y - b.y; if (dy > LINK || dy < -LINK) continue;
        const d = Math.hypot(dx, dy);
        if (d < LINK) {
          const al = Math.min(a.b, b.b) * (1 - d / LINK) * 0.5 * grow;
          ctx.strokeStyle = `rgba(23,232,216,${al})`;
          ctx.beginPath();
          ctx.moveTo(a.x * W, a.y * H);
          ctx.lineTo(b.x * W, b.y * H);
          ctx.stroke();
        }
      }
    }

    // the fireflies themselves
    for (const f of flies) {
      const dim = f.far ? 0.4 : 1;
      const r = (f.far ? 5 : 9) + f.b * (f.far ? 5 : 10);
      const al = (0.06 + 0.9 * f.b) * dim * grow;
      ctx.globalAlpha = al;
      const img = f.pink ? glowPink : (f.far ? glowFar : glowNear);
      ctx.drawImage(img, f.x * W - r, f.y * H - r, r * 2, r * 2);
      if (f.b > 0.5 && !f.far) {
        ctx.globalAlpha = f.b * grow;
        ctx.fillStyle = "rgba(232,255,250,0.95)";
        ctx.beginPath();
        ctx.arc(f.x * W, f.y * H, 1.3, 0, TAU);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // the lantern
    if (hasPointer) {
      const lp = 0.85 + 0.15 * Math.sin(t * 2.2);
      ctx.globalAlpha = 0.38 * lp;
      ctx.drawImage(glowLantern, px * W - 85, py * H - 85, 170, 170);
      ctx.globalAlpha = 0.8 * lp;
      ctx.drawImage(glowLantern, px * W - 22, py * H - 22, 44, 44);
      ctx.globalAlpha = 1;
    }

    ctx.globalCompositeOperation = "source-over";

    const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.36, W / 2, H / 2, Math.max(W, H) * 0.75);
    v.addColorStop(0, "rgba(3,6,12,0)");
    v.addColorStop(1, "rgba(3,6,12,0.55)");
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  }

  let holdT = 0;
  resize();
  window.addEventListener("resize", () => {
    resize();
    if (reduced) frame(holdT, 0.016);
  });

  if (reduced) {
    // let some synchrony emerge, then hold one still frame
    for (let k = 0; k < 500; k++) frame(k * 16, 0.016);
    holdT = 499 * 16;
  } else {
    let last = performance.now();
    requestAnimationFrame(function loop(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      frame(now, dt);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
