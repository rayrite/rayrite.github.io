<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVX Splash — Orbits</title>
<style>
  :root {
    --void: #060a13; --ink: #eef2fb; --muted: #aab6cf;
    --line: rgba(238, 242, 251, 0.14); --teal: #17e8d8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--void); color: var(--ink);
    font-family: "Segoe UI", "Avenir Next", system-ui, sans-serif;
    height: 100vh; overflow: hidden;
  }
  #bg { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .stage {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    justify-content: space-between; padding: clamp(20px, 4vw, 44px);
    opacity: 0; animation: settle 1s ease-out 0.3s forwards;
  }
  @keyframes settle { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .stage { animation: none; opacity: 1; } }
  .bar { display: flex; align-items: center; justify-content: space-between; }
  .wordmark {
    display: flex; align-items: center; gap: 12px;
    font-family: "Bahnschrift", "Segoe UI", sans-serif;
    font-weight: 700; font-size: 16px; letter-spacing: 0.14em;
  }
  .wordmark .pip {
    width: 13px; height: 13px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff5ec7, #7a2170 75%);
    box-shadow: 0 0 12px rgba(255, 94, 199, 0.7);
  }
  .variant {
    color: var(--muted); font-size: 13.5px;
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px;
  }
  .hero { text-align: center; max-width: 680px; margin: 0 auto; padding-bottom: 5vh; }
  .hero h1 {
    font-family: "Bahnschrift", "Segoe UI", sans-serif;
    font-size: clamp(2.2rem, 5.5vw, 3.8rem); font-weight: 700; line-height: 1.05;
    text-shadow: 0 2px 28px rgba(3, 6, 12, 0.85);
  }
  .hero p {
    margin: 14px auto 26px; max-width: 44ch; color: var(--muted);
    font-size: clamp(0.95rem, 1.5vw, 1.1rem); line-height: 1.6;
    text-shadow: 0 1px 18px rgba(3, 6, 12, 0.9);
  }
  .btn {
    font: inherit; font-size: 14.5px; padding: 11px 24px; border-radius: 10px;
    cursor: pointer; text-decoration: none; transition: transform 0.2s, background 0.2s;
  }
  .btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
  .btn-solid { background: var(--ink); color: #0a0f1c; border: 1px solid var(--ink); }
  .btn-solid:hover { background: #fff; transform: translateY(-1px); }
  .foot { color: var(--muted); font-size: 13px; text-align: center; }

  /* mobile & touch */
  html, body { overscroll-behavior: none; }
  body { height: 100dvh; -webkit-tap-highlight-color: transparent; }
  #bg { touch-action: none; }
  .stage { -webkit-user-select: none; user-select: none; }
  .bar { flex-wrap: wrap; row-gap: 10px; }
  @media (max-width: 640px) {
    .wordmark { font-size: 14px; }
    .variant { font-size: 11px; padding: 4px 10px; }
    .hero h1 { font-size: clamp(1.9rem, 8.5vw, 2.5rem); }
    .hero p { font-size: 0.92rem; }
    .btn { padding: 13px 28px; font-size: 15px; }
    .foot { font-size: 11.5px; }
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="stage">
  <header class="bar">
    <div class="wordmark"><span class="pip"></span>CVX SPLASH</div>
    <span class="variant">Variation — Orbits</span>
  </header>
  <main class="hero">
    <h1>Orbits</h1>
    <p>Motes tracing slow ellipses around unseen masses, their trails fading like ink. Every path obeys the same gravity — and so does the pointer's.</p>
    <a class="btn btn-solid" href="#">Get started</a>
  </main>
  <footer class="foot">Your pointer has gravity</footer>
</div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("bg");
  const ctx = canvas.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TAU = Math.PI * 2;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const hash = (i, s) => {
    const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453;
    return x - Math.floor(x);
  };

  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function makeGlow(r, g, b) {
    const s = document.createElement("canvas");
    s.width = s.height = 64;
    const c = s.getContext("2d");
    const gr = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, `rgba(${r},${g},${b},1)`);
    gr.addColorStop(0.25, `rgba(${r},${g},${b},0.5)`);
    gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
    c.fillStyle = gr;
    c.fillRect(0, 0, 64, 64);
    return s;
  }
  const glows = [
    makeGlow(23, 232, 216),     // teal
    makeGlow(94, 158, 255),     // periwinkle
    makeGlow(202, 222, 255),    // pale
    makeGlow(255, 94, 199)      // pink, sparing
  ];
  const glowPtr = makeGlow(23, 232, 216);

  // three unseen masses; G tuned so an orbit takes tens of seconds
  const G = 0.00025;
  const MASSES = [
    { x: 0.28, y: 0.36, m: 1.0 },
    { x: 0.72, y: 0.62, m: 1.4 },
    { x: 0.50, y: 0.83, m: 0.8 }
  ];

  const N = 90;
  const TRAIL = 16;
  const motes = [];

  function spawn(m) {
    const mi = (Math.random() * MASSES.length) | 0;
    const M = MASSES[mi];
    const r = rnd(0.07, 0.17);
    const a = rnd(0, TAU);
    const v = Math.sqrt(G * M.m / r) * rnd(0.92, 1.08);
    const dir = Math.random() < 0.5 ? 1 : -1;
    m.x = M.x + Math.cos(a) * r;
    m.y = M.y + Math.sin(a) * r;
    m.vx = -Math.sin(a) * v * dir + Math.cos(a + 0.5) * v * 0.06;  // a touch of eccentricity
    m.vy = Math.cos(a) * v * dir + Math.sin(a + 0.5) * v * 0.06;
    m.home = mi;
    m.col = Math.random() < 0.12 ? 3 : mi;
    m.trail = [];
  }
  for (let i = 0; i < N; i++) {
    const m = { trail: [] };
    spawn(m);
    motes.push(m);
  }

  let mx = -2, my = -2, px = -2, py = -2, hasPointer = false;
  window.addEventListener("pointermove", e => {
    mx = e.clientX / W; my = e.clientY / H; hasPointer = true;
  });
  window.addEventListener("pointerleave", () => { hasPointer = false; mx = -2; my = -2; });

  function step(dt, t) {
    px += (mx - px) * 0.07;
    py += (my - py) * 0.07;

    const sdt = dt / 2;
    for (let s = 0; s < 2; s++) {
      for (const m of motes) {
        let ax = 0, ay = 0;
        for (const M of MASSES) {
          const dx = M.x - m.x, dy = M.y - m.y;
          let d = Math.hypot(dx, dy);
          if (d < 0.025) d = 0.025;
          const f = G * M.m / (d * d * d);
          ax += dx * f;
          ay += dy * f;
        }
        // the pointer is a mass too
        if (hasPointer) {
          const dx = px - m.x, dy = py - m.y;
          let d = Math.hypot(dx, dy);
          if (d < 0.025) d = 0.025;
          const f = G * 0.9 / (d * d * d);
          ax += dx * f;
          ay += dy * f;
        }
        m.vx += ax * sdt;
        m.vy += ay * sdt;
        m.x += m.vx * sdt;
        m.y += m.vy * sdt;
      }
    }

    for (const m of motes) {
      // escaped or swallowed: begin again on a fresh orbit
      let gone = m.x < -0.6 || m.x > 1.6 || m.y < -0.6 || m.y > 1.6;
      if (!gone) {
        for (const M of MASSES) {
          if (Math.hypot(M.x - m.x, M.y - m.y) < 0.02) { gone = true; break; }
        }
      }
      if (gone) { spawn(m); continue; }

      // ink trail: remember a point only once we've moved a little
      const tr = m.trail;
      const last = tr[tr.length - 1];
      if (!last || Math.hypot(m.x - last[0], m.y - last[1]) > 0.005) {
        tr.push([m.x, m.y]);
        if (tr.length > TRAIL) tr.shift();
      }
    }
  }

  function frame(now, dt) {
    const t = now / 1000;
    const grow = reduced ? 1 : Math.min(t / 1.8, 1);

    step(dt, t);

    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#060a14");
    g.addColorStop(0.6, "#090f1d");
    g.addColorStop(1, "#0c1322");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = "lighter";

    // the masses, barely suggested
    for (let i = 0; i < MASSES.length; i++) {
      const M = MASSES[i];
      const gr = ctx.createRadialGradient(M.x * W, M.y * H, 0, M.x * W, M.y * H, 60 + M.m * 30);
      gr.addColorStop(0, "rgba(23,120,130,0.06)");
      gr.addColorStop(1, "rgba(23,120,130,0)");
      ctx.fillStyle = gr;
      ctx.fillRect(0, 0, W, H);
    }

    // trails in three fading bands, like ink laid down and left to dry
    const BANDS = [
      { a: 0.05, w: 0.6 },
      { a: 0.12, w: 1.0 },
      { a: 0.24, w: 1.5 }
    ];
    ctx.lineCap = "round";
    for (const m of motes) {
      const tr = m.trail;
      if (tr.length < 4) continue;
      for (let b = 0; b < 3; b++) {
        const i0 = Math.floor(b * (tr.length - 1) / 3);
        const i1 = Math.floor((b + 1) * (tr.length - 1) / 3);
        if (i1 <= i0) continue;
        // color follows the mote's home
        const c = [[23, 232, 216], [94, 158, 255], [202, 222, 255], [255, 94, 199]][m.col];
        ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${BANDS[b].a * grow})`;
        ctx.lineWidth = BANDS[b].w;
        ctx.beginPath();
        ctx.moveTo(tr[i0][0] * W, tr[i0][1] * H);
        for (let i = i0 + 1; i <= i1; i++) ctx.lineTo(tr[i][0] * W, tr[i][1] * H);
        ctx.stroke();
      }
    }

    // faint communities: same home, close together
    ctx.lineWidth = 1;
    for (let h = 0; h < MASSES.length; h++) {
      const group = motes.filter(m => m.home === h && m.col !== 3);
      for (let i = 0; i < group.length; i++) {
        for (let j = i + 1; j < group.length; j++) {
          const dx = group[i].x - group[j].x; if (dx > 0.06 || dx < -0.06) continue;
          const dy = group[i].y - group[j].y; if (dy > 0.06 || dy < -0.06) continue;
          const d = Math.hypot(dx, dy);
          if (d < 0.06) {
            ctx.strokeStyle = `rgba(23,232,216,${(1 - d / 0.06) * 0.08 * grow})`;
            ctx.beginPath();
            ctx.moveTo(group[i].x * W, group[i].y * H);
            ctx.lineTo(group[j].x * W, group[j].y * H);
            ctx.stroke();
          }
        }
      }
    }

    // the motes, brighter when moving fast
    for (const m of motes) {
      const sp = Math.hypot(m.vx, m.vy);
      const heat = Math.min(sp / 0.07, 1);
      const r = 2.5 + heat * 3.5;
      ctx.globalAlpha = (0.3 + heat * 0.6) * grow;
      ctx.drawImage(glows[m.col], m.x * W - r * 2, m.y * H - r * 2, r * 4, r * 4);
    }
    ctx.globalAlpha = 1;

    // the pointer's presence: a lensing ring rather than a sun
    if (hasPointer) {
      const rr = 24 + 3 * Math.sin(t * 2.4);
      ctx.strokeStyle = `rgba(23,232,216,${0.16 * grow})`;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(px * W, py * H, rr, 0, TAU);
      ctx.stroke();
      ctx.strokeStyle = `rgba(23,232,216,${0.07 * grow})`;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(px * W, py * H, rr * 0.6, 0, TAU);
      ctx.stroke();
    }
    ctx.lineWidth = 1;

    ctx.globalCompositeOperation = "source-over";

    const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.36, W / 2, H / 2, Math.max(W, H) * 0.75);
    v.addColorStop(0, "rgba(3,6,12,0)");
    v.addColorStop(1, "rgba(3,6,12,0.55)");
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  }

  let holdT = 0;
  resize();
  window.addEventListener("resize", () => {
    resize();
    if (reduced) frame(holdT, 0.016);
  });

  if (reduced) {
    // let the orbits lay down their trails, then hold one still frame
    for (let k = 0; k < 400; k++) frame(k * 16, 0.016);
    holdT = 399 * 16;
  } else {
    let last = performance.now();
    requestAnimationFrame(function loop(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      frame(now, dt);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
