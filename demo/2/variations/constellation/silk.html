<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVX Splash — Silk</title>
<style>
  :root {
    --void: #060a13; --ink: #eef2fb; --muted: #aab6cf;
    --line: rgba(238, 242, 251, 0.14); --teal: #17e8d8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--void); color: var(--ink);
    font-family: "Segoe UI", "Avenir Next", system-ui, sans-serif;
    height: 100vh; overflow: hidden;
  }
  #bg { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .stage {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    justify-content: space-between; padding: clamp(20px, 4vw, 44px);
    opacity: 0; animation: settle 1s ease-out 0.3s forwards;
  }
  @keyframes settle { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .stage { animation: none; opacity: 1; } }
  .bar { display: flex; align-items: center; justify-content: space-between; }
  .wordmark {
    display: flex; align-items: center; gap: 12px;
    font-family: "Bahnschrift", "Segoe UI", sans-serif;
    font-weight: 700; font-size: 16px; letter-spacing: 0.14em;
  }
  .wordmark .pip {
    width: 13px; height: 13px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff5ec7, #7a2170 75%);
    box-shadow: 0 0 12px rgba(255, 94, 199, 0.7);
  }
  .variant {
    color: var(--muted); font-size: 13.5px;
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px;
  }
  .hero { text-align: center; max-width: 680px; margin: 0 auto; padding-bottom: 5vh; }
  .hero h1 {
    font-family: "Bahnschrift", "Segoe UI", sans-serif;
    font-size: clamp(2.2rem, 5.5vw, 3.8rem); font-weight: 700; line-height: 1.05;
    text-shadow: 0 2px 28px rgba(3, 6, 12, 0.85);
  }
  .hero p {
    margin: 14px auto 26px; max-width: 44ch; color: var(--muted);
    font-size: clamp(0.95rem, 1.5vw, 1.1rem); line-height: 1.6;
    text-shadow: 0 1px 18px rgba(3, 6, 12, 0.9);
  }
  .btn {
    font: inherit; font-size: 14.5px; padding: 11px 24px; border-radius: 10px;
    cursor: pointer; text-decoration: none; transition: transform 0.2s, background 0.2s;
  }
  .btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
  .btn-solid { background: var(--ink); color: #0a0f1c; border: 1px solid var(--ink); }
  .btn-solid:hover { background: #fff; transform: translateY(-1px); }
  .foot { color: var(--muted); font-size: 13px; text-align: center; }

  /* mobile & touch */
  html, body { overscroll-behavior: none; }
  body { height: 100dvh; -webkit-tap-highlight-color: transparent; }
  #bg { touch-action: none; }
  .stage { -webkit-user-select: none; user-select: none; }
  .bar { flex-wrap: wrap; row-gap: 10px; }
  @media (max-width: 640px) {
    .wordmark { font-size: 14px; }
    .variant { font-size: 11px; padding: 4px 10px; }
    .hero h1 { font-size: clamp(1.9rem, 8.5vw, 2.5rem); }
    .hero p { font-size: 0.92rem; }
    .btn { padding: 13px 28px; font-size: 15px; }
    .foot { font-size: 11.5px; }
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="stage">
  <header class="bar">
    <div class="wordmark"><span class="pip"></span>CVX SPLASH</div>
    <span class="variant">Variation — Silk</span>
  </header>
  <main class="hero">
    <h1>Silk</h1>
    <p>Threads strung across the dark, each one a string with real waves in it. Brush across them and the vibration travels, light beads trembling where it shakes.</p>
    <a class="btn btn-solid" href="#">Get started</a>
  </main>
  <footer class="foot">Brush across the threads to pluck them</footer>
</div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("bg");
  const ctx = canvas.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TAU = Math.PI * 2;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const hash = (i, s) => {
    const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453;
    return x - Math.floor(x);
  };

  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function makeGlow(r, g, b) {
    const s = document.createElement("canvas");
    s.width = s.height = 64;
    const c = s.getContext("2d");
    const gr = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, `rgba(${r},${g},${b},1)`);
    gr.addColorStop(0.25, `rgba(${r},${g},${b},0.5)`);
    gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
    c.fillStyle = gr;
    c.fillRect(0, 0, 64, 64);
    return s;
  }
  const glowTeal = makeGlow(23, 232, 216);
  const glowPink = makeGlow(255, 94, 199);

  // each thread: a bowed string of 14 joints carrying a damped wave
  const NJ = 14;
  const C2 = 676;        // wave speed squared — end to end in about half a second
  const DAMP = 0.8;      // light, so a pluck rings for roughly three seconds
  const AMBIENT = 0.012; // the field is never perfectly still

  const threads = [];
  const NT = 22;
  for (let i = 0; i < NT; i++) {
    const u = new Float32Array(NJ), uv = new Float32Array(NJ);
    threads.push({
      base: 0.05 + (i / (NT - 1)) * 0.9 + rnd(-0.006, 0.006),
      bow: rnd(0.004, 0.01) * (Math.random() < 0.5 ? 1 : -1),
      tph: rnd(0, TAU),
      pink: Math.random() < 0.1,
      u, uv,
      meanV: 0
    });
  }
  const restX = (th, yr) => th.base + th.bow * Math.sin(Math.PI * yr);

  // dim drifting motes behind everything
  const motes = [];
  for (let i = 0; i < 24; i++) {
    motes.push({ x: Math.random(), y: Math.random(), ph: rnd(0, TAU), s: rnd(0.5, 1.4) });
  }

  let mx = -2, my = -2, px = -2, py = -2, hasPointer = false;
  window.addEventListener("pointermove", e => {
    mx = e.clientX / W; my = e.clientY / H; hasPointer = true;
  });
  window.addEventListener("pointerleave", () => { hasPointer = false; mx = -2; my = -2; });

  function pluck(th, yr, mag, sign) {
    const j = Math.max(1, Math.min(NJ - 2, Math.round(yr * (NJ - 1))));
    th.uv[j] += mag * sign;
  }

  function step(dt, t) {
    const prevPx = px, prevPy = py;
    px += (mx - px) * 0.07;
    py += (my - py) * 0.07;

    // pointer speed in relative units per second, for impulse sizing
    const dtp = Math.max(dt, 1e-3);
    const pspd = hasPointer ? Math.min(Math.hypot(px - prevPx, py - prevPy) / dtp, 1.5) : 0;

    const sdt = dt / 2;
    for (const th of threads) {
      // did the brush cross this string, or press right up against it?
      if (hasPointer && pspd > 0.02) {
        const y0 = prevPy, y1 = py;
        if (y0 >= 0 && y0 <= 1 && y1 >= 0 && y1 <= 1) {
          const rx0 = restX(th, y0), rx1 = restX(th, y1);
          if ((prevPx - rx0) * (px - rx1) < 0) {
            pluck(th, y1, 0.012 + pspd * 0.014, px > prevPx ? 1 : -1);
          } else {
            const near = 14 / W;
            const d = Math.abs(px - rx1);
            if (d < near && y1 > 0.02 && y1 < 0.98) {
              pluck(th, y1, pspd * 0.008 * (1 - d / near), px > rx1 ? 1 : -1);
            }
          }
        }
      }

      // the wave equation, two substeps for stability, pinned ends
      const u = th.u, uv = th.uv;
      for (let s = 0; s < 2; s++) {
        const tt = t + s * sdt;
        for (let i = 1; i < NJ - 1; i++) {
          const acc = C2 * (u[i - 1] + u[i + 1] - 2 * u[i])
                    - DAMP * uv[i]
                    + AMBIENT * Math.sin(t * 0.4 + th.tph + i * 0.5 + tt * 0.001);
          uv[i] += acc * sdt;
        }
        for (let i = 1; i < NJ - 1; i++) u[i] += uv[i] * sdt;
      }

      let m = 0;
      for (let i = 1; i < NJ - 1; i++) m += Math.abs(uv[i]);
      th.meanV = m / (NJ - 2);
    }

    for (const p of motes) {
      p.x += Math.sin(t * 0.11 + p.ph) * 0.004 * dt;
      p.y += Math.cos(t * 0.09 + p.ph * 1.7) * 0.003 * dt - 0.002 * dt;
      if (p.x < -0.05) p.x = 1.05; if (p.x > 1.05) p.x = -0.05;
      if (p.y < -0.05) p.y = 1.05; if (p.y > 1.05) p.y = -0.05;
    }
  }

  function frame(now, dt) {
    const t = now / 1000;
    const grow = reduced ? 1 : Math.min(t / 1.6, 1);

    step(dt, t);

    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#070b14");
    g.addColorStop(0.6, "#0a0f1d");
    g.addColorStop(1, "#0d1424");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = "lighter";

    // faint nebula, family obligation
    let gr = ctx.createRadialGradient(W * 0.22, H * 0.3, 0, W * 0.22, H * 0.3, W * 0.4);
    gr.addColorStop(0, "rgba(106,31,94,0.12)");
    gr.addColorStop(1, "rgba(106,31,94,0)");
    ctx.fillStyle = gr;
    ctx.fillRect(0, 0, W, H);

    // motes
    for (const p of motes) {
      ctx.globalAlpha = (0.05 + 0.04 * Math.sin(t * 0.8 + p.ph)) * grow;
      const r = 3 * p.s;
      ctx.drawImage(glowTeal, p.x * W - r, p.y * H - r, r * 2, r * 2);
    }
    ctx.globalAlpha = 1;

    // the threads: quiet pass, then a bright pass where they shake
    ctx.lineCap = "round";
    for (const th of threads) {
      const u = th.u;
      ctx.strokeStyle = `rgba(178,214,214,${0.2 * grow})`;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (let i = 0; i < NJ; i++) {
        const yr = i / (NJ - 1);
        const x = (restX(th, yr) + u[i]) * W;
        const y = (-0.04 + 1.08 * yr) * H;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();

      const boost = Math.min(th.meanV * 35, 0.5);
      if (boost > 0.01) {
        ctx.strokeStyle = `rgba(200,255,248,${boost * grow})`;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        for (let i = 0; i < NJ; i++) {
          const yr = i / (NJ - 1);
          const x = (restX(th, yr) + u[i]) * W;
          const y = (-0.04 + 1.08 * yr) * H;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }

    // beads on every third joint, waking with the vibration
    for (const th of threads) {
      const uv = th.uv;
      for (let i = 3; i < NJ - 1; i += 3) {
        const yr = i / (NJ - 1);
        const v = Math.abs(uv[i]);
        const al = Math.min(0.15 + v * 40, 0.9) * grow;
        if (al < 0.02) continue;
        const r = 3.5 + Math.min(v * 400, 4);
        ctx.globalAlpha = al;
        ctx.drawImage(th.pink ? glowPink : glowTeal,
          (restX(th, yr) + th.u[i]) * W - r, (-0.04 + 1.08 * yr) * H - r, r * 2, r * 2);
      }
    }
    ctx.globalAlpha = 1;

    // a faint lantern on the hand
    if (hasPointer) {
      ctx.globalAlpha = 0.3;
      ctx.drawImage(glowTeal, px * W - 40, py * H - 40, 80, 80);
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = "rgba(238,242,251,0.8)";
      ctx.beginPath();
      ctx.arc(px * W, py * H, 1.6, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.globalCompositeOperation = "source-over";

    const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.36, W / 2, H / 2, Math.max(W, H) * 0.75);
    v.addColorStop(0, "rgba(3,6,12,0)");
    v.addColorStop(1, "rgba(3,6,12,0.55)");
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  }

  let holdT = 0;
  resize();
  window.addEventListener("resize", () => {
    resize();
    if (reduced) frame(holdT, 0.016);
  });

  if (reduced) {
    // let the ambient sway establish itself, then hold one still frame
    for (let k = 0; k < 300; k++) frame(k * 16, 0.016);
    holdT = 299 * 16;
  } else {
    let last = performance.now();
    requestAnimationFrame(function loop(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      frame(now, dt);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
