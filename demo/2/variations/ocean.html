<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVX Splash — Open Water</title>
<style>
  :root {
    --void: #060a13; --ink: #eef2fb; --muted: #aab6cf;
    --line: rgba(238, 242, 251, 0.14); --teal: #17e8d8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--void); color: var(--ink);
    font-family: "Segoe UI", "Avenir Next", system-ui, sans-serif;
    height: 100vh; overflow: hidden;
  }
  #bg { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .stage {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    justify-content: space-between; padding: clamp(20px, 4vw, 44px);
    opacity: 0; animation: settle 1s ease-out 0.3s forwards;
  }
  @keyframes settle { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .stage { animation: none; opacity: 1; } }
  .bar { display: flex; align-items: center; justify-content: space-between; }
  .wordmark {
    display: flex; align-items: center; gap: 12px;
    font-family: "Bahnschrift", "Segoe UI", sans-serif;
    font-weight: 700; font-size: 16px; letter-spacing: 0.14em;
  }
  .wordmark .pip {
    width: 13px; height: 13px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff5ec7, #7a2170 75%);
    box-shadow: 0 0 12px rgba(255, 94, 199, 0.7);
  }
  .variant {
    color: var(--muted); font-size: 13.5px;
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px;
  }
  .hero { text-align: center; max-width: 680px; margin: 0 auto; padding-bottom: 5vh; }
  .hero h1 {
    font-family: "Bahnschrift", "Segoe UI", sans-serif;
    font-size: clamp(2.2rem, 5.5vw, 3.8rem); font-weight: 700; line-height: 1.05;
    text-shadow: 0 2px 28px rgba(3, 6, 12, 0.85);
  }
  .hero p {
    margin: 14px auto 26px; max-width: 44ch; color: var(--muted);
    font-size: clamp(0.95rem, 1.5vw, 1.1rem); line-height: 1.6;
    text-shadow: 0 1px 18px rgba(3, 6, 12, 0.9);
  }
  .btn {
    font: inherit; font-size: 14.5px; padding: 11px 24px; border-radius: 10px;
    cursor: pointer; text-decoration: none; transition: transform 0.2s, background 0.2s;
  }
  .btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
  .btn-solid { background: var(--ink); color: #0a0f1c; border: 1px solid var(--ink); }
  .btn-solid:hover { background: #fff; transform: translateY(-1px); }
  .foot { color: var(--muted); font-size: 13px; text-align: center; }

  /* mobile & touch */
  html, body { overscroll-behavior: none; }
  body { height: 100dvh; -webkit-tap-highlight-color: transparent; }
  #bg { touch-action: none; }
  .stage { -webkit-user-select: none; user-select: none; }
  .bar { flex-wrap: wrap; row-gap: 10px; }
  @media (max-width: 640px) {
    .wordmark { font-size: 14px; }
    .variant { font-size: 11px; padding: 4px 10px; }
    .hero h1 { font-size: clamp(1.9rem, 8.5vw, 2.5rem); }
    .hero p { font-size: 0.92rem; }
    .btn { padding: 13px 28px; font-size: 15px; }
    .foot { font-size: 11.5px; }
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="stage">
  <header class="bar">
    <div class="wordmark"><span class="pip"></span>CVX SPLASH</div>
    <span class="variant">Variation — Open Water</span>
  </header>
  <main class="hero">
    <h1>Open Water</h1>
    <p>A night sea under a low moon. Thirteen swells roll in from the horizon — hazy and compressed in the distance, tall and slow up close.</p>
    <a class="btn btn-solid" href="#">Get started</a>
  </main>
  <footer class="foot">Move the pointer — the sea leans with you</footer>
</div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("bg");
  const ctx = canvas.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TAU = Math.PI * 2;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const hash = (i, s) => ((Math.sin(i * 12.9898 + s * 78.233) * 43758.5453) % 1 + 1) % 1;

  let W = 0, H = 0;
  let mx = 0.5, my = 0.45, px = -2, py = -2;
  window.addEventListener("pointermove", e => { mx = e.clientX / W; my = e.clientY / H; });
  window.addEventListener("pointerleave", () => { mx = -2; my = -2; });

  // swell rows, far (v≈0.05, at the horizon) to near (v≈0.97, at the viewer's rail)
  const NROWS = 13;
  const rows = [];
  for (let i = 0; i < NROWS; i++) {
    const v = 0.05 + (i / (NROWS - 1)) * 0.92;
    const row = { v, ph: rnd(0, TAU), ph2: rnd(0, TAU), dir: i % 2 ? 1 : -1, foam: [], glint: [] };
    const nfoam = Math.floor(2 + v * 9);
    for (let k = 0; k < nfoam; k++)
      row.foam.push({ u: Math.random(), ph3: rnd(0, TAU), sp: rnd(0.6, 2.4) });
    const nglint = Math.floor(3 + v * 7);
    for (let k = 0; k < nglint; k++)
      row.glint.push({ u: Math.random(), ph3: rnd(0, TAU), sp: rnd(0.8, 3.0) });
    rows.push(row);
  }

  // irregular crest: two sines of different frequency
  function crestY(row, x, wl, amp, drift) {
    const u = x / wl;
    return Math.sin(u * TAU + drift) * amp
         + Math.sin(u * TAU * 2.17 + drift * 1.618 + row.ph2) * amp * 0.35;
  }

  function draw(t) {
    px += (mx - px) * 0.045;
    py += (my - py) * 0.045;

    // the ship itself: a slow sway and a rising / falling horizon
    const horizon = H * (0.36 + 0.013 * Math.sin(t * 0.21));
    const sway = Math.sin(t * 0.13) * 6;

    // sky
    let g = ctx.createLinearGradient(0, -30, 0, horizon);
    g.addColorStop(0, "#04070f");
    g.addColorStop(1, "#0b1526");
    ctx.fillStyle = g;
    ctx.fillRect(-40, -40, W + 80, horizon + 41);

    // sea base
    g = ctx.createLinearGradient(0, horizon, 0, H + 40);
    g.addColorStop(0, "#0a1526");
    g.addColorStop(0.35, "#071020");
    g.addColorStop(1, "#040810");
    ctx.fillStyle = g;
    ctx.fillRect(-40, horizon, W + 80, H - horizon + 80);

    ctx.save();
    ctx.translate(sway, 0);

    // stars, fading toward the horizon haze
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = "#dfe8ff";
    for (let i = 0; i < 110; i++) {
      const sx = hash(i, 1) * W;
      const sy = hash(i, 2) * horizon * 0.92;
      const tw = 0.55 + 0.45 * Math.sin(t * (0.25 + (i % 6) * 0.11) + i * 1.7);
      ctx.globalAlpha = 0.55 * tw * (1 - sy / horizon);
      ctx.beginPath();
      ctx.arc(sx, sy, 0.6 + (i % 4) * 0.32, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // the moon — the family's pink planet, hanging low over the water
    const mX = W * (0.70 + Math.sin(t * 0.02) * 0.012) + (px > -1 ? (px - 0.5) * -8 : 0);
    const mY = horizon * 0.42 + Math.cos(t * 0.026) * 6;
    const mR = Math.min(W, H) * 0.055;
    let mg = ctx.createRadialGradient(mX, mY, mR * 0.2, mX, mY, mR * 5);
    mg.addColorStop(0, "rgba(255,94,199,0.18)");
    mg.addColorStop(1, "rgba(255,94,199,0)");
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(mX, mY, mR * 5, 0, TAU); ctx.fill();

    ctx.globalCompositeOperation = "source-over";
    mg = ctx.createRadialGradient(mX - mR * 0.25, mY - mR * 0.25, mR * 0.1, mX, mY, mR);
    mg.addColorStop(0, "#ffd6ec");
    mg.addColorStop(0.55, "#ff9ed2");
    mg.addColorStop(1, "#7a2170");
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(mX, mY, mR, 0, TAU); ctx.fill();

    ctx.globalCompositeOperation = "lighter";

    // horizon haze band — the atmosphere that compresses the far field
    let hz = ctx.createLinearGradient(0, horizon - 60, 0, horizon + 70);
    hz.addColorStop(0, "rgba(120,150,200,0)");
    hz.addColorStop(0.5, "rgba(120,150,200,0.10)");
    hz.addColorStop(1, "rgba(120,150,200,0)");
    ctx.fillStyle = hz;
    ctx.fillRect(-40, horizon - 60, W + 80, 130);

    // moonlight track down the water
    const bw = W * 0.16;
    const beam = ctx.createLinearGradient(mX - bw, 0, mX + bw, 0);
    beam.addColorStop(0, "rgba(255,160,210,0)");
    beam.addColorStop(0.5, "rgba(255,160,210,0.14)");
    beam.addColorStop(1, "rgba(255,160,210,0)");
    ctx.fillStyle = beam;
    ctx.fillRect(mX - bw, horizon, bw * 2, H - horizon);

    // swells, painted far to near so each fill occludes the ones behind it
    for (const row of rows) {
      const v = row.v;
      const y0 = horizon + (H - horizon) * Math.pow(v, 1.9);
      const wl = W * (0.08 + 0.75 * Math.pow(v, 1.4));
      const amp = H * (0.002 + 0.055 * Math.pow(v, 2.4))
                * (1 + 0.3 * Math.sin(t * TAU * 0.05 + row.ph2));
      const drift = row.ph + t * row.dir * (0.05 + 0.10 * v);
      // depth parallax: near swells answer the pointer more
      const shift = px > -1 ? (px - 0.5) * -30 * v : 0;

      ctx.save();
      ctx.translate(shift, 0);

      const pts = [];
      for (let x = -60; x <= W + 60; x += 7) pts.push([x, y0 + crestY(row, x, wl, amp, drift)]);

      // body of water between this crest and the viewer
      ctx.globalCompositeOperation = "source-over";
      ctx.beginPath();
      pts.forEach((p, k) => (k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
      ctx.lineTo(W + 60, H + 60);
      ctx.lineTo(-60, H + 60);
      ctx.closePath();
      ctx.fillStyle = `rgba(6,11,22,${0.28 + 0.45 * v})`;
      ctx.fill();

      // crest line — hazy blue-grey in the distance, crisp moonlit teal up close
      ctx.globalCompositeOperation = "lighter";
      ctx.beginPath();
      pts.forEach((p, k) => (k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
      const ca = 0.10 + 0.55 * Math.pow(v, 1.6);
      ctx.strokeStyle = v > 0.6 ? `rgba(140,235,225,${ca})` : `rgba(90,140,180,${ca})`;
      ctx.lineWidth = 0.8 + 1.6 * v;
      ctx.stroke();

      const yAt = x => pts[Math.max(0, Math.min(pts.length - 1, Math.round((x + 60) / 7)))][1];

      // foam specks riding the near crests
      if (v > 0.5) {
        for (const f of row.foam) {
          const fx = f.u * (W + 120) - 60;
          const tw = 0.5 + 0.5 * Math.sin(t * f.sp + f.ph3);
          ctx.fillStyle = `rgba(220,245,240,${(0.25 + 0.5 * v) * tw})`;
          ctx.beginPath();
          ctx.arc(fx, yAt(fx), 1 + v * 1.6, 0, TAU);
          ctx.fill();
        }
      }

      // glints scattered down the moon's track
      const gw = W * (0.05 + 0.2 * v);
      for (const f of row.glint) {
        const gx = mX + (f.u - 0.5) * gw * 2;
        if (gx < -20 || gx > W + 20) continue;
        const fall = 1 - Math.abs(gx - mX) / gw;
        if (fall <= 0) continue;
        const tw = 0.5 + 0.5 * Math.sin(t * f.sp + f.ph3);
        const len = 4 + v * 14;
        ctx.fillStyle = `rgba(255,190,220,${fall * (0.4 + 0.55 * v) * tw})`;
        ctx.fillRect(gx - len / 2, yAt(gx), len, 1.4);
      }

      ctx.restore();
    }

    ctx.restore();
    ctx.globalCompositeOperation = "source-over";

    // vignette
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.4, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, "rgba(2,4,8,0)");
    vg.addColorStop(1, "rgba(2,4,8,0.5)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (reduced) draw(4000);
  }
  window.addEventListener("resize", resize);
  resize();

  if (reduced) draw(4000);
  else requestAnimationFrame(function loop(now) { draw(now / 1000); requestAnimationFrame(loop); });
})();
</script>
</body>
</html>
