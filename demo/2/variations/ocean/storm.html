<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVX Splash — Storm Sea</title>
<style>
  :root {
    --void: #060a13; --ink: #eef2fb; --muted: #aab6cf;
    --line: rgba(238, 242, 251, 0.14); --teal: #17e8d8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--void); color: var(--ink);
    font-family: "Segoe UI", "Avenir Next", system-ui, sans-serif;
    height: 100vh; overflow: hidden;
  }
  #bg { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .stage {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    justify-content: space-between; padding: clamp(20px, 4vw, 44px);
    opacity: 0; animation: settle 1s ease-out 0.3s forwards;
  }
  @keyframes settle { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .stage { animation: none; opacity: 1; } }
  .bar { display: flex; align-items: center; justify-content: space-between; }
  .wordmark {
    display: flex; align-items: center; gap: 12px;
    font-family: "Bahnschrift", "Segoe UI", sans-serif;
    font-weight: 700; font-size: 16px; letter-spacing: 0.14em;
  }
  .wordmark .pip {
    width: 13px; height: 13px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ff5ec7, #7a2170 75%);
    box-shadow: 0 0 12px rgba(255, 94, 199, 0.7);
  }
  .variant {
    color: var(--muted); font-size: 13.5px;
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px;
  }
  .hero { text-align: center; max-width: 680px; margin: 0 auto; padding-bottom: 5vh; }
  .hero h1 {
    font-family: "Bahnschrift", "Segoe UI", sans-serif;
    font-size: clamp(2.2rem, 5.5vw, 3.8rem); font-weight: 700; line-height: 1.05;
    text-shadow: 0 2px 28px rgba(3, 6, 12, 0.85);
  }
  .hero p {
    margin: 14px auto 26px; max-width: 44ch; color: var(--muted);
    font-size: clamp(0.95rem, 1.5vw, 1.1rem); line-height: 1.6;
    text-shadow: 0 1px 18px rgba(3, 6, 12, 0.9);
  }
  .btn {
    font: inherit; font-size: 14.5px; padding: 11px 24px; border-radius: 10px;
    cursor: pointer; text-decoration: none; transition: transform 0.2s, background 0.2s;
  }
  .btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
  .btn-solid { background: var(--ink); color: #0a0f1c; border: 1px solid var(--ink); }
  .btn-solid:hover { background: #fff; transform: translateY(-1px); }
  .foot { color: var(--muted); font-size: 13px; text-align: center; }

  /* mobile & touch */
  html, body { overscroll-behavior: none; }
  body { height: 100dvh; -webkit-tap-highlight-color: transparent; }
  #bg { touch-action: none; }
  .stage { -webkit-user-select: none; user-select: none; }
  .bar { flex-wrap: wrap; row-gap: 10px; }
  @media (max-width: 640px) {
    .wordmark { font-size: 14px; }
    .variant { font-size: 11px; padding: 4px 10px; }
    .hero h1 { font-size: clamp(1.9rem, 8.5vw, 2.5rem); }
    .hero p { font-size: 0.92rem; }
    .btn { padding: 13px 28px; font-size: 15px; }
    .foot { font-size: 11.5px; }
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="stage">
  <header class="bar">
    <div class="wordmark"><span class="pip"></span>CVX SPLASH</div>
    <span class="variant">Variation — Storm Sea</span>
  </header>
  <main class="hero">
    <h1>Storm Sea</h1>
    <p>Heavy multidirectional chop crossing a long swell — steep short waves everywhere, spindrift torn off the crest tops, and lightning that lights the whole surface for a heartbeat.</p>
    <a class="btn btn-solid" href="#">Get started</a>
  </main>
  <footer class="foot">Even the storm leans with you</footer>
</div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("bg");
  const ctx = canvas.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TAU = Math.PI * 2;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const hash = (i, s) => ((Math.sin(i * 12.9898 + s * 78.233) * 43758.5453) % 1 + 1) % 1;

  let W = 0, H = 0;
  let mx = 0.5, my = 0.45, px = -2, py = -2;
  window.addEventListener("pointermove", e => { mx = e.clientX / W; my = e.clientY / H; });
  window.addEventListener("pointerleave", () => { mx = -2; my = -2; });

  // deep-water dispersion w = sqrt(g k); g gives the 0.30W swell a ~5 s period
  let G = 120;

  // long swell + three short chops at higher k, phases set against each other,
  // total steepness pushed to ~0.92 so the surface is always near folding
  const NROWS = 20;
  const rows = [];
  function buildRows() {
    rows.length = 0;
    for (let i = 0; i < NROWS; i++) {
      const v = 0.04 + (i / (NROWS - 1)) * 0.94;
      const lam = W * (0.10 + 0.75 * Math.pow(v, 1.4));
      const amp = H * (0.004 + 0.058 * Math.pow(v, 2.4));
      const mk = (l, a, dir, ph) => ({ k: TAU / l, w: Math.sqrt(G * TAU / l), a, dir, ph });
      const c = [
        mk(lam, amp, 1, rnd(0, TAU)),
        mk(lam * 0.34, amp * 0.30, -1, rnd(0, TAU)),
        mk(lam * 0.24, amp * 0.24, 1, rnd(0, TAU) + Math.PI / 3),
        mk(lam * 0.18, amp * 0.18, -1, rnd(0, TAU) + Math.PI / 2)
      ];
      const sumQ = c.reduce((s, o) => s + o.a * o.k, 0);
      rows.push({ v, c, Q: Math.min(1, 0.85 / sumQ), breathe: rnd(0, TAU) });
    }
  }

  // Gerstner-displaced profile, analytic slope dh/dx = sum A k cos
  function prof(row, x, t) {
    const br = 1 + 0.10 * Math.sin(t * TAU * 0.06 + row.breathe);
    let y = 0, xd = 0, sl = 0;
    for (const c of row.c) {
      const a = c.a * br;
      const th = c.k * x - c.dir * c.w * t + c.ph;
      y += a * Math.sin(th);
      xd += a * row.Q * Math.cos(th);
      sl += a * c.k * Math.cos(th);
    }
    return [x - xd, y, sl];
  }

  const spray = [];   // drops knocked off crests
  const drift = [];   // spindrift streaks blowing downwind
  const rain = [];    // distant rain veil
  function buildRain() {
    rain.length = 0;
    for (let i = 0; i < 170; i++)
      rain.push({ x: Math.random() * W, u: Math.random(), len: rnd(5, 14), sp: rnd(30, 80) });
  }

  // lightning: fl(t) = sum of 2-3 sharp exp-decay spikes over ~0.4 s
  const bolt = { next: rnd(3, 7), spikes: [], x: 0, flashEnd: -9 };
  function flashEnv(t) {
    if (t >= bolt.next) {
      bolt.x = rnd(0.15, 0.85) * W;
      bolt.spikes = [];
      let off = 0;
      const n = 2 + (Math.random() < 0.5 ? 1 : 0);
      for (let i = 0; i < n; i++) {
        bolt.spikes.push({ t0: t + off, amp: i ? rnd(0.4, 0.8) : 1, tau: rnd(0.05, 0.09) });
        off += rnd(0.10, 0.16);
      }
      bolt.flashEnd = t + off + 0.1;
      bolt.next = t + rnd(6, 14);
    }
    let fl = 0;
    for (const s of bolt.spikes)
      if (t >= s.t0) fl += s.amp * Math.exp(-(t - s.t0) / s.tau);
    // after the flash, a brief darker dip (~0.85x) while the eye recovers
    let dip = 0;
    if (t > bolt.flashEnd && t < bolt.flashEnd + 0.5)
      dip = Math.sin(Math.PI * (t - bolt.flashEnd) / 0.5) * 0.15;
    return [fl, dip];
  }

  function step(dt, t) {
    for (let i = spray.length - 1; i >= 0; i--) {
      const p = spray[i];
      p.age += dt;
      if (p.age > p.life) { spray.splice(i, 1); continue; }
      p.vy += 380 * p.g * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    for (let i = drift.length - 1; i >= 0; i--) {
      const p = drift[i];
      p.age += dt;
      if (p.age > p.life) { drift.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 30 * dt;
    }
    for (const r of rain) {
      r.x -= r.sp * dt;
      if (r.x < -20) r.x = W + 20;
    }
  }

  function draw(t) {
    px += (mx - px) * 0.06;
    py += (my - py) * 0.06;
    const [fl, dip] = flashEnv(t);

    const horizon = H * (0.36 + 0.013 * Math.sin(t * 0.21));
    const sway = Math.sin(t * 0.13) * 6;

    let g = ctx.createLinearGradient(0, -30, 0, horizon);
    g.addColorStop(0, "#05070d");
    g.addColorStop(1, "#0a1220");
    ctx.fillStyle = g;
    ctx.fillRect(-40, -40, W + 80, horizon + 41);

    g = ctx.createLinearGradient(0, horizon, 0, H + 40);
    g.addColorStop(0, "#081120");
    g.addColorStop(0.35, "#050c18");
    g.addColorStop(1, "#030710");
    ctx.fillStyle = g;
    ctx.fillRect(-40, horizon, W + 80, H - horizon + 80);

    // the strike itself: a white-blue sheet from a random x at the horizon top
    if (fl > 0.01) {
      ctx.globalCompositeOperation = "lighter";
      const fg = ctx.createRadialGradient(bolt.x, horizon * 0.25, 0, bolt.x, horizon * 0.25, Math.max(W, H) * 1.1);
      fg.addColorStop(0, `rgba(190,212,255,${0.55 * Math.min(1, fl)})`);
      fg.addColorStop(1, "rgba(190,212,255,0)");
      ctx.fillStyle = fg;
      ctx.fillRect(-40, -40, W + 80, H + 80);
    }

    ctx.save();
    ctx.translate(sway, 0);

    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = "#dfe8ff";
    const starDim = 1 / (1 + 4 * fl);
    for (let i = 0; i < 110; i++) {
      const sx = hash(i, 1) * W;
      const sy = hash(i, 2) * horizon * 0.92;
      const tw = 0.55 + 0.45 * Math.sin(t * (0.25 + (i % 6) * 0.11) + i * 1.7);
      ctx.globalAlpha = 0.55 * tw * (1 - sy / horizon) * starDim;
      ctx.beginPath();
      ctx.arc(sx, sy, 0.6 + (i % 4) * 0.32, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    const mX = W * (0.70 + Math.sin(t * 0.02) * 0.012) + (px > -1 ? (px - 0.5) * -8 : 0);
    const mY = horizon * 0.42 + Math.cos(t * 0.026) * 6;
    const mR = Math.min(W, H) * 0.055;
    if (fl < 0.04) { // the moon hides when the sky fires
      let mg = ctx.createRadialGradient(mX, mY, mR * 0.2, mX, mY, mR * 5);
      mg.addColorStop(0, "rgba(255,94,199,0.14)");
      mg.addColorStop(1, "rgba(255,94,199,0)");
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(mX, mY, mR * 5, 0, TAU); ctx.fill();

      ctx.globalCompositeOperation = "source-over";
      mg = ctx.createRadialGradient(mX - mR * 0.25, mY - mR * 0.25, mR * 0.1, mX, mY, mR);
      mg.addColorStop(0, "#ffd6ec");
      mg.addColorStop(0.55, "#ff9ed2");
      mg.addColorStop(1, "#7a2170");
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(mX, mY, mR, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = "lighter";
    }

    let hz = ctx.createLinearGradient(0, horizon - 70, 0, horizon + 80);
    hz.addColorStop(0, "rgba(110,140,190,0)");
    hz.addColorStop(0.5, "rgba(110,140,190,0.13)");
    hz.addColorStop(1, "rgba(110,140,190,0)");
    ctx.fillStyle = hz;
    ctx.fillRect(-40, horizon - 70, W + 80, 150);

    // distant rain veil, all in one stroke
    ctx.strokeStyle = "rgba(150,175,215,0.09)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    const farBand = (H - horizon) * 0.34;
    for (const r of rain) {
      const ry = horizon - 10 + r.u * farBand;
      ctx.moveTo(r.x, ry);
      ctx.lineTo(r.x + 2.5, ry + r.len);
    }
    ctx.stroke();

    const bw = W * 0.16;
    const beam = ctx.createLinearGradient(mX - bw, 0, mX + bw, 0);
    beam.addColorStop(0, "rgba(255,160,210,0)");
    beam.addColorStop(0.5, "rgba(255,160,210,0.10)");
    beam.addColorStop(1, "rgba(255,160,210,0)");
    ctx.fillStyle = beam;
    ctx.fillRect(mX - bw, horizon, bw * 2, H - horizon);
    ctx.globalCompositeOperation = "source-over";

    const litC = 1 + 2.2 * fl; // every crest answers the flash

    for (const row of rows) {
      const v = row.v;
      const y0 = horizon + (H - horizon) * Math.pow(v, 1.9);
      const shift = px > -1 ? (px - 0.5) * -30 * v : 0;
      ctx.save();
      ctx.translate(shift, 0);

      const pts = [];
      for (let x = -80; x <= W + 80; x += 6) {
        const p = prof(row, x, t);
        pts.push([p[0], y0 + p[1], p[2]]);
      }

      ctx.globalCompositeOperation = "source-over";
      ctx.beginPath();
      pts.forEach((p, k) => (k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
      ctx.lineTo(W + 80, H + 60);
      ctx.lineTo(-80, H + 60);
      ctx.closePath();
      ctx.fillStyle = `rgba(6,11,22,${0.30 + 0.42 * v})`;
      ctx.fill();
      if (fl > 0.01) { // bodies lift a touch under the flash
        ctx.fillStyle = `rgba(140,170,235,${0.05 * Math.min(1, fl)})`;
        ctx.fill();
      }

      ctx.globalCompositeOperation = "lighter";
      ctx.beginPath();
      pts.forEach((p, k) => (k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
      const ca = Math.min(1, (0.10 + 0.55 * Math.pow(v, 1.6)) * litC);
      ctx.strokeStyle = v > 0.6 ? `rgba(140,235,225,${ca})` : `rgba(90,140,180,${ca})`;
      ctx.lineWidth = 0.8 + 1.6 * v;
      ctx.stroke();

      // slope specular, wide near, moon plus lightning both feed it
      const sg = W * (0.04 + 0.13 * v);
      const inv2 = 1 / (2 * sg * sg);
      const bright = new Path2D(), dim = new Path2D();
      let foamP = null;
      if (v > 0.3) foamP = new Path2D();
      for (let k = 0; k < pts.length - 1; k++) {
        const a = pts[k], b = pts[k + 1];
        const gauss = Math.exp(-((a[0] - mX) * (a[0] - mX)) * inv2);
        const spec = Math.pow(Math.max(0, -a[2] * 1.25 + 0.22), 2) * (gauss * 0.9 + 0.1 * fl) * (0.4 + 0.8 * v);
        if (gauss > 0.38 && spec > 0.14) {
          const p2 = spec > 0.42 ? bright : dim;
          p2.moveTo(a[0], a[1]); p2.lineTo(b[0], b[1]);
        }
        // storm whitecap: threshold dropped to 0.5, mid rows break constantly
        if (foamP) {
          const s = Math.abs(a[2]);
          if (s > 0.5) {
            const tb = Math.floor(t * 2.5);
            const n = 3 + Math.floor(hash(k, tb) * 5);
            for (let j = 0; j < n; j++) {
              const u = (hash(k * 7 + j, tb) - 0.5) * 30;
              const dx = b[0] - a[0], dy = b[1] - a[1];
              const L = Math.hypot(dx, dy) || 1;
              const len = 4 + hash(j, k) * 8;
              foamP.moveTo(a[0] + u * dx / L, a[1] + u * dy / L - 1);
              foamP.lineTo(a[0] + (u + len) * dx / L, a[1] + (u + len) * dy / L - 1);
            }
            if (Math.random() < 0.08 && spray.length < 200)
              spray.push({ x: a[0], y: a[1], vx: rnd(-60, 60), vy: rnd(-160, -50), g: v, age: 0, life: rnd(0.3, 0.6) });
            // spindrift: streaks torn off the near crest tops, 2-3x wave speed
            if (v > 0.55 && Math.random() < 0.06 && drift.length < 110)
              drift.push({ x: a[0], y: a[1] - 2, vx: -(140 + 240 * v), vy: rnd(-26, 4), age: 0, life: rnd(0.4, 0.7) });
          }
        }
      }
      ctx.lineWidth = 0.9 + 2.1 * v;
      ctx.strokeStyle = `rgba(255,195,222,${0.8 * litC > 1 ? 1 : 0.8 * litC})`;
      ctx.stroke(bright);
      ctx.strokeStyle = `rgba(255,195,222,${Math.min(1, 0.34 * litC)})`;
      ctx.stroke(dim);
      if (foamP) {
        ctx.lineWidth = 1 + 1.8 * v;
        ctx.strokeStyle = `rgba(228,250,246,${Math.min(1, (0.3 + 0.55 * v) * litC)})`;
        ctx.stroke(foamP);
      }

      ctx.restore();
    }

    for (const p of spray) {
      const a = (1 - p.age / p.life) * 0.7;
      ctx.fillStyle = `rgba(214,244,240,${a})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 0.8 + p.g * 1.4, 0, TAU);
      ctx.fill();
    }
    // spindrift streaks: thin, fast, half-transparent
    ctx.lineWidth = 1;
    for (const p of drift) {
      const a = (1 - p.age / p.life) * 0.18;
      ctx.strokeStyle = `rgba(210,238,238,${a})`;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + p.vx * 0.06, p.y + p.vy * 0.02);
      ctx.stroke();
    }

    ctx.restore();
    ctx.globalCompositeOperation = "source-over";

    if (dip > 0) {
      ctx.fillStyle = `rgba(0,2,6,${dip})`;
      ctx.fillRect(0, 0, W, H);
    }

    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.4, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, "rgba(2,4,8,0)");
    vg.addColorStop(1, "rgba(2,4,8,0.5)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  let t = 0;
  function settle() { for (let i = 0; i < 100; i++) { t += 1 / 60; step(1 / 60, t); } draw(t); }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    G = 2 * Math.PI * (W * 0.3) / 25;
    buildRows();
    buildRain();
    if (reduced) settle();
  }
  window.addEventListener("resize", resize);
  resize();

  if (reduced) settle();
  else {
    let last = performance.now();
    requestAnimationFrame(function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      t += dt;
      step(dt, t);
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
