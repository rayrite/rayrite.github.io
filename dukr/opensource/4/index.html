<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOSS Category Explorer — 2026-10-14</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0d13; --surface:#151823; --surface-card:#1a1e2d; --surface-hover:#111420;
  --border:rgba(255,255,255,.08); --border-focus:rgba(124,106,247,.6);
  --accent:#7c6af7; --accent2:#a78bfa; --accent-light:rgba(124,106,247,.12);
  --text:#e4e6ef; --muted:#8b8fa8; --danger:#f87171; --success:#4ade80; --warn:#fbbf24;
  --cat-badge-bg:rgba(167,139,250,.12); --cat-badge-color:#c4b5fd; --cat-badge-border:rgba(167,139,250,.25);
  --shadow:0 4px 20px rgba(0,0,0,.4);
}
body.light{
  --bg:#f1f4f9; --surface:#ffffff; --surface-card:#ffffff; --surface-hover:#f8fafd;
  --border:rgba(0,0,0,.08); --border-focus:rgba(96,69,245,.5);
  --text:#111827; --muted:#64748b; --accent:#6045f5; --accent2:#7c6af7; --accent-light:rgba(96,69,245,.08);
  --cat-badge-bg:rgba(96,69,245,.08); --cat-badge-color:#4f46e5; --cat-badge-border:rgba(79,70,229,.22);
  --shadow:0 4px 16px rgba(15,23,42,.08);
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:13px; line-height:1.45;
  display:flex; flex-direction:column; overflow:hidden;
}
#hdr{background:var(--surface); border-bottom:1px solid var(--border); padding:8px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
#hdr h1{font-size:15px; font-weight:700; letter-spacing:.2px; margin-right:4px; white-space:nowrap}
#hdr h1 .sub{font-weight:400; color:var(--muted); font-size:11px; display:block}
.search-wrap{position:relative; flex:1 1 260px; max-width:520px; display:flex; gap:6px}
#search-input{flex:1; background:var(--surface-card); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px 30px 7px 10px; font-size:13px; outline:none}
#search-input:focus{border-color:var(--border-focus)}
#search-clear-btn{position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; display:none}
.btn{background:var(--surface-card); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:6px 10px; cursor:pointer; font-size:12px; white-space:nowrap; user-select:none}
.btn:hover{border-color:var(--border-focus); background:var(--surface-hover)}
.btn.on{background:var(--accent-light); border-color:var(--border-focus); color:var(--accent2)}
.btn.icon{padding:6px 8px}
.seg{display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden}
.seg .btn{border:none; border-radius:0}
#fbar{background:var(--surface); border-bottom:1px solid var(--border); padding:6px 14px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
select{background:var(--surface-card); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:5px 8px; font-size:12px; outline:none; max-width:230px}
select:focus{border-color:var(--border-focus)}
.fbar-label{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px}
#kw-bar-wrap{position:relative}
#kw-dd-panel{position:absolute; top:calc(100% + 6px); left:0; z-index:60; background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); width:340px; max-height:380px; display:none; flex-direction:column}
#kw-dd-panel.open{display:flex}
#kw-dd-panel .panel-head{display:flex; gap:8px; padding:8px; border-bottom:1px solid var(--border); align-items:center}
#kw-dd-panel input{flex:1; background:var(--surface-card); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:5px 8px; font-size:12px}
#kw-dd-list{overflow:auto; padding:6px; display:flex; flex-wrap:wrap; gap:5px}
.kw-pill{background:var(--surface-card); border:1px solid var(--border); color:var(--text); border-radius:14px; padding:3px 9px; font-size:11px; cursor:pointer; user-select:none}
.kw-pill:hover{border-color:var(--border-focus)}
.kw-pill.on{background:var(--accent-light); border-color:var(--accent); color:var(--accent2)}
#month-bar{display:flex; gap:4px; padding:5px 14px; background:var(--surface); border-bottom:1px solid var(--border); align-items:center; flex-wrap:wrap}
.mbtn{background:var(--surface-card); border:1px solid var(--border); color:var(--muted); border-radius:6px; padding:2px 8px; font-size:11px; cursor:pointer}
.mbtn.on{background:var(--accent-light); border-color:var(--accent); color:var(--accent2)}
#chips{display:flex; gap:5px; flex-wrap:wrap; padding:6px 14px; background:var(--surface); border-bottom:1px solid var(--border); min-height:4px}
.chip{background:var(--accent-light); border:1px solid var(--cat-badge-border); color:var(--cat-badge-color); border-radius:12px; padding:2px 8px; font-size:11px; display:inline-flex; gap:5px; align-items:center}
.chip b{font-weight:600}
.chip .x{cursor:pointer; opacity:.7; font-weight:700}
.chip .x:hover{opacity:1}
#stat-bar{display:flex; gap:14px; padding:5px 14px; background:var(--surface); border-bottom:1px solid var(--border); color:var(--muted); font-size:11px; flex-wrap:wrap}
#stat-bar b{color:var(--text)}
#content{flex:1; overflow:auto; position:relative}
#cards-wrap{padding:12px 14px; display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:10px}
.card{background:var(--surface-card); border:1px solid var(--border); border-radius:12px; padding:11px 12px; display:flex; flex-direction:column; gap:6px; cursor:pointer; transition:border-color .15s}
.card:hover{border-color:var(--border-focus)}
.card .cname{font-weight:700; font-size:13px; color:var(--accent2); text-decoration:none; word-break:break-all}
.card .cowner{color:var(--muted); font-size:11px}
.card .cdesc{font-size:12px; color:var(--text); opacity:.92; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.card .cmeta{display:flex; gap:8px; align-items:center; font-size:11px; color:var(--muted); flex-wrap:wrap}
.lang-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.tagpill{border-radius:10px; padding:1px 7px; font-size:10.5px; border:1px solid}
.ts-mhtml{background:rgba(167,139,250,.12); color:#c4b5fd; border-color:rgba(167,139,250,.3)}
.ts-i2-gh{background:rgba(96,165,250,.12); color:#93c5fd; border-color:rgba(96,165,250,.3)}
.ts-gh-topics{background:rgba(74,222,128,.10); color:#86efac; border-color:rgba(74,222,128,.3)}
.ts-keywords{background:rgba(251,191,36,.10); color:#fcd34d; border-color:rgba(251,191,36,.3)}
.ts-none{background:rgba(148,163,184,.08); color:var(--muted); border-color:var(--border)}
body.light .ts-mhtml{color:#6d28d9} body.light .ts-i2-gh{color:#1d4ed8} body.light .ts-gh-topics{color:#15803d} body.light .ts-keywords{color:#b45309}
.cat-badge{background:var(--cat-badge-bg); color:var(--cat-badge-color); border:1px solid var(--cat-badge-border); border-radius:4px; padding:0 5px; font-size:10px; white-space:nowrap}
.fav{cursor:pointer; color:var(--muted); font-size:14px; background:none; border:none}
.fav.on{color:var(--warn)}
#main-table{width:100%; border-collapse:collapse; font-size:12.5px}
#main-table th{position:sticky; top:0; background:var(--surface); text-align:left; padding:7px 10px; border-bottom:1px solid var(--border); font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); cursor:pointer; user-select:none; z-index:5; white-space:nowrap}
#main-table td{padding:6px 10px; border-bottom:1px solid var(--border); vertical-align:top}
#main-table tr.row:hover td{background:var(--surface-hover)}
.tname{color:var(--accent2); font-weight:600; text-decoration:none; word-break:break-all}
.tname:hover{text-decoration:underline}
.tdesc{color:var(--text); opacity:.9; max-width:520px}
.ttags{max-width:300px; display:flex; flex-wrap:wrap; gap:3px}
.tnum{color:var(--muted); text-align:right; white-space:nowrap}
.gsec{margin:14px 0 4px; position:sticky; top:0; background:var(--bg); padding:8px 14px 6px; border-bottom:1px solid var(--border); z-index:4; cursor:pointer; display:flex; gap:10px; align-items:baseline}
.gsec h2{font-size:14px}
.gsec .cnt{color:var(--muted); font-size:11px}
#empty{padding:60px 20px; text-align:center; color:var(--muted)}
#empty .big{font-size:40px; margin-bottom:10px}
#notes-modal{position:fixed; inset:0; z-index:100; display:none}
#notes-modal.open{display:block}
#notes-overlay{position:absolute; inset:0; background:rgba(0,0,0,.55)}
#notes-box{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:min(760px,92vw); max-height:82vh; background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); display:flex; flex-direction:column}
#notes-head{display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--border)}
#notes-head h3{font-size:14px}
#notes-tabs{display:flex; gap:6px; padding:8px 16px 0; flex-wrap:wrap}
#notes-body{padding:12px 16px; overflow:auto}
#notes-body textarea{width:100%; min-height:300px; background:var(--surface-card); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; resize:vertical}
.detail{background:var(--surface-hover); border-top:1px dashed var(--border); padding:10px 12px; font-size:12px}
.detail .dl{color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; margin-top:7px}
.detail a{color:var(--accent2)}
.conf-hi{color:var(--success)} .conf-md{color:var(--warn)} .conf-lo{color:var(--danger)}
#toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); padding:8px 16px; font-size:12px; z-index:200; opacity:0; transition:opacity .2s; pointer-events:none}
#toast.show{opacity:1}
mark{background:rgba(251,191,36,.35); color:inherit; border-radius:2px; padding:0 1px}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:var(--surface-card); border-radius:6px} ::-webkit-scrollbar-track{background:transparent}
@media (max-width:760px){ #hdr h1 .sub{display:none} #cards-wrap{grid-template-columns:1fr} .tdesc{max-width:220px} }
</style>
</head>

</header>

<div id="fbar">

    </div>
  </div>
  <select id="sel-lang"><option value="">Language: all</option></select>
  <select id="sel-source"><option value="">Source: all</option></select>
  <select id="sel-tagsrc"><option value="">Tag source: all</option>
    <option value="mhtml">mhtml (Product Hunt)</option>
    <option value="i2-gh">prior index (GH)</option>
    <option value="gh-topics">GitHub topics</option>
    <option value="keywords">digest keywords</option>
    <option value="none">no tags</option>
  </select>
  <select id="sel-sort">
    <option value="stars">Sort: stars ↓</option>
    <option value="name">Sort: name A→Z</option>
    <option value="cats">Sort: #categories</option>
    <option value="conf">Sort: confidence</option>
    <option value="channel">Sort: source channel</option>
  </select>
  <button class="btn" id="btn-unsure" title="Show only low-confidence / unsure rows">Needs review</button>
  <button class="btn" id="btn-clear-all">Clear all</button>
</div>

<div id="month-bar"><span class="fbar-label">Published</span><span id="month-btns"></span></div>
<div id="chips"></div>
<div id="stat-bar"></div>

<main id="content">
  <div id="cards-wrap"></div>
  <table id="main-table" style="display:none">
    <thead><tr>
      <th data-sort="name" style="width:24%">Tool</th>
      <th data-sort="desc">Description</th>

      <th style="width:10%">Cats</th>
      <th style="width:3%"></th><th style="width:2%"></th>

    <tbody id="tbody"></tbody>

  <div id="group-wrap"></div>
  <div id="empty" style="display:none"><div class="big">🔍</div>No repos match the current filters.<br><button class="btn" id="empty-clear" style="margin-top:12px">Clear all filters</button></div>
</main>

<div id="notes-modal">

  </div>
</div>

if (state.fontScale !== 1) applyFontScale();

// ---------- search ----------
function fieldOf(p, f) {
  if (f === 'name') return (p.o + ' ' + p.n).toLowerCase() !== undefined ? (p.o + '/' + p.n) : '';
  if (f === 'desc') return p.d || '';
  if (f === 'syn') return p.s || '';
  if (f === 'tags') return (p.tags || []).join(' ') + ' ' + (p.kw || []).join(' ') + ' ' + (p.tp || []).join(' ');
  return [p.o, p.n, p.d, p.s, (p.tags||[]).join(' '), (p.kw||[]).join(' '), (p.tp||[]).join(' ')].join(' ');
}
function matchQ(p) {
  if (!state.q) return true;
  const hay = state.qCase ? fieldOf(p, state.qTarget) : fieldOf(p, state.qTarget).toLowerCase();
  const toks = state.qCase ? state.q.split(/\s+/) : state.q.toLowerCase().split(/\s+/);
  return toks.every(t => hay.includes(t));
}

// ---------- filters ----------
let filtered = [];
function applyFilters() {
  filtered = DATA.filter(p => {
    if (!matchQ(p)) return false;
    if (state.cat === 'none' ? (p.cats && p.cats.length) : state.cat && !(p.cats || []).includes(+state.cat)) return false;
    if (state.langs.size && !state.langs.has(p.L || '')) return false;
    if (state.kws.size) { const pt = new Set([...(p.tags||[]), ...(p.kw||[]), ...(p.tp||[])]); for (const k of state.kws) if (!pt.has(k)) return false; }
    if (state.source && p.ch !== state.source) return false;
    if (state.tagsrc && p.ts !== state.tagsrc) return false;
    if (state.month && !(p.pd || '').startsWith(state.month)) return false;
    if (state.favOnly && !state.favs.has(p.id)) return false;
    if (state.unsureOnly && !((p.conf != null && p.conf < 0.6) || p.u)) return false;
    return true;
  });
  sortFiltered();
  renderAll();
}
function sortFiltered() {
  const s = state.sort;
  filtered.sort((a, b) => {
    if (s === 'stars') return (b.S || -1) - (a.S || -1);
    if (s === 'name') return (a.o + '/' + a.n).localeCompare(b.o + '/' + b.n);
    if (s === 'cats') return (b.cats || []).length - (a.cats || []).length;
    if (s === 'conf') return (b.conf || 0) - (a.conf || 0);
    if (s === 'channel') return (a.ch || '').localeCompare(b.ch || '') || (b.S || 0) - (a.S || 0);
    return 0;
  });
}

// ---------- rendering ----------
const CARD_BATCH = 48;
let cardPainted = 0;
function tagPills(p) {
  const t = p.tags || [];
  if (!t.length) return '<span class="tagpill ts-none">no tags</span>';
  return t.slice(0, 6).map(x => `<span class="tagpill ts-${p.ts}" title="source: ${TS_LABEL[p.ts]||p.ts}">${esc(x)}</span>`).join('') + (t.length > 6 ? `<span class="tagpill ts-none">+${t.length - 6}</span>` : '');
}
function catBadges(p) { return (p.cats || []).map(c => `<span class="cat-badge" title="${esc(CATNAME.get(c)||'')}">${c}</span>`).join(' '); }
function confMark(p) {
  if (p.conf == null) return '';
  const c = p.cats && p.cats.length ? p.conf : 1;
  return `<span class="${c >= 0.8 ? 'conf-hi' : c >= 0.6 ? 'conf-md' : 'conf-lo'}" title="confidence ${p.conf}${p.u ? ' · flagged unsure' : ''}">${p.u ? '⚑' : ''}${c >= 0.8 ? '' : c.toFixed(1)}</span>`;
}
function cardHtml(p) {
  const fav = state.favs.has(p.id);
  return `<div class="card" data-id="${esc(p.id)}">
    <div style="display:flex;justify-content:space-between;gap:6px;align-items:baseline">
      <a class="cname" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.n)}</a>
      <button class="fav ${fav ? 'on' : ''}" data-fav="${esc(p.id)}">${fav ? '★' : '☆'}</button>
    </div>
    <div class="cowner">${esc(p.o)}${p.L ? ' · <span class="lang-dot" style="background:' + (LANG_COLOR[p.L] || '#8b8fa8') + '"></span> ' + esc(p.L) : ''}${p.S != null ? ' · ★ ' + fmt(p.S) : ''}</div>
    <div class="cdesc">${esc(p.d || '')}</div>
    <div class="ttags" style="display:flex;flex-wrap:wrap;gap:3px">${tagPills(p)}</div>
    <div class="cmeta"><span class="cats">${catBadges(p) || '<span style="opacity:.5">no category</span>'}</span><span style="margin-left:auto">${confMark(p)}</span></div>
  </div>`;
}
function rowHtml(p) {
  const open = state.open.has(p.id), fav = state.favs.has(p.id);
  let html = `<tr class="row" data-id="${esc(p.id)}">
    <td><a class="tname" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.n)}</a><div style="color:var(--muted);font-size:11px">${esc(p.o)}</div></td>
    <td class="tdesc">${esc((p.d || '').slice(0, 220))}${(p.d || '').length > 220 ? '…' : ''}</td>
    <td class="ttags">${tagPills(p)}</td>
    <td style="white-space:nowrap">${p.L ? '<span class="lang-dot" style="background:' + (LANG_COLOR[p.L] || '#8b8fa8') + '"></span> ' + esc(p.L.slice(0, 11)) : ''}</td>
    <td class="tnum">${p.S != null ? fmt(p.S) : ''}</td>
    <td>${catBadges(p) || '<span style="opacity:.5">—</span>'}</td>
    <td class="tnum">${confMark(p)}</td>
    <td style="white-space:nowrap"><button class="fav ${fav ? 'on' : ''}" data-fav="${esc(p.id)}">${fav ? '★' : '☆'}</button></td>
  </tr>`;
  if (open) html += detailHtml(p);
  return html;
}
function detailHtml(p) {
  const prov = p.vt ? `source: <b>${esc(p.ch || '')}</b>${p.pd ? ' · ' + esc(p.pd) : ''}${p.vu ? ' · <a href="' + esc(p.vu) + '" target="_blank" rel="noopener">video</a>' : ''}<br><span style="color:var(--muted)">${esc(p.vt)}</span>` : '';
  const prior = (p.prior && p.prior.length) ? p.prior.map(c => `<span class="cat-badge" title="from prior index">${c}</span>`).join(' ') + ' <span style="color:var(--muted)">(prior index)</span>' : '—';
  return `<tr class="detail-row"><td colspan="8"><div class="detail">
    <div>${esc(p.s || p.d || '(no synopsis)')}</div>
    <div class="dl">Categories</div><div>${(p.cats||[]).map(c => esc(c + '. ' + (CATNAME.get(c) || ''))).join('<br>') || '— none —'} ${p.conf != null ? ' <span style="color:var(--muted)">(conf ' + p.conf + (p.u ? ', flagged unsure' : '') + ')</span>' : ''}</div>
    <div class="dl">Prior-index categories</div><div>${prior}</div>
    ${p.kw && p.kw.length ? '<div class="dl">Digest keywords</div><div style="color:var(--muted)">' + esc(p.kw.join(', ')) + '</div>' : ''}
    ${p.tp && p.tp.length ? '<div class="dl">GitHub topics</div><div style="color:var(--muted)">' + esc(p.tp.join(', ')) + '</div>' : ''}
    <div class="dl">Tags (source: ${TS_LABEL[p.ts] || p.ts || 'none'})</div><div>${(p.tags||[]).map(esc).join(', ') || '—'}</div>
    <div class="dl">Provenance</div><div>${prov || '—'}</div>
  </div></td></tr>`;
}
function renderAll() { updateChips(); updateStatBar(); if (state.view === 'cards') renderCards(); else if (state.view === 'table') renderTable(); else renderGroup(); }
function renderCards() {
  $('cards-wrap').style.display = 'grid'; $('main-table').style.display = 'none'; $('group-wrap').style.display = 'none';
  cardPainted = 0; $('cards-wrap').innerHTML = filtered.map(cardHtml).join('');
  $('empty').style.display = filtered.length ? 'none' : 'block';
}
function renderTable() {
  $('cards-wrap').style.display = 'none'; $('main-table').style.display = 'table'; $('group-wrap').style.display = 'none';
  $('tbody').innerHTML = filtered.map(rowHtml).join('');
  $('empty').style.display = filtered.length ? 'none' : 'block';
}
function renderGroup() {
  $('cards-wrap').style.display = 'none'; $('main-table').style.display = 'none'; $('group-wrap').style.display = 'block';
  const byCat = new Map();
  const none = [];
  for (const p of filtered) { if ((p.cats || []).length) for (const c of p.cats) { if (!byCat.has(c)) byCat.set(c, []); byCat.get(c).push(p); } else none.push(p); }
  let html = '<div style="padding:0 14px">';
  for (const c of CATS) {
    const list = byCat.get(c.n) || [];
    if (!list.length && state.cat !== String(c.n)) continue;
    const col = state.collapsed.has(c.n);
    html += `<div class="gsec" data-gcat="${c.n}"><h2>${c.n}. ${esc(c.name)}</h2><span class="cnt">${list.length} repo${list.length === 1 ? '' : 's'}${col ? ' (collapsed)' : ''}</span></div>`;
    if (!col) html += '<table class="gtable" style="width:100%;border-collapse:collapse"><tbody>' + list.map(rowHtml).join('') + '</tbody></table>';
  }
  if (none.length) {
    html += `<div class="gsec" data-gcat="none"><h2>No category</h2><span class="cnt">${none.length} repos</span></div>`;
    if (!state.collapsed.has('none')) html += '<table class="gtable" style="width:100%;border-collapse:collapse"><tbody>' + none.map(rowHtml).join('') + '</tbody></table>';
  }
  html += '</div>';
  $('group-wrap').innerHTML = html;
  $('empty').style.display = filtered.length ? 'none' : 'block';
}

// ---------- stat bar / chips ----------
function updateStatBar() {
  const n = filtered.length;
  const catN = filtered.filter(p => (p.cats || []).length).length;
  const sumAssign = filtered.reduce((a, p) => a + (p.cats || []).length, 0);
  $('stat-bar').innerHTML =
    `<span><b>${fmt(n)}</b> / ${fmt(DATA.length)} repos shown</span>` +
    `<span><b>${catN}</b> categorized (<b>${sumAssign}</b> assignments)</span>` +
    `<span><b>${state.favs.size}</b> favorites</span>` +
    `<span>generated ${esc(GEN)} · combined explorer v1</span>`;
}
function updateChips() {
  const chips = [];
  if (state.q) chips.push(['q', `search: <b>${esc(state.q)}</b>`]);
  if (state.qTarget !== 'all') chips.push(['qt', `scope: <b>${esc(state.qTarget)}</b>`]);
  if (state.qCase) chips.push(['qc', `exact case`]);
  if (state.cat) chips.push(['cat', `category: <b>${state.cat === 'none' ? 'none' : esc(CATNAME.get(+state.cat) || state.cat)}</b>`]);
  for (const k of state.kws) chips.push(['kw:' + k, `tag: <b>${esc(k)}</b>`]);
  for (const l of state.langs) chips.push(['lang:' + l, `lang: <b>${esc(l)}</b>`]);
  if (state.source) chips.push(['src', `source: <b>${esc(state.source)}</b>`]);
  if (state.tagsrc) chips.push(['tsrc', `tag source: <b>${esc(state.tagsrc)}</b>`]);
  if (state.month) chips.push(['month', `published: <b>${esc(state.month)}</b>`]);
  if (state.favOnly) chips.push(['fav', `favorites only`]);
  if (state.unsureOnly) chips.push(['unsure', `needs review`]);
  $('chips').innerHTML = chips.map(([k, html]) => `<span class="chip">${html} <span class="x" data-chip="${esc(k)}">✕</span></span>`).join('');
}

// ---------- tag panel ----------
function allTagCounts() {
  const m = new Map();
  for (const p of DATA) for (const t of (p.tags || [])) m.set(t, (m.get(t) || 0) + 1);
  return [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}
function buildKwBar(filter) {
  const counts = allTagCounts().filter(([t]) => !filter || t.toLowerCase().includes(filter.toLowerCase()));
  $('kw-dd-list').innerHTML = counts.slice(0, 400).map(([t, n]) =>
    `<span class="kw-pill ${state.kws.has(t) ? 'on' : ''}" data-kw="${esc(t)}">${esc(t)} <span style="opacity:.55">${n}</span></span>`).join('') +
    (counts.length > 400 ? `<span style="color:var(--muted);font-size:11px;padding:3px">+${counts.length - 400} more — type to filter</span>` : '');
}

// ---------- selects ----------
function buildSelects() {
  const catCounts = new Map();
  let none = 0;
  for (const p of DATA) { if ((p.cats || []).length) for (const c of p.cats) catCounts.set(c, (catCounts.get(c) || 0) + 1); else none++; }
  $('sel-cat').innerHTML = '<option value="">Category: all</option><option value="none">— no category (' + none + ') —</option>' +
    CATS.map(c => `<option value="${c.n}">${c.n}. ${esc(c.name)} (${catCounts.get(c.n) || 0})</option>`).join('');
  const langs = new Map(); for (const p of DATA) if (p.L) langs.set(p.L, (langs.get(p.L) || 0) + 1);
  $('sel-lang').innerHTML = '<option value="">Language: all</option>' + [...langs.entries()].sort((a, b) => b[1] - a[1]).slice(0, 30).map(([l, n]) => `<option value="${esc(l)}">${esc(l)} (${n})</option>`).join('');
  const srcs = new Map(); for (const p of DATA) if (p.ch) srcs.set(p.ch, (srcs.get(p.ch) || 0) + 1);
  $('sel-source').innerHTML = '<option value="">Source: all</option>' + [...srcs.entries()].sort((a, b) => b[1] - a[1]).map(([s, n]) => `<option value="${esc(s)}">${esc(s)} (${n})</option>`).join('');
  const months = new Map(); for (const p of DATA) if (p.pd) { const m = p.pd.slice(0, 7); months.set(m, (months.get(m) || 0) + 1); }
  $('month-btns').innerHTML = [...months.entries()].sort().map(([m, n]) => `<button class="mbtn ${state.month === m ? 'on' : ''}" data-month="${m}">${m} · ${n}</button>`).join('') || '<span style="color:var(--muted);font-size:11px">no dates</span>';
}

// ---------- notes ----------
let notesTab = 'general';
function openNotes() { renderNotesTabs(); renderNotesBody(); $('notes-modal').classList.add('open'); }
function closeNotes() { saveNotes(); $('notes-modal').classList.remove('open'); }
function saveNotes() { state.notes[notesTab] = $('notes-area').value; localStorage.setItem('fce-notes', JSON.stringify(state.notes)); }
function renderNotesTabs() {
  const tabs = ['general', ...CATS.map(c => String(c.n))];
  $('notes-tabs').innerHTML = tabs.filter(t => t === 'general' || state.notes[t] !== undefined).map(t =>
    `<button class="btn ${t === notesTab ? 'on' : ''}" data-note-tab="${t}">${t === 'general' ? 'general' : t + '. ' + esc((CATS[+t - 1] || {}).name || '').slice(0, 26)}</button>`).join('') +
    `<button class="btn" data-note-tab="__new">+ category…</button>`;
}
function renderNotesBody() { $('notes-title').textContent = 'Notes — ' + (notesTab === 'general' ? 'general' : (CATS[+notesTab - 1] || {}).name); $('notes-area').value = state.notes[notesTab] || ''; }

// ---------- export ----------
function doExport() {
  const rows = filtered.map(p => ({ id: p.id, name: p.n, owner: p.o, url: p.url, language: p.L, stars: p.S, description: p.d, tags: p.tags, tag_source: p.ts, categories: (p.cats || []).map(c => CATNAME.get(c)), confidence: p.conf, source_channel: p.ch }));
  const blob = new Blob([JSON.stringify({ generated: GEN, count: rows.length, products: rows }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'foss-category-explorer-export-' + GEN + '.json'; a.click();
  toast('Exported ' + rows.length + ' repos (JSON)');
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }

// ---------- font scale / theme ----------
function applyFontScale() { document.body.style.fontSize = (13 * state.fontScale).toFixed(1) + 'px'; localStorage.setItem('fce-font', state.fontScale); }

// ---------- events ----------
$('search-input').addEventListener('input', e => { state.q = e.target.value.trim(); $('search-clear-btn').style.display = state.q ? 'block' : 'none'; applyFilters(); });
$('search-clear-btn').addEventListener('click', () => { state.q = ''; $('search-input').value = ''; $('search-clear-btn').style.display = 'none'; applyFilters(); });
$('sel-search-target').addEventListener('change', e => { state.qTarget = e.target.value; applyFilters(); });
$('sm-sub').addEventListener('click', () => { state.qCase = false; $('sm-sub').classList.add('on'); $('sm-case').classList.remove('on'); applyFilters(); });
$('sm-case').addEventListener('click', () => { state.qCase = true; $('sm-case').classList.add('on'); $('sm-sub').classList.remove('on'); applyFilters(); });
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') { e.preventDefault(); $('search-input').focus(); } if (e.key === 'Escape') closeNotes(); });
for (const b of document.querySelectorAll('[data-view]')) b.addEventListener('click', () => { state.view = b.dataset.view; document.querySelectorAll('[data-view]').forEach(x => x.classList.toggle('on', x === b)); renderAll(); });
$('btn-fav-only').addEventListener('click', () => { state.favOnly = !state.favOnly; $('btn-fav-only').classList.toggle('on', state.favOnly); applyFilters(); });
$('btn-unsure').addEventListener('click', () => { state.unsureOnly = !state.unsureOnly; $('btn-unsure').classList.toggle('on', state.unsureOnly); applyFilters(); });
$('btn-clear-all').addEventListener('click', clearAllFilters);
$('empty-clear').addEventListener('click', clearAllFilters);
function clearAllFilters() {
  state.q = ''; state.qTarget = 'all'; state.cat = ''; state.kws.clear(); state.langs.clear(); state.source = ''; state.tagsrc = ''; state.month = ''; state.favOnly = false; state.unsureOnly = false;
  $('search-input').value = ''; $('search-clear-btn').style.display = 'none';
  $('sel-cat').value = ''; $('sel-lang').value = ''; $('sel-source').value = ''; $('sel-tagsrc').value = ''; $('sel-search-target').value = 'all';
  $('btn-fav-only').classList.remove('on'); $('btn-unsure').classList.remove('on'); $('sm-sub').classList.add('on'); $('sm-case').classList.remove('on');
  applyFilters();
}
$('sel-cat').addEventListener('change', e => { state.cat = e.target.value; applyFilters(); });
$('sel-lang').addEventListener('change', e => { const v = e.target.value; if (v) state.langs.add(v); else state.langs.clear(); applyFilters(); });
$('sel-source').addEventListener('change', e => { state.source = e.target.value; applyFilters(); });
$('sel-tagsrc').addEventListener('change', e => { state.tagsrc = e.target.value; applyFilters(); });
$('sel-sort').addEventListener('change', e => { state.sort = e.target.value; applyFilters(); });
$('kw-dd-btn').addEventListener('click', e => { e.stopPropagation(); const p = $('kw-dd-panel'); p.classList.toggle('open'); if (p.classList.contains('open')) buildKwBar($('kw-dd-search').value); });
$('kw-dd-search').addEventListener('input', e => buildKwBar(e.target.value));
$('kw-clear-btn').addEventListener('click', () => { state.kws.clear(); buildKwBar(''); applyFilters(); });
document.addEventListener('click', e => {
  const pill = e.target.closest('[data-kw]');
  if (pill) { const k = pill.dataset.kw; state.kws.has(k) ? state.kws.delete(k) : state.kws.add(k); buildKwBar($('kw-dd-search').value); applyFilters(); return; }
  if (!e.target.closest('#kw-bar-wrap')) $('kw-dd-panel').classList.remove('open');
  const x = e.target.closest('[data-chip]');
  if (x) { const k = x.dataset.chip; removeChip(k); return; }
  const m = e.target.closest('[data-month]');
  if (m) { const mo = m.dataset.month; state.month = state.month === mo ? '' : mo; buildSelects(); applyFilters(); return; }
  const g = e.target.closest('[data-gcat]');
  if (g) { const c = g.dataset.gcat; state.collapsed.has(c) ? state.collapsed.delete(c) : state.collapsed.add(c); renderGroup(); return; }
  const fav = e.target.closest('[data-fav]');
  if (fav) { e.stopPropagation(); const id = fav.dataset.fav; state.favs.has(id) ? state.favs.delete(id) : state.favs.add(id); localStorage.setItem('fce-favs', JSON.stringify([...state.favs])); fav.classList.toggle('on'); fav.textContent = state.favs.has(id) ? '★' : '☆'; updateStatBar(); return; }
  const name = e.target.closest('a.tname, a.cname');
  if (name) { e.stopPropagation(); return; }
  const row = e.target.closest('tr.row, .card');
  if (row) { const id = row.dataset.id; state.open.has(id) ? state.open.delete(id) : state.open.add(id); if (state.view === 'table') renderTable(); else if (state.view === 'group') renderGroup(); else { const c = row.querySelector('.cdesc'); if (c) c.style.webkitLineClamp = state.open.has(id) ? 'unset' : '3'; } }
});
function removeChip(k) {
  if (k === 'q') { state.q = ''; $('search-input').value = ''; $('search-clear-btn').style.display = 'none'; }
  else if (k === 'qt') { state.qTarget = 'all'; $('sel-search-target').value = 'all'; }
  else if (k === 'qc') { state.qCase = false; $('sm-sub').classList.add('on'); $('sm-case').classList.remove('on'); }
  else if (k === 'cat') { state.cat = ''; $('sel-cat').value = ''; }
  else if (k.startsWith('kw:')) state.kws.delete(k.slice(3));
  else if (k.startsWith('lang:')) { state.langs.delete(k.slice(5)); $('sel-lang').value = state.langs.size ? [...state.langs].slice(-1)[0] : ''; }
  else if (k === 'src') { state.source = ''; $('sel-source').value = ''; }
  else if (k === 'tsrc') { state.tagsrc = ''; $('sel-tagsrc').value = ''; }
  else if (k === 'month') { state.month = ''; buildSelects(); }
  else if (k === 'fav') { state.favOnly = false; $('btn-fav-only').classList.remove('on'); }
  else if (k === 'unsure') { state.unsureOnly = false; $('btn-unsure').classList.remove('on'); }
  applyFilters();
}
for (const th of document.querySelectorAll('#main-table th[data-sort]')) th.addEventListener('click', () => { state.sort = th.dataset.sort; $('sel-sort').value = ['stars','name','cats','conf','channel'].includes(state.sort) ? state.sort : 'stars'; applyFilters(); });
$('btn-notes').addEventListener('click', openNotes);
$('notes-close').addEventListener('click', closeNotes);
$('notes-overlay').addEventListener('click', closeNotes);
$('notes-tabs').addEventListener('click', e => { const b = e.target.closest('[data-note-tab]'); if (!b) return; if (b.dataset.noteTab === '__new') { const n = prompt('Category number (1-' + CATS.length + ')'); if (n && +n >= 1 && +n <= CATS.length) { notesTab = String(+n); } } else notesTab = b.dataset.noteTab; renderNotesTabs(); renderNotesBody(); });
$('btn-export').addEventListener('click', doExport);
$('font-minus').addEventListener('click', () => { state.fontScale = Math.max(0.8, state.fontScale - 0.1); applyFontScale(); });
$('font-plus').addEventListener('click', () => { state.fontScale = Math.min(1.6, state.fontScale + 0.1); applyFontScale(); });
$('btn-dark').addEventListener('click', () => { document.body.classList.toggle('light'); localStorage.setItem('fce-theme', document.body.classList.contains('light') ? 'light' : 'dark'); });
if (localStorage.getItem('fce-theme') === 'light') document.body.classList.add('light');

// ---------- init ----------
buildSelects();
