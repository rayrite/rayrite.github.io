<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Product Hunt Jan-Aug 2026 FOSS Roundup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>/* ===== CSS Variables - Light Mode (Default) ===== */
:root {
    /* Accent colors */
    --accent-color: #6366f1;
    --accent-hover: #4f46e5;
    --success-color: #10b981;
    --warning-color: #f59e0b;
    --error-color: #ef4444;

    /* Text colors */
    --text-primary: #1f2937;
    --text-secondary: #6b7280;
    --text-muted: #9ca3af;

    /* Background colors */
    --bg-primary: #ffffff;
    --bg-secondary: #f8fafc;
    --bg-tertiary: #f1f5f9;

    /* Border colors */
    --border-color: #e5e7eb;
    --border-light: #f3f4f6;

    /* Shadows */
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);

    /* Border radius */
    --radius-sm: 0.25rem;
    --radius-md: 0.375rem;
    --radius-lg: 0.5rem;
    --radius-full: 9999px;

    /* Transitions */
    --transition-fast: 0.15s ease;
    --transition-normal: 0.2s ease;

    /* Header heights */
    --header-height: 48px;
    --filterbar-height: 28px;

    /* Month Colors */
    --month-jan: #3b82f6;
    --month-feb: #8b5cf6;
    --month-mar: #10b981;
    --month-apr: #f97316;
    --month-may: #ec4899;
    --month-jun: #06b6d4;
    --month-jul: #f59e0b;
    --month-aug: #84cc16;
    --month-sep: #6366f1;
    --month-oct: #14b8a6;
    --month-nov: #a855f7;
    --month-dec: #ef4444;
    --month-multi: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%);
}

/* ===== Dark Mode ===== */
html.dark-mode {
    --text-primary: #f1f5f9;
    --text-secondary: #cbd5e1;
    --text-muted: #94a3b8;
    --bg-primary: #0f172a;
    --bg-secondary: #1e293b;
    --bg-tertiary: #334155;
    --border-color: #475569;
    --border-light: #334155;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
}

/* ===== Reset & Base ===== */
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
    color: var(--text-primary);
    background: var(--bg-primary);
    line-height: 1.4;
}

/* ===== App Shell ===== */
.app {
    display: flex;
    flex-direction: column;
    height: 100vh;
}

/* ===== Compact Header (48px) ===== */
.sticky-header {
    height: var(--header-height);
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 12px;
    flex-shrink: 0;
    z-index: 100;
}

/* Title Section */
.header-title {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
}

.header-title .title {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
}

.header-title .count-badge {
    background: rgba(99, 102, 241, 0.15);
    color: var(--accent-color);
    padding: 2px 8px;
    border-radius: var(--radius-full);
    font-size: 11px;
    font-weight: 600;
}

/* Header Filters */
.header-filters {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
}

.search-box {
    position: relative;
    flex: 1;
    max-width: 280px;
    min-width: 120px;
}

.search-box i {
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 12px;
}

.search-box input {
    width: 100%;
    padding: 6px 28px 6px 28px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    background: var(--bg-primary);
    color: var(--text-primary);
    font-size: 12px;
    outline: none;
    transition: border-color var(--transition-fast);
    height: 32px;
}

.search-box input::placeholder { color: var(--text-muted); }
.search-box input:focus { border-color: var(--accent-color); }

.search-box .clear-btn {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 2px;
    font-size: 12px;
    display: none;
}

.search-box .clear-btn:hover { color: var(--error-color); }
.search-box.has-value .clear-btn { display: block; }

/* Tag Dropdown */
.tag-dropdown {
    position: relative;
    display: inline-block;
}

.tag-dropdown-btn {
    padding: 6px 10px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    background: var(--bg-primary);
    color: var(--text-secondary);
    font-size: 12px;
    cursor: pointer;
    outline: none;
    min-width: 80px;
    height: 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all var(--transition-fast);
    white-space: nowrap;
}

.tag-dropdown-btn:hover { border-color: var(--accent-color); color: var(--accent-color); }
.tag-dropdown-btn.open { border-color: var(--accent-color); color: var(--accent-color); }
.tag-dropdown-btn.open i { transform: rotate(180deg); }
.tag-dropdown-btn i { font-size: 10px; transition: transform var(--transition-fast); }

.tag-dropdown-panel {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    min-width: 220px;
    max-width: 320px;
    max-height: 280px;
    overflow-y: auto;
    background: var(--bg-primary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    z-index: 200;
    padding: 8px;
}

.tag-dropdown-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.tag-dropdown-grid .filter-pill {
    padding: 3px 10px;
    font-size: 11px;
    height: 24px;
}

/* Sort Button */
.sort-btn {
    padding: 6px 10px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    background: var(--bg-primary);
    color: var(--text-secondary);
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
    transition: all var(--transition-fast);
    height: 32px;
    display: flex;
    align-items: center;
    gap: 4px;
}

.sort-btn:hover { border-color: var(--accent-color); color: var(--accent-color); }
.sort-btn.active { background: var(--accent-color); color: white; border-color: var(--accent-color); }
.sort-btn.asc::after { content: ' ↑'; }
.sort-btn.desc::after { content: ' ↓'; }

/* Promoted Toggle */
.promoted-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    background: var(--bg-primary);
    cursor: pointer;
    transition: all var(--transition-fast);
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: -0.5px;
}

.promoted-toggle:hover { border-color: var(--accent-color); color: var(--accent-color); }
.promoted-toggle.active {
    background: var(--accent-color);
    border-color: var(--accent-color);
    color: white;
}
.promoted-toggle input { display: none; }

/* Header Actions */
.header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
}

.icon-btn {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-primary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all var(--transition-fast);
    font-size: 13px;
}

.icon-btn:hover { border-color: var(--accent-color); color: var(--accent-color); }
.icon-btn.active { background: var(--accent-color); border-color: var(--accent-color); color: white; }

/* Dark Mode Toggle */
.dark-toggle {
    padding: 6px 10px;
    font-size: 12px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    background: var(--bg-primary);
    cursor: pointer;
    color: var(--text-secondary);
    height: 32px;
    transition: all var(--transition-fast);
}

.dark-toggle:hover { border-color: var(--accent-color); color: var(--accent-color); }

/* ===== Filter Bar (28px) ===== */
.filter-bar {
    height: var(--filterbar-height);
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 8px;
    flex-shrink: 0;
    overflow-x: auto;
    scrollbar-width: none;
}

.filter-bar::-webkit-scrollbar { display: none; }

.filter-pill {
    padding: 2px 10px;
    font-size: 11px;
    background: var(--bg-primary);
    color: var(--text-secondary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-full);
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: all var(--transition-fast);
    height: 22px;
    display: flex;
    align-items: center;
}

.filter-pill:hover { border-color: var(--accent-color); color: var(--accent-color); }
.filter-pill.active { background: var(--accent-color); color: white; border-color: var(--accent-color); }

.filter-divider {
    color: var(--text-muted);
    font-size: 10px;
    flex-shrink: 0;
    user-select: none;
}

.active-filter-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    font-size: 11px;
    background: rgba(99, 102, 241, 0.15);
    color: var(--accent-color);
    border-radius: var(--radius-full);
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
}

.active-filter-tag .remove {
    font-size: 10px;
    opacity: 0.7;
}

.active-filter-tag:hover .remove { opacity: 1; }

.clear-all-btn {
    padding: 2px 8px;
    font-size: 10px;
    background: var(--error-color);
    color: white;
    border: none;
    border-radius: var(--radius-full);
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    height: 22px;
    transition: background var(--transition-fast);
}

.clear-all-btn:hover { background: #dc2626; }

.spacer { flex: 1; }

/* ===== Main Content Area ===== */
.main-content {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
}

/* ===== Card View ===== */
.card-view {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 12px;
    scroll-behavior: smooth;
}

.card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 10px;
}

/* Product Card */
.product-card {
    background: var(--bg-primary);
    border-radius: var(--radius-lg);
    padding: 14px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-light);
    transition: all var(--transition-fast);
    display: flex;
    flex-direction: column;
    gap: 10px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
}

.product-card:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
    border-color: var(--border-color);
}

/* Month Ribbon - Triangular corner */
.month-ribbon {
    position: absolute;
    top: -24px;
    right: -24px;
    width: 48px;
    height: 48px;
    transform: rotate(45deg);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 5px;
    font-size: 8px;
    font-weight: 700;
    color: white;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    z-index: 5;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    pointer-events: none;
}

/* Month Ribbon Colors */
.month-ribbon.jan { background: #3b82f6; }
.month-ribbon.feb { background: #8b5cf6; }
.month-ribbon.mar { background: #10b981; }
.month-ribbon.apr { background: #f97316; }
.month-ribbon.may { background: #ec4899; }
.month-ribbon.jun { background: #06b6d4; }
.month-ribbon.jul { background: #f59e0b; }
.month-ribbon.aug { background: #84cc16; }
.month-ribbon.sep { background: #6366f1; }
.month-ribbon.oct { background: #14b8a6; }
.month-ribbon.nov { background: #a855f7; }
.month-ribbon.dec { background: #ef4444; }
.month-ribbon.multi { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%); }

/* Card Content */
.card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    padding-right: 40px;
}

.card-title {
    color: var(--accent-color);
    font-weight: 600;
    font-size: 15px;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex: 1;
}

.card-title a {
    color: inherit;
    text-decoration: none;
}

.card-title a:hover { text-decoration: underline; }

.card-description {
    color: var(--text-secondary);
    font-size: 13px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.card-meta {
    display: flex;
    gap: 12px;
    font-size: 12px;
}

.card-meta .metric {
    display: flex;
    align-items: center;
    gap: 4px;
}

.card-meta .metric.upvotes { color: var(--success-color); }
.card-meta .metric.comments { color: var(--accent-color); }

.card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.tag-pill {
    background: rgba(99, 102, 241, 0.1);
    color: var(--accent-color);
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: background var(--transition-fast);
}

.tag-pill:hover { background: rgba(99, 102, 241, 0.2); }

.card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 10px;
    border-top: 1px solid var(--border-light);
    margin-top: auto;
}

.visit-btn {
    background: var(--accent-color);
    color: white;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: var(--radius-md);
    font-size: 12px;
    font-weight: 500;
    transition: background var(--transition-fast);
    display: inline-flex;
    align-items: center;
    gap: 4px;
}

.visit-btn:hover { background: var(--accent-hover); }

/* ===== Bookmark Button ===== */
.bookmark-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    padding: 4px;
    transition: color var(--transition-fast), transform var(--transition-fast);
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.bookmark-btn:hover {
    color: var(--warning-color);
    transform: scale(1.15);
}

.bookmark-btn.bookmarked {
    color: var(--warning-color);
}

.bookmark-btn.bookmarked i {
    font-weight: 900;
}

/* Favorites count badge */
.fav-count {
    font-size: 13px;
    font-weight: 700;
    margin-left: 2px;
    min-width: 14px;
    text-align: center;
}

/* ===== Table View ===== */
.table-view {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
}

.table-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    min-height: 0;
}

/* Table Header (sticky) */
.table-header {
    display: grid;
    grid-template-columns: 30px 50px minmax(0, 2fr) minmax(0, 3fr) 60px 70px minmax(0, 2fr) minmax(0, 1.5fr) 30px;
    height: 28px;
    padding: 0 8px;
    align-items: center;
    border-bottom: 1px solid var(--border-color);
    background: var(--bg-secondary);
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    position: sticky;
    top: 0;
    z-index: 10;
}

.th {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.th.sortable {
    cursor: pointer;
    user-select: none;
    transition: color var(--transition-fast);
}

.th.sortable:hover { color: var(--accent-color); }
.th.sortable.active { color: var(--accent-color); }

.th-num {
    text-align: center;
}

/* Virtual Scroll Container */
.virtual-container {
    position: relative;
    overflow: hidden;
}

.virtual-content {
    position: absolute;
    left: 0;
    right: 0;
    will-change: transform;
}

/* Table Row */
.table-row {
    display: grid;
    grid-template-columns: 30px 50px minmax(0, 2fr) minmax(0, 3fr) 60px 70px minmax(0, 2fr) minmax(0, 1.5fr) 30px;
    height: 52px;
    padding: 0 8px;
    align-items: center;
    border-bottom: 1px solid var(--border-light);
    font-size: 12px;
    transition: background var(--transition-fast);
}

.table-row:hover { background: rgba(99, 102, 241, 0.05); }

.table-row.promoted {
    background: linear-gradient(90deg, rgba(251, 191, 36, 0.08) 0%, rgba(251, 191, 36, 0.02) 100%);
    border-left: 3px solid var(--warning-color);
}

/* Rank cell */
.td-rank {
    text-align: center;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 11px;
}

/* Promoted badge for cards */
.promoted-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
    color: #1a1a1a;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2px 8px;
    border-radius: var(--radius-full);
    line-height: 1;
}

/* Card rank prefix */
.card-rank {
    color: var(--text-muted);
    font-weight: 600;
    font-size: 13px;
    margin-right: 4px;
}

.td {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.td-num {
    text-align: center;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
}

/* Leftmost bookmark/star column */
.th-star {
    text-align: center;
}

.td-star {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
}

/* Tags column: no truncation, chips wrap across up to two rows */
.td-tags {
    display: flex;
    flex-wrap: wrap;
    align-content: center;
    gap: 3px 4px;
    overflow: hidden;
    white-space: normal;
    text-overflow: clip;
    max-height: 40px;
    line-height: 1.3;
}

.td-tags .tag-small {
    margin-right: 0;
}

.product-link {
    color: var(--accent-color);
    text-decoration: none;
    font-weight: 500;
}

.product-link:hover { text-decoration: underline; }

.desc-text {
    color: var(--text-secondary);
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    white-space: normal;
}

.tag-small {
    background: rgba(99, 102, 241, 0.1);
    color: var(--accent-color);
    padding: 1px 6px;
    border-radius: var(--radius-sm);
    font-size: 10px;
    margin-right: 4px;
    cursor: pointer;
}

.tag-small:hover { background: rgba(99, 102, 241, 0.2); }

.source-badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: var(--radius-sm);
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    margin-right: 4px;
    cursor: pointer;
    color: white;
}

.source-badge.jan { background: var(--month-jan); }
.source-badge.feb { background: var(--month-feb); }
.source-badge.mar { background: var(--month-mar); }
.source-badge.apr { background: var(--month-apr); }
.source-badge.may { background: var(--month-may); }
.source-badge.jun { background: var(--month-jun); }
.source-badge.jul { background: var(--month-jul); }
.source-badge.aug { background: var(--month-aug); }
.source-badge.sep { background: var(--month-sep); }

    <script>(function() {
    'use strict';

    /* ===== State Manager ===== */
    const State = {
        products: [],
        filtered: [],
        view: 'table',
        darkMode: false,
        favorites: new Set(),
        favoritesOnly: false,
        filters: {
            search: '',
            tags: [],
            months: [],
            promotedOnly: false,
            sort: { field: 'upvotes', dir: 'desc' }
        },
        cardPage: 0,
        cardBatchSize: 60,
        rowHeight: 52,
        scrollTop: 0
    };

    /* ===== DOM Cache ===== */
    const $ = (id) => document.getElementById(id);

    const dom = {
        searchInput: $('searchInput'),
        searchBox: $('searchBox'),
        clearSearch: $('clearSearch'),
        tagDropdownBtn: $('tagDropdownBtn'),
        tagDropdownPanel: $('tagDropdownPanel'),
        tagDropdownGrid: $('tagDropdownGrid'),
        sortBtn: $('sortBtn'),
        promotedToggle: $('promotedToggle'),
        favoritesToggle: $('favoritesToggle'),
        exportBtn: $('exportBtn'),
        favCount: $('favCount'),
        viewCard: $('viewCard'),
        viewTable: $('viewTable'),
        darkToggle: $('darkToggle'),
        monthFilters: $('monthFilters'),
        activeFilters: $('activeFilters'),
        clearAllFilters: $('clearAllFilters'),
        productCount: $('productCount'),
        loadingState: $('loadingState'),
        emptyState: $('emptyState'),
        cardView: $('cardView'),
        cardGrid: $('cardGrid'),
        tableView: $('tableView'),
        tableScroll: $('tableScroll'),
        virtualContainer: $('virtualContainer'),
        virtualContent: $('virtualContent')
    };

    /* ===== Init ===== */
    async function init() {
        loadDarkMode();
        loadFavorites();
        loadProducts();
        setupEventListeners();
    }

    function loadDarkMode() {
        try {
            const saved = localStorage.getItem('ph-dark-mode');
            if (saved === 'true') {
                State.darkMode = true;
                document.documentElement.classList.add('dark-mode');
                updateDarkToggleIcon();
            }
        } catch (e) { /* file:// may block localStorage */ }
    }

    async function loadProducts() {
        const script = $('embedded-data');
        if (!script) return;

        try {
            const data = JSON.parse(script.textContent);
            State.products = data.products || [];
            State.filtered = [...State.products];
            initFuse();
            populateTagFilter();
            generateMonthFilters();
            updateProductCount();
            hideLoading();
            applyFilters();
        } catch (e) {
            console.error('Failed to parse embedded data:', e);
        }
    }

    function initFuse() {
        if (typeof Fuse !== 'undefined' && State.products.length > 0) {
            window.fuse = new Fuse(State.products, {
                keys: ['name', 'description', 'tags'],
                includeScore: true,
                threshold: 0.3
            });
        }
    }

    /* ===== Event Listeners ===== */
    function setupEventListeners() {
        dom.searchInput?.addEventListener('input', debounce(handleSearch, 150));
        dom.clearSearch?.addEventListener('click', clearSearch);
        dom.tagDropdownBtn?.addEventListener('click', toggleTagDropdown);
        dom.sortBtn?.addEventListener('click', handleSort);
        dom.promotedToggle?.addEventListener('click', togglePromoted);
        dom.favoritesToggle?.addEventListener('click', toggleFavoritesOnly);
        dom.exportBtn?.addEventListener('click', exportFavorites);
        dom.viewCard?.addEventListener('click', () => switchView('card'));
        dom.viewTable?.addEventListener('click', () => switchView('table'));
        dom.darkToggle?.addEventListener('click', toggleDarkMode);
        dom.clearAllFilters?.addEventListener('click', clearAllFilters);

        document.querySelectorAll('.th.sortable').forEach(th => {
            th.addEventListener('click', () => handleColumnSort(th.dataset.sort));
        });

        dom.tableScroll?.addEventListener('scroll', handleTableScroll);
        document.addEventListener('keydown', handleKeyboard);
        document.addEventListener('click', (e) => {
            if (dom.tagDropdownPanel && !dom.tagDropdownPanel.contains(e.target) && e.target !== dom.tagDropdownBtn && !dom.tagDropdownBtn.contains(e.target)) {
                closeTagDropdown();
            }
        });
        window.addEventListener('resize', debounce(handleResize, 100));
    }

    /* ===== Search ===== */
    function handleSearch(e) {
        State.filters.search = e.target.value.toLowerCase().trim();
        dom.searchBox?.classList.toggle('has-value', State.filters.search.length > 0);
        applyFilters();
    }

    function clearSearch() {
        if (dom.searchInput) dom.searchInput.value = '';
        State.filters.search = '';
        dom.searchBox?.classList.remove('has-value');
        applyFilters();
    }

    /* ===== Tag Dropdown ===== */
    function toggleTagDropdown(e) {
        e.stopPropagation();
        const isOpen = dom.tagDropdownPanel.style.display === 'block';
        dom.tagDropdownPanel.style.display = isOpen ? 'none' : 'block';
        dom.tagDropdownBtn.classList.toggle('open', !isOpen);
        dom.tagDropdownBtn.setAttribute('aria-expanded', !isOpen);
    }

    function closeTagDropdown() {
        dom.tagDropdownPanel.style.display = 'none';
        dom.tagDropdownBtn.classList.remove('open');
        dom.tagDropdownBtn.setAttribute('aria-expanded', 'false');
    }

        const idx = State.filters.tags.indexOf(tag);

            State.filters.tags.splice(idx, 1);
        } else {
            State.filters.tags.push(tag);
        }
        updateTagDropdownSelection();
        applyFilters();
    }

    /* ===== Sort ===== */
    function handleSort() {
        const btn = dom.sortBtn;
        const field = btn.dataset.sort;
        const currentDir = btn.dataset.dir;
        const newDir = currentDir === 'desc' ? 'asc' : 'desc';

        State.filters.sort = { field, dir: newDir };
        btn.dataset.dir = newDir;
        btn.classList.toggle('desc', newDir === 'desc');
        btn.classList.toggle('asc', newDir === 'asc');

        applyFilters();
    }

    function handleColumnSort(field) {

        const dir = current.field === field && current.dir === 'desc' ? 'asc' : 'desc';
        State.filters.sort = { field, dir };

        if (dom.sortBtn) {
            dom.sortBtn.dataset.sort = field;
            dom.sortBtn.dataset.dir = dir;
            dom.sortBtn.classList.toggle('desc', dir === 'desc');
            dom.sortBtn.classList.toggle('asc', dir === 'asc');
        }

        document.querySelectorAll('.th.sortable').forEach(th => {
            th.classList.toggle('active', th.dataset.sort === field);
        });

        applyFilters();
    }

    /* ===== Promoted Toggle ===== */
    function togglePromoted() {
        State.filters.promotedOnly = !State.filters.promotedOnly;
        dom.promotedToggle?.classList.toggle('active', State.filters.promotedOnly);
        dom.promotedToggle?.setAttribute('aria-pressed', State.filters.promotedOnly);
        applyFilters();
    }

    /* ===== View Switching ===== */
    function switchView(view) {
        State.view = view;
        State.cardPage = 0;

        dom.viewCard?.classList.toggle('active', view === 'card');
        dom.viewTable?.classList.toggle('active', view === 'table');
        dom.cardView.style.display = view === 'card' ? 'block' : 'none';
        dom.tableView.style.display = view === 'table' ? 'flex' : 'none';

        if (view === 'card') {
            renderCardView();
        } else {
            renderTableView();
        }
    }

    /* ===== Dark Mode ===== */
    function toggleDarkMode() {
        State.darkMode = !State.darkMode;
        document.documentElement.classList.toggle('dark-mode', State.darkMode);
        updateDarkToggleIcon();

        try {
            localStorage.setItem('ph-dark-mode', State.darkMode);
        } catch (e) { /* file:// may block localStorage */ }
    }

    function updateDarkToggleIcon() {
        const icon = dom.darkToggle?.querySelector('i');
        if (icon) {
            icon.className = State.darkMode ? 'fas fa-sun' : 'fas fa-moon';
        }
    }

    /* ===== Favorites ===== */
    function loadFavorites() {
        try {
            const saved = localStorage.getItem('ph-favorites');
            if (saved) {
                const arr = JSON.parse(saved);
                State.favorites = new Set(arr);
            }
        } catch (e) { /* file:// may block localStorage */ }
        updateFavoritesUI();
    }

    function saveFavorites() {
        try {
            localStorage.setItem('ph-favorites', JSON.stringify([...State.favorites]));
        } catch (e) { /* file:// may block localStorage */ }
        updateFavoritesUI();
    }

    function updateFavoritesUI() {
        if (dom.favCount) {
            dom.favCount.textContent = State.favorites.size > 0 ? State.favorites.size : '';
        }
        if (dom.favoritesToggle) {
            dom.favoritesToggle.classList.toggle('active', State.favoritesOnly);
            dom.favoritesToggle.setAttribute('aria-pressed', State.favoritesOnly);
        }
    }

    function getFavKey(product) {
        return (product.name || '') + '|' + (product.url || '');
    }

    function isFavorite(product) {
        return State.favorites.has(getFavKey(product));
    }

    function toggleFavorite(product, btn) {
        const key = getFavKey(product);
        if (State.favorites.has(key)) {
            State.favorites.delete(key);
            btn.classList.remove('bookmarked');
            btn.innerHTML = '<i class="far fa-star"></i>';
            btn.title = 'Add to favorites';
        } else {
            State.favorites.add(key);
            btn.classList.add('bookmarked');
            btn.innerHTML = '<i class="fas fa-star"></i>';
            btn.title = 'Remove from favorites';
        }
        saveFavorites();
        if (State.favoritesOnly) {
            applyFilters();
        }
    }

    function toggleFavoritesOnly() {
        State.favoritesOnly = !State.favoritesOnly;
        updateFavoritesUI();
        applyFilters();
    }

    function exportFavorites() {
        const favProducts = State.products.filter(p => isFavorite(p));
        const data = {
            exported_at: new Date().toISOString(),
            count: favProducts.length,
            products: favProducts
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'product-hunt-favorites-' + new Date().toISOString().slice(0, 19).replace(/:/g, '-') + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    /* ===== Filter Logic ===== */
    function applyFilters() {
        let results = [...State.products];

        if (State.filters.search) {
            if (window.fuse) {
                const searchResults = window.fuse.search(State.filters.search);
                const matchedIds = new Set(searchResults.map(r => r.item.name + r.item.url));
                results = results.filter(p => matchedIds.has(p.name + p.url));
            } else {
                const term = State.filters.search.toLowerCase();
                results = results.filter(p =>
                    p.name.toLowerCase().includes(term) ||
                    (p.description && p.description.toLowerCase().includes(term))
                );
            }
        }

        if (State.filters.tags.length > 0) {
            results = results.filter(p =>
                State.filters.tags.some(t => p.tags && p.tags.includes(t))
            );
        }

        if (State.filters.months.length > 0) {
            results = results.filter(p =>
                p.source_months && p.source_months.some(m => State.filters.months.includes(m))
            );
        }

        if (State.filters.promotedOnly) {
            results = results.filter(p => p.promoted);
        }

        if (State.favoritesOnly) {
            results = results.filter(p => isFavorite(p));
        }

        results.sort((a, b) => {
            const { field, dir } = State.filters.sort;
            let aVal, bVal;

            if (field === 'rank') {
                // Sort by rank: non-promoted (with rank) first, promoted (null) last
                aVal = a.rank !== null && a.rank !== undefined ? a.rank : Infinity;
                bVal = b.rank !== null && b.rank !== undefined ? b.rank : Infinity;
            } else {
                aVal = a[field];
                bVal = b[field];
            }

            if (typeof aVal === 'string') {
                aVal = aVal.toLowerCase();
                bVal = bVal.toLowerCase();
            }

            let cmp = 0;
            if (typeof aVal === 'number') {
                cmp = aVal - bVal;
            } else {
                cmp = aVal < bVal ? -1 : aVal > bVal ? 1 : 0;
            }

            return dir === 'asc' ? cmp : -cmp;
        });

        State.filtered = results;
        State.cardPage = 0;
        updateProductCount();
        updateActiveFiltersDisplay();
        updateClearButtonVisibility();

        if (State.filtered.length === 0) {
            showEmpty();
        } else {
            hideEmpty();
            if (State.view === 'card') {
                renderCardView();
            } else {
                renderTableView();
            }
        }
    }

    function updateProductCount() {
        if (dom.productCount) {
            dom.productCount.textContent = State.filtered.length;
        }
    }

    /* ===== Month Filters ===== */
    function generateMonthFilters() {
        if (!dom.monthFilters) return;

        const months = new Set();
        State.products.forEach(p => {
            if (p.source_months) {
                p.source_months.forEach(m => months.add(m));
            }
        });

        const monthOrder = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const sorted = [...months].sort((a, b) => {
            const [aName, aYear] = a.split(' ');
            const [bName, bYear] = b.split(' ');
            const yearDiff = parseInt(aYear || '0', 10) - parseInt(bYear || '0', 10);
            if (yearDiff !== 0) return yearDiff;
            return monthOrder.indexOf(aName) - monthOrder.indexOf(bName);
        });
        dom.monthFilters.innerHTML = '';

        sorted.forEach(m => {
            const btn = document.createElement('button');
            btn.className = 'filter-pill';
            btn.dataset.month = m;
            btn.title = m;
            btn.textContent = formatMonth(m);
            btn.addEventListener('click', () => toggleMonthFilter(m));
            dom.monthFilters.appendChild(btn);
        });
    }

    function formatMonth(m) {
        if (!m) return m;
        const shortNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const fullNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        // "Month YYYY" word format (e.g. "February 2026")
        const wordMatch = m.match(/^([A-Za-z]+)\s+(\d{4})$/);
        if (wordMatch) {
            const idx = fullNames.findIndex(n => n.toLowerCase() === wordMatch[1].toLowerCase());
            return idx >= 0 ? shortNames[idx] + " '" + wordMatch[2].slice(2) : wordMatch[1];
        }
        // "YYYY-MM" numeric format
        if (m.length >= 7) {
            const parts = m.split('-');
            if (parts.length >= 2) {
                const month = parseInt(parts[1], 10);
                return shortNames[month - 1] || parts[1];
            }
        }
        return m;
    }

    function getMonthClass(m) {
        if (!m) return '';
        const monthKeys = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
        const fullNames = ['january','february','march','april','may','june','july','august','september','october','november','december'];
        // "Month YYYY" word format
        const wordMatch = m.match(/^([A-Za-z]+)\s+\d{4}$/);
        if (wordMatch) {
            const idx = fullNames.indexOf(wordMatch[1].toLowerCase());
            return idx >= 0 ? monthKeys[idx] : '';
        }
        // "YYYY-MM" numeric format
        const parts = m.split('-');
        if (parts.length >= 2) return parts[1] || '';
        return '';
    }

    function toggleMonthFilter(month) {
        const idx = State.filters.months.indexOf(month);
        if (idx >= 0) {
            State.filters.months.splice(idx, 1);
        } else {
            State.filters.months.push(month);
        }

        dom.monthFilters?.querySelectorAll('.filter-pill').forEach(btn => {
            btn.classList.toggle('active', State.filters.months.includes(btn.dataset.month));
        });

        applyFilters();
    }

    /* ===== Active Filters Display ===== */
    function updateActiveFiltersDisplay() {
        if (!dom.activeFilters) return;

        dom.activeFilters.innerHTML = '';

        if (State.filters.search) {
            const tag = createActiveFilterTag('Search: ' + State.filters.search, 'search', null);
            dom.activeFilters.appendChild(tag);
        }

        State.filters.tags.forEach(tagVal => {
            const tag = createActiveFilterTag('Tag: ' + tagVal, 'tag', tagVal);
            dom.activeFilters.appendChild(tag);
        });

        State.filters.months.forEach(month => {
            const tag = createActiveFilterTag(formatMonth(month), 'month', month);
            dom.activeFilters.appendChild(tag);
        });
    }

    function createActiveFilterTag(text, type, value) {
        const tag = document.createElement('span');
        tag.className = 'active-filter-tag';
        tag.dataset.type = type;
        if (value) tag.dataset.value = value;

        const span = document.createElement('span');
        span.textContent = text;
        tag.appendChild(span);

        const remove = document.createElement('span');
        remove.className = 'remove';
        remove.textContent = '×';
        tag.appendChild(remove);

        tag.addEventListener('click', () => removeActiveFilter(type, value));

        return tag;
    }

    function removeActiveFilter(type, value) {
        switch (type) {
            case 'search':
                clearSearch();
                break;
            case 'tag':
                State.filters.tags = State.filters.tags.filter(t => t !== value);
                updateTagDropdownSelection();
                applyFilters();
                break;
            case 'month':
                toggleMonthFilter(value);
                break;
        }
    }

    function updateClearButtonVisibility() {
        const hasFilters = State.filters.search ||
            State.filters.tags.length > 0 ||
            State.filters.months.length > 0 ||
            State.filters.promotedOnly ||
            State.favoritesOnly ||
            State.filters.sort.field !== 'upvotes' || State.filters.sort.dir !== 'desc';

        if (dom.clearAllFilters) {
            dom.clearAllFilters.style.display = hasFilters ? 'block' : 'none';
        }
    }

    function clearAllFilters() {
        State.filters = {
            search: '',
            tags: [],
            months: [],
            promotedOnly: false,
            sort: { field: 'upvotes', dir: 'desc' }
        };
        State.favoritesOnly = false;

        if (dom.searchInput) dom.searchInput.value = '';
        if (dom.tagFilter) dom.tagFilter.value = '';
        if (dom.sortBtn) {
            dom.sortBtn.dataset.sort = 'upvotes';
            dom.sortBtn.dataset.dir = 'desc';
            dom.sortBtn.classList.add('desc');
            dom.sortBtn.classList.remove('asc');
        }
        dom.promotedToggle?.classList.remove('active');
        dom.favoritesToggle?.classList.remove('active');
        dom.searchBox?.classList.remove('has-value');

        dom.monthFilters?.querySelectorAll('.filter-pill').forEach(btn => {
            btn.classList.remove('active');
        });

        updateTagDropdownSelection();
        updateFavoritesUI();
        applyFilters();
    }

    /* ===== Card View Rendering ===== */
    function renderCardView() {
        if (!dom.cardGrid) return;

        const batch = State.filtered.slice(0, (State.cardPage + 1) * State.cardBatchSize);
        dom.cardGrid.innerHTML = '';

        batch.forEach(product => {
            const card = createCard(product);
            dom.cardGrid.appendChild(card);
        });

        if (batch.length < State.filtered.length) {
            setupInfiniteScroll();
        }
    }

    function getMonthRibbon(product) {
        const months = product.source_months || [];
        if (months.length === 0) return null;
        if (months.length > 1) {
            return { cls: 'month-multi', text: months.length + ' MOS' };
        }
        const m = months[0];
        const monthNames = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
        const displayNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        // Try YYYY-MM format
        const parts = m.split('-');
        if (parts.length >= 2) {
            const idx = parseInt(parts[1], 10) - 1;
            if (idx >= 0 && idx < 12) {
                return { cls: monthNames[idx], text: displayNames[idx] };
            }
        }

        // Try month name format (e.g. "February 2026")
        const lower = m.toLowerCase();
        for (let i = 0; i < 12; i++) {
            if (lower.includes(monthNames[i]) || lower.includes(displayNames[i].toLowerCase())) {
                return { cls: monthNames[i], text: displayNames[i] };
            }
        }

        return { cls: '', text: m };
    }

    function createCard(product) {
        const card = document.createElement('div');
        card.className = 'product-card';

        const ribbon = getMonthRibbon(product);
        if (ribbon) {
            const ribbonEl = document.createElement('div');
            ribbonEl.className = 'month-ribbon ' + ribbon.cls;
            ribbonEl.textContent = ribbon.text;
            card.appendChild(ribbonEl);
        }

        // Card header
        const header = document.createElement('div');
        header.className = 'card-header';

        const title = document.createElement('div');
        title.className = 'card-title';

        // Rank prefix for non-promoted products
        if (product.rank) {
            const rankSpan = document.createElement('span');
            rankSpan.className = 'card-rank';
            rankSpan.textContent = '#' + product.rank + ' ';
            title.appendChild(rankSpan);
        }

        const link = document.createElement('a');
        link.href = product.url || '#';
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = product.name || 'Unknown';

        title.appendChild(link);

        // Promoted badge
        if (product.promoted) {
            const badge = document.createElement('span');
            badge.className = 'promoted-badge';
            badge.innerHTML = '<i class="fas fa-star"></i> Promoted';
            title.appendChild(badge);
        }

        header.appendChild(title);
        card.appendChild(header);

        // Description
        const desc = document.createElement('div');
        desc.className = 'card-description';
        desc.textContent = product.description || 'No description';
        card.appendChild(desc);

        // Meta
        const meta = document.createElement('div');
        meta.className = 'card-meta';

        const upvotes = document.createElement('span');
        upvotes.className = 'metric upvotes';
        upvotes.innerHTML = '<i class="fas fa-arrow-up"></i> ' + formatNumber(product.upvotes);

        const comments = document.createElement('span');
        comments.className = 'metric comments';
        comments.innerHTML = '<i class="fas fa-comment"></i> ' + formatNumber(product.comments);

        meta.appendChild(upvotes);
        meta.appendChild(comments);
        card.appendChild(meta);

        // Tags
        const tagsDiv = document.createElement('div');
        tagsDiv.className = 'card-tags';

        const tags = product.tags || [];
        tags.slice(0, 4).forEach(t => {
            const pill = document.createElement('span');
            pill.className = 'tag-pill';
            pill.textContent = t;
            pill.dataset.tag = t;
            pill.addEventListener('click', (e) => {
                e.stopPropagation();
                addTagFilter(t);
            });
            tagsDiv.appendChild(pill);
        });

        card.appendChild(tagsDiv);

        // Footer
        const footer = document.createElement('div');
        footer.className = 'card-footer';

        const visitLink = document.createElement('a');
        visitLink.href = product.url || '#';
        visitLink.className = 'visit-btn';
        visitLink.target = '_blank';
        visitLink.rel = 'noopener noreferrer';
        visitLink.innerHTML = '<i class="fas fa-external-link-alt"></i> Visit';

        const bookmarkBtn = document.createElement('button');
        bookmarkBtn.className = 'bookmark-btn' + (isFavorite(product) ? ' bookmarked' : '');
        bookmarkBtn.innerHTML = isFavorite(product) ? '<i class="fas fa-star"></i>' : '<i class="far fa-star"></i>';
        bookmarkBtn.title = isFavorite(product) ? 'Remove from favorites' : 'Add to favorites';
        bookmarkBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            e.preventDefault();
            toggleFavorite(product, bookmarkBtn);
        });

        footer.appendChild(visitLink);
        footer.appendChild(bookmarkBtn);
        card.appendChild(footer);

        return card;
    }

    function addTagFilter(tag) {
        if (!State.filters.tags.includes(tag)) {
            State.filters.tags.push(tag);
        }
        updateTagDropdownSelection();
        applyFilters();
    }

    let intersectionObserver = null;

    function setupInfiniteScroll() {
        if (intersectionObserver) {
            intersectionObserver.disconnect();
        }

        intersectionObserver = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting) {
                State.cardPage++;
                renderCardView();
            }
        }, { rootMargin: '200px' });

        const sentinel = document.createElement('div');
        sentinel.id = 'scroll-sentinel';
        dom.cardGrid.appendChild(sentinel);
        intersectionObserver.observe(sentinel);
    }

    /* ===== Table View Rendering (Virtual Scrolling) ===== */
    function renderTableView() {
        if (!dom.virtualContent) return;

        const containerHeight = dom.tableScroll?.clientHeight || 600;
        const buffer = 5;
        const startIdx = Math.max(0, Math.floor(State.scrollTop / State.rowHeight) - buffer);
        const endIdx = Math.min(
            State.filtered.length,
            Math.ceil((State.scrollTop + containerHeight) / State.rowHeight) + buffer
        );

        const totalHeight = State.filtered.length * State.rowHeight;

        dom.virtualContainer.style.height = totalHeight + 'px';
        dom.virtualContent.style.transform = 'translateY(' + (startIdx * State.rowHeight) + 'px)';

        dom.virtualContent.innerHTML = '';

        for (let i = startIdx; i < endIdx; i++) {
            const product = State.filtered[i];
            const row = createTableRow(product, i);
            dom.virtualContent.appendChild(row);
        }
    }

    function createTableRow(product, index) {
        const row = document.createElement('div');
        row.className = 'table-row' + (product.promoted ? ' promoted' : '');
        row.dataset.index = index;

        // Bookmark (leftmost column)
        const bookmarkTd = document.createElement('div');
        bookmarkTd.className = 'td td-star';
        const bookmarkBtn = document.createElement('button');
        bookmarkBtn.className = 'bookmark-btn' + (isFavorite(product) ? ' bookmarked' : '');
        bookmarkBtn.innerHTML = isFavorite(product) ? '<i class="fas fa-star"></i>' : '<i class="far fa-star"></i>';
        bookmarkBtn.title = isFavorite(product) ? 'Remove from favorites' : 'Add to favorites';
        bookmarkBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleFavorite(product, bookmarkBtn);
        });
        bookmarkTd.appendChild(bookmarkBtn);

        // Rank
        const rankTd = document.createElement('div');
        rankTd.className = 'td td-rank';
        rankTd.textContent = product.rank || '';

        // Name
        const nameTd = document.createElement('div');
        nameTd.className = 'td';
        const nameLink = document.createElement('a');
        nameLink.href = product.url || '#';
        nameLink.className = 'product-link';
        nameLink.target = '_blank';
        nameLink.rel = 'noopener noreferrer';
        nameLink.textContent = product.name || 'Unknown';
        nameTd.appendChild(nameLink);

        // Description
        const descTd = document.createElement('div');
        descTd.className = 'td desc-text';
        descTd.textContent = product.description || '';

        // Upvotes
        const upvotesTd = document.createElement('div');
        upvotesTd.className = 'td td-num';
        upvotesTd.textContent = formatNumber(product.upvotes);

        // Comments
        const commentsTd = document.createElement('div');
        commentsTd.className = 'td td-num';
        commentsTd.textContent = formatNumber(product.comments);

        // Tags
        const tagsTd = document.createElement('div');
        tagsTd.className = 'td td-tags';
        const tags = product.tags || [];
        tags.forEach(t => {
            const tagSpan = document.createElement('span');
            tagSpan.className = 'tag-small';
            tagSpan.textContent = t;
            tagSpan.dataset.tag = t;
            tagSpan.addEventListener('click', () => addTagFilter(t));
            tagsTd.appendChild(tagSpan);
        });

        // Sources
        const sourcesTd = document.createElement('div');
        sourcesTd.className = 'td';
        const months = product.source_months || [];
        months.forEach(m => {
            const badge = document.createElement('span');
            badge.className = 'source-badge ' + getMonthClass(m);
            badge.textContent = formatMonth(m);
            badge.dataset.month = m;
            badge.addEventListener('click', () => toggleMonthFilter(m));
            sourcesTd.appendChild(badge);
        });

        // Action
        const actionTd = document.createElement('div');
        actionTd.className = 'td';
        const actionLink = document.createElement('a');
        actionLink.href = product.url || '#';
        actionLink.className = 'action-btn';
        actionLink.target = '_blank';
        actionLink.rel = 'noopener noreferrer';
        actionLink.innerHTML = '<i class="fas fa-external-link-alt"></i>';
        actionTd.appendChild(actionLink);

        row.appendChild(bookmarkTd);
        row.appendChild(rankTd);
        row.appendChild(nameTd);
        row.appendChild(descTd);
        row.appendChild(upvotesTd);
        row.appendChild(commentsTd);
        row.appendChild(tagsTd);
        row.appendChild(sourcesTd);
        row.appendChild(actionTd);

        return row;
    }

    function handleTableScroll() {
        State.scrollTop = dom.tableScroll?.scrollTop || 0;
        requestAnimationFrame(renderTableView);
    }

    function handleResize() {
        if (State.view === 'table') {
            renderTableView();
        }
    }

    /* ===== Keyboard Shortcuts ===== */
    function handleKeyboard(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
            if (e.key === 'Escape') {
                e.target.blur();
            }
            return;
        }

        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            dom.searchInput?.focus();
        }

        if (e.key === 'Escape') {
            closeTagDropdown();
        }

        if (e.key === '1' && !e.ctrlKey && !e.metaKey) {
            switchView('card');
        }
        if (e.key === '2' && !e.ctrlKey && !e.metaKey) {
            switchView('table');
        }
    }

    /* ===== Utilities ===== */
    function hideLoading() {
        if (dom.loadingState) dom.loadingState.style.display = 'none';
    }

    function showEmpty() {
        if (dom.emptyState) dom.emptyState.style.display = 'flex';
        if (dom.cardView) dom.cardView.style.display = 'none';
        if (dom.tableView) dom.tableView.style.display = 'none';
    }

    function hideEmpty() {
        if (dom.emptyState) dom.emptyState.style.display = 'none';
        if (dom.cardView) dom.cardView.style.display = State.view === 'card' ? 'block' : 'none';
        if (dom.tableView) dom.tableView.style.display = State.view === 'table' ? 'flex' : 'none';
    }

    function formatNumber(num) {
        if (num >= 1000000) return (num / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
        if (num >= 1000) return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
        return num?.toString() || '0';
    }

    function debounce(fn, delay) {
        let timeout;
        return function(...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => fn.apply(this, args), delay);
        };
    }

    /* ===== Populate Filters ===== */
    function populateTagFilter() {
        if (!dom.tagDropdownGrid) return;

        const allTags = new Set();
        State.products.forEach(p => {
            if (p.tags) {
                p.tags.forEach(t => allTags.add(t));
            }
        });

        const sorted = [...allTags].sort();
        dom.tagDropdownGrid.innerHTML = '';

        sorted.forEach(t => {
            const btn = document.createElement('button');
            btn.className = 'filter-pill';
            btn.dataset.tag = t;
            btn.textContent = t;
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleTagFilter(t);
            });
            dom.tagDropdownGrid.appendChild(btn);
        });

        updateTagDropdownSelection();
    }

    function updateTagDropdownSelection() {
        if (!dom.tagDropdownGrid) return;
        dom.tagDropdownGrid.querySelectorAll('.filter-pill').forEach(btn => {
            btn.classList.toggle('active', State.filters.tags.includes(btn.dataset.tag));
        });
    }

    /* ===== Public API ===== */
    window.AppState = State;
    window.App = {
        switchView,
        applyFilters,
        clearAllFilters,
        addTagFilter,
        toggleMonthFilter
    };

    /* ===== Initialize ===== */
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

})();
</script>
</body>
</html>
